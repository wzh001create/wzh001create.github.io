reserve 与逐次插入。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · unord.req","url":"https://eel.is/c++draft/unord.req"},{"label":"C++ 标准草案 · unord.map","url":"https://eel.is/c++draft/unord.map"}],"origins":[{"collectionId":"csdn-cpp","no":"59","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X61","category":"cpp","day":7,"priority":"P0","title":"构造函数为什么不能声明为 virtual？","answer":"语言规则禁止虚构造函数。构造函数建立对象及基类/成员状态，并不通过对已有对象的虚调用来选择“构造哪种完整类型”；运行期按类型创建对象可用工厂函数。析构函数则可以是虚函数，以支持通过基类接口正确销毁派生对象。","trap":"只说“虚表指针还没生成”容易把具体实现当成语言定义；工厂的 create 可以是虚函数，但构造本身不是。","lab":"实现一个返回 unique_ptr\u003cBase> 的工厂，并设置虚析构。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · class.ctor","url":"https://eel.is/c++draft/class.ctor"},{"label":"C++ 标准草案 · class.dtor","url":"https://eel.is/c++draft/class.dtor"},{"label":"C++ 标准草案 · class.virtual","url":"https://eel.is/c++draft/class.virtual"}],"origins":[{"collectionId":"csdn-cpp","no":"61","section":"C/C++ 面经"},{"collectionId":"csdn-cpp","no":"91","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X62","category":"cpp","day":7,"priority":"P1","title":"static 成员函数为什么不能是 virtual？","answer":"静态成员函数没有隐式对象参数，调用不依赖某个对象的动态类型；虚分派则围绕对象的动态类型进行。语言不允许把静态成员函数声明为 virtual。","trap":"可以在拿到有效对象后调用它的虚成员函数，但这不使静态函数本身变成虚函数。","lab":"分别实现 static 工厂函数与 virtual 业务函数，说明其调用对象。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · class.static.mfct","url":"https://eel.is/c++draft/class.static.mfct"},{"label":"C++ 标准草案 · class.virtual","url":"https://eel.is/c++draft/class.virtual"}],"origins":[{"collectionId":"csdn-cpp","no":"62","section":"C/C++ 面经"},{"collectionId":"csdn-cpp","no":"90","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X63","category":"cpp","day":7,"priority":"P1","title":"哪些函数不能是虚函数？inline 能否与 virtual 同用？","answer":"虚函数必须是合适的非静态成员函数；构造函数、静态成员函数和成员函数模板不能声明为虚函数，普通自由函数也不能。析构函数可以为虚函数；inline 与 virtual 不冲突，优化是否展开调用另说。","trap":"别背“内联函数不能是虚函数”；声明 inline 与机器码是否内联不是同一个维度。","lab":"写一个类内定义的虚函数，编译验证 inline/virtual 可共存。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · class.virtual","url":"https://eel.is/c++draft/class.virtual"},{"label":"C++ 标准草案 · temp.mem","url":"https://eel.is/c++draft/temp.mem"},{"label":"C++ 标准草案 · dcl.inline","url":"https://eel.is/c++draft/dcl.inline"}],"origins":[{"collectionId":"csdn-cpp","no":"63","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X64","category":"cpp","day":7,"priority":"P2","title":"如何限制对象创建方式，为什么不宜依赖技巧题设计？","answer":"可用非公开构造函数配合受控工厂来约束外部直接构造，并返回带合适删除器的智能指针。私有析构也会限制外部销毁，但工厂、友元和删除器需一起设计。该做法限定的是接口使用方式，不是所有可能的存储形式。","trap":"“私有构造就是单例”错误；工厂可以创建很多对象。限制为堆对象也不能代替清晰的所有权。","lab":"写一个静态 create 返回独占句柄的最小类，验证外部不能直接构造。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · class.access","url":"https://eel.is/c++draft/class.access"},{"label":"C++ 标准草案 · class.dtor","url":"https://eel.is/c++draft/class.dtor"},{"label":"C++ 标准草案 · unique.ptr","url":"https://eel.is/c++draft/unique.ptr"}],"origins":[{"collectionId":"csdn-cpp","no":"64","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X65","category":"cpp","day":7,"priority":"P2","title":"虚继承解决的是什么问题？","answer":"菱形继承中，虚继承让最派生对象中同一虚基类只保留一份共享基类子对象，并由最派生类负责相应初始化。它与用于运行期分派的虚函数是两个不同概念。","trap":"虚继承不自动解决所有名称二义性；可能带来布局复杂性和额外间接访问，优先评估是否应使用组合。","lab":"构造一个菱形继承例子，对比加 virtual 前后的基类子对象关系。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · class.mi","url":"https://eel.is/c++draft/class.mi"},{"label":"C++ 标准草案 · class.base.init","url":"https://eel.is/c++draft/class.base.init"}],"origins":[{"collectionId":"csdn-cpp","no":"65","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K31","section":"继承 / 多继承与菱形继承"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X66","category":"cpp","day":7,"priority":"P2","title":"运算符重载有哪些不能改变的规则？","answer":"只能重载语言允许的运算符，不能创造新运算符，也不能改变优先级、结合性和操作数个数。::、.、.*、?: 等不能重载；sizeof 等语言操作也不能借重载改变其含义。涉及内建类型时还要满足用户定义操作数等约束。","trap":"重载不改变原有语法规则；&&、|| 的重载也不保留内建短路求值语义。","lab":"为简单数值包装类实现 +，说明不能更改其优先级。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · over.oper","url":"https://eel.is/c++draft/over.oper"}],"origins":[{"collectionId":"csdn-cpp","no":"66","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K24","section":"运算符重载 / 语法与限制"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X67","category":"debug","day":5,"priority":"P0","title":"静态链接和动态链接分别在何时组织依赖？","answer":"静态链接把所需目标代码等整合进最终产物；动态链接保留对共享对象的依赖，由加载器在装载或运行时完成相应映射与符号解析。比较部署时要考虑文件大小、共享库版本、ABI、搜索路径和升级风险。","trap":"动态库被多个程序使用，不代表每个数据页都共享；“用了动态库所以随便替换版本”也不安全。","lab":"构建同一小库的静态与共享版本，用 readelf 查看依赖并在干净目录运行。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"官方文档 / 规范参考","url":"https://sourceware.org/binutils/docs/ld/"},{"label":"Linux man-pages · ld.so(8)","url":"https://man7.org/linux/man-pages/man8/ld.so.8.html"}],"origins":[{"collectionId":"csdn-cpp","no":"67","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X69","category":"debug","day":5,"priority":"P1","title":".bss、.data 与语言层面的初始化如何对应？","answer":"在常见 ELF 工具链下，需零初始化的静态存储数据常放在 .bss，带非零初值的可写静态数据常放在 .data；只读数据可能放在其他段/节。语言规定初始化语义，具体节布局由工具链与优化决定。","trap":"显式初始化为 0 的变量也可能进 .bss；“未初始化全局变量的值不确定”在这里通常错误。","lab":"用 nm、readelf 比较全局零值、非零值和只读对象的产物布局。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · basic.start.static","url":"https://eel.is/c++draft/basic.start.static"},{"label":"官方文档 / 规范参考","url":"https://sourceware.org/binutils/docs/binutils/readelf.html"}],"origins":[{"collectionId":"csdn-cpp","no":"69","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K02","section":"内存分区 / 可执行文件与内存段"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X70","category":"debug","day":5,"priority":"P1","title":"inline 是编译器必须展开函数的命令吗？","answer":"不是。inline 具有语言层面的多定义规则意义：符合要求的定义可出现在多个翻译单元中，常用于头文件。是否在调用处内联展开由优化器决定，未写 inline 的函数也可能被展开。","trap":"内联不总能提升性能，过度展开可能增加代码体积；不能将 inline 与 virtual 对立。","lab":"将函数放到公共头文件被两个源文件使用，再比较是否符合多定义要求。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · dcl.inline","url":"https://eel.is/c++draft/dcl.inline"},{"label":"C++ 标准草案 · basic.def.odr","url":"https://eel.is/c++draft/basic.def.odr"}],"origins":[{"collectionId":"csdn-cpp","no":"70","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X71","category":"cpp","day":4,"priority":"P1","title":"auto 推导与模板实例化怎样区分？","answer":"auto 根据初始化表达式按相应规则推导类型；按值 auto 常去掉顶层 const 和引用，需要引用时写 auto& 等。模板实例化根据模板实参形成所需实体，通常在编译期完成，并不是运行时把一段代码转换为各种类型。","trap":"auto 不是动态类型；decltype(auto) 的保留规则不同，不能混为一谈。","lab":"比较 auto、auto&、const auto& 对同一 const 对象的推导结果。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · dcl.spec.auto","url":"https://eel.is/c++draft/dcl.spec.auto"},{"label":"C++ 标准草案 · temp.inst","url":"https://eel.is/c++draft/temp.inst"},{"label":"C++ 标准草案 · temp.deduct","url":"https://eel.is/c++draft/temp.deduct"}],"origins":[{"collectionId":"csdn-cpp","no":"71","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X72","category":"cpp","day":4,"priority":"P0","title":"map、set 与 find / [] / at 的语义怎么区分？","answer":"set 保存键，map 保存键到值的映射，二者按比较规则有序。map.find 查找但不插入；operator[] 在键不存在时会插入并初始化对应值；at 不插入，缺失时抛 out_of_range。常见实现是平衡搜索树，标准主要约束语义与复杂度。","trap":"读取一个本应只读的 map 时使用 [] 可能悄悄修改容器；const map 没有该插入式访问接口。","lab":"对不存在的键依次使用 find、at 与 []，观察 size 和异常。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · map","url":"https://eel.is/c++draft/map"},{"label":"C++ 标准草案 · set","url":"https://eel.is/c++draft/set"},{"label":"C++ 标准草案 · map.access","url":"https://eel.is/c++draft/map.access"}],"origins":[{"collectionId":"csdn-cpp","no":"72","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X73","category":"linux","day":6,"priority":"P0","title":"fcntl 的 F_GETFL / F_SETFL / F_DUPFD 如何正确使用？","answer":"fcntl 是操作文件描述符的多功能接口。F_GETFL 获取文件状态标志，设置非阻塞通常先读取原标志再用 F_SETFL 合入 O_NONBLOCK；F_DUPFD 的第三个参数指定新 fd 的最小值。FD_CLOEXEC 使用 F_GETFD/F_SETFD 这一组接口。","trap":"F_DUPFD 不能省略所需第三参数；F_SETFL 不能随意修改所有 open 标志，不能把 O_SYNC 当作可随意动态切换项。","lab":"复制 fd 时显式给出下限，并验证保留原标志后设置非阻塞。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"int flags = fcntl(fd, F_GETFL);\nif (flags == -1) { /* 处理 errno */ }\nelse if (fcntl(fd, F_SETFL, flags | O_NONBLOCK) == -1) {\n    /* 处理 errno */\n}\n// 复制时需要下限参数：\nint copy_fd = fcntl(fd, F_DUPFD_CLOEXEC, 3);","sources":[{"label":"Linux man-pages · fcntl(2)","url":"https://man7.org/linux/man-pages/man2/fcntl.2.html"},{"label":"Linux man-pages · F_DUPFD(2const)","url":"https://man7.org/linux/man-pages/man2const/F_DUPFD.2const.html"},{"label":"Linux man-pages · F_GETFL(2const)","url":"https://man7.org/linux/man-pages/man2const/F_GETFL.2const.html"}],"origins":[{"collectionId":"csdn-cpp","no":"73","section":"C/C++ 面经"},{"collectionId":"csdn-linux","no":"1.4 fcntl","section":"文件 IO"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X76","category":"cpp","day":4,"priority":"P0","title":"怎样按容器和操作判断迭代器失效？","answer":"先查具体容器与操作。vector 重分配使所有指向其元素的迭代器、指针和引用失效；无重分配的插入也会影响插入位置及之后的迭代器。list 通常只在删除对应元素时使该元素迭代器失效；unordered 容器重哈希会使迭代器失效。","trap":"不能把 vector 的规则套到所有容器；erase 返回的新迭代器常用于安全继续遍历。","lab":"用 erase 的返回值写删除循环，并分别检查触发和不触发 vector 扩容的情况。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · vector.modifiers","url":"https://eel.is/c++draft/vector.modifiers"},{"label":"C++ 标准草案 · list.modifiers","url":"https://eel.is/c++draft/list.modifiers"},{"label":"C++ 标准草案 · unord.req","url":"https://eel.is/c++draft/unord.req"}],"origins":[{"collectionId":"csdn-cpp","no":"76","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X77","category":"debug","day":5,"priority":"P1","title":"函数重载在编译和链接阶段各发生什么？","answer":"编译器先进行名称查找、候选集合建立和重载决议，根据实参及转换序列选择函数。工具链常通过名称修饰区分链接符号，具体规则取决于 ABI。名称修饰不是重载选择本身。","trap":"普通函数不能只靠返回值类型区分重载；不要把运行期虚调用与重载决议混为一谈。","lab":"编译两个参数类型不同的重载，用 nm 和反修饰工具观察符号。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · over.match","url":"https://eel.is/c++draft/over.match"},{"label":"C++ 标准草案 · over.load","url":"https://eel.is/c++draft/over.load"},{"label":"官方文档 / 规范参考","url":"https://itanium-cxx-abi.github.io/cxx-abi/abi.html"}],"origins":[{"collectionId":"csdn-cpp","no":"77","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X80","category":"cpp","day":7,"priority":"P1","title":"静态成员与普通成员函数怎样互相访问？","answer":"普通成员函数可以访问可见的静态成员，也可以通过 this 访问当前对象的非静态成员。静态成员函数没有 this，可以访问静态成员；要访问非静态成员必须拿到一个合适对象或引用，并满足访问控制。","trap":"不是静态函数绝对不能访问普通成员，而是没有隐式对象可供访问。","lab":"把一个对象作为参数传给静态成员函数，读取它的成员并解释访问控制。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · class.static","url":"https://eel.is/c++draft/class.static"},{"label":"C++ 标准草案 · class.mfct.non.static","url":"https://eel.is/c++draft/class.mfct.non.static"}],"origins":[{"collectionId":"csdn-cpp","no":"80","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K19","section":"对象模型 / 静态与非静态成员"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X81","category":"cpp","day":7,"priority":"P0","title":"四种 C++ 显式类型转换应该如何区分？","answer":"static_cast 用于允许的静态转换；dynamic_cast 用于多态层次的运行期检查等场景；const_cast 调整 cv 限定；reinterpret_cast 处理规定范围内的低层重解释。能编译并不保证随后的访问安全。","trap":"去 const 后修改真正声明为 const 的对象是未定义行为；reinterpret_cast 不保证任意类型别名访问合法。","lab":"演示 dynamic_cast 指针失败返回空与引用失败抛异常，说明为什么不能用强转掩盖设计错误。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · expr.static.cast","url":"https://eel.is/c++draft/expr.static.cast"},{"label":"C++ 标准草案 · expr.dynamic.cast","url":"https://eel.is/c++draft/expr.dynamic.cast"},{"label":"C++ 标准草案 · expr.const.cast","url":"https://eel.is/c++draft/expr.const.cast"},{"label":"C++ 标准草案 · expr.reinterpret.cast","url":"https://eel.is/c++draft/expr.reinterpret.cast"}],"origins":[{"collectionId":"csdn-cpp","no":"81","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X84","category":"debug","day":5,"priority":"P2","title":"尾递归是什么，为什么不能保证常数栈空间？","answer":"递归调用结果直接作为当前函数结果，且后面无待完成计算时，可形成尾调用机会。优化器可能把调用转为循环或跳转以复用栈帧，但 C++ 不要求实现尾调用消除，局部对象析构等也可能影响优化。","trap":"“尾递归不会栈溢出”不是可移植保证；真正需要有界栈时使用显式迭代。","lab":"将累计式递归改为循环，并对比不同优化级别的汇编。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"官方文档 / 规范参考","url":"https://gcc.gnu.org/onlinedocs/gcc/Optimize-Options.html"}],"origins":[{"collectionId":"csdn-cpp","no":"84","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X85","category":"debug","day":12,"priority":"P1","title":"栈溢出常见原因及排查方式是什么？","answer":"深递归、过大的局部数组或线程栈设置过小都可能超出栈可用范围。Linux 的限制和映射可通过资源限制、线程属性与 /proc 等观察；保护页常把越界暴露为故障。先定位调用深度与局部对象，而不是一味增大栈。","trap":"栈大小不是所有 Linux 环境固定的一个值；堆也不是无限可用。","lab":"用小规模、可控制的递归程序配合 GDB 观察栈，避免影响其他服务。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · getrlimit(2)","url":"https://man7.org/linux/man-pages/man2/getrlimit.2.html"},{"label":"Linux man-pages · pthread_attr_setstacksize(3)","url":"https://man7.org/linux/man-pages/man3/pthread_attr_setstacksize.3.html"}],"origins":[{"collectionId":"csdn-cpp","no":"85","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X86","category":"cpp","day":7,"priority":"P1","title":"二叉树、二叉搜索树和平衡搜索树是什么关系？","answer":"二叉树只约束每个节点最多两个孩子；二叉搜索树增加键的有序关系，但可能退化成链。AVL、红黑树等通过不同约束控制树高，使查找、插入、删除维持对数级最坏复杂度，并付出维护平衡的成本。","trap":"普通二叉树不是天然可二分查找；平衡树并非所有节点左右高度都严格相同。","lab":"依次插入递增键到普通搜索树，观察树高，再解释平衡维护的价值。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"官方文档 / 规范参考","url":"https://opendatastructures.org/ods-cpp/6_Binary_Trees.html"},{"label":"官方文档 / 规范参考","url":"https://opendatastructures.org/ods-cpp/9_Red_Black_Trees.html"}],"origins":[{"collectionId":"csdn-cpp","no":"86","section":"C/C++ 面经"},{"collectionId":"csdn-cpp","no":"87","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X88","category":"cpp","day":7,"priority":"P0","title":"this 指针指向什么？const 成员函数如何影响访问？","answer":"普通非静态成员函数内，this 表达式指向正在操作的对象；在 const 成员函数中，其指向类型带 const 限定。它用于访问成员和把当前对象传给其他接口；静态成员函数没有 this。","trap":"this 是指针表达式，不是可由程序重新赋值的普通局部指针变量；对象失效后保存下来的 this 同样会悬空。","lab":"用 const 与非 const 重载观察成员访问限制，检查异步回调捕获 this 的生命周期。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · expr.prim.this","url":"https://eel.is/c++draft/expr.prim.this"},{"label":"C++ 标准草案 · class.mfct.non.static","url":"https://eel.is/c++draft/class.mfct.non.static"}],"origins":[{"collectionId":"csdn-cpp","no":"88","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K21","section":"对象模型 / this 与 const 成员函数"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X92","category":"cpp","day":4,"priority":"P1","title":"make_shared 的优势与取舍是什么？","answer":"make_shared 通常能把控制块与对象放在一次分配中，减少分配开销并简化创建。它不接收任意自定义删除器；在常见合并分配实现中，弱引用仍存活时，对象析构后整块分配可能暂时不能释放。","trap":"对象析构与整块内存归还不一定同时发生；工厂访问私有构造函数时还要注意 make_shared 内部调用的访问权限。","lab":"保留 weak_ptr 观察对象析构，并比较是否需要自定义删除器。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · util.smartptr.shared.create","url":"https://eel.is/c++draft/util.smartptr.shared.create"},{"label":"C++ 标准草案 · util.smartptr.weak","url":"https://eel.is/c++draft/util.smartptr.weak"}],"origins":[{"collectionId":"csdn-cpp","no":"92","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X93","category":"embedded","day":22,"priority":"P1","title":"一次函数调用通常需要完成哪些工作？","answer":"抽象层面要计算被调用对象与实参、初始化形参、执行函数体并返回结果；实现层面可能涉及寄存器传参、栈帧、保存恢复寄存器和跳转。内联、优化及 ABI 会改变具体指令。","trap":"不能背成所有函数都“参数压栈、开栈帧、恢复现场”这一固定序列；实参求值顺序也需按语言版本和表达式规则分析。","lab":"为一个简单函数开启与关闭优化，比较有没有独立调用和栈帧。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · expr.call","url":"https://eel.is/c++draft/expr.call"},{"label":"官方文档 / 规范参考","url":"https://github.com/ARM-software/abi-aa/blob/main/aapcs64/aapcs64.rst"}],"origins":[{"collectionId":"csdn-cpp","no":"93","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A01","category":"linux","day":6,"priority":"P0","title":"fd 为什么不一定从 3 开始，上限怎样查询？","answer":"open 等接口通常返回最低的可用描述符，0/1/2 若已关闭也可能被重新使用。每进程限制看 RLIMIT_NOFILE 等配置，系统总量限制又是另一层。标准输入输出可指向终端、管道、文件或其他对象。","trap":"1024 不是所有进程可打开文件数的固定上限，也不能把 select 的 fd_set 容量等同于整个进程的 fd 限制。","lab":"在隔离小程序中关闭一个标准描述符再 open，配合 ulimit -n 和 /proc/self/limits 查看限制。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · open(2)","url":"https://man7.org/linux/man-pages/man2/open.2.html"},{"label":"Linux man-pages · getrlimit(2)","url":"https://man7.org/linux/man-pages/man2/getrlimit.2.html"}],"origins":[{"collectionId":"csdn-linux","no":"1.1 描述符分配与上限","section":"文件 IO"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A02","category":"linux","day":6,"priority":"P0","title":"open 的 flags、mode 和 umask 如何配合？","answer":"flags 指定访问模式及创建、截断、追加等行为；O_CREAT 等需要的场合必须提供 mode。实际创建权限受 umask 及相关系统规则影响。Linux open 失败返回 -1 并设置 errno，成功返回可用 fd。","trap":"O_RDONLY 值为 0，不能简单用位与判断访问模式；O_TRUNC 是破坏性操作，练习只针对测试文件。","lab":"创建测试文件，对比不同 umask 下的权限，并处理打开失败。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · open(2)","url":"https://man7.org/linux/man-pages/man2/open.2.html"},{"label":"Linux man-pages · umask(2)","url":"https://man7.org/linux/man-pages/man2/umask.2.html"}],"origins":[{"collectionId":"csdn-linux","no":"1.2 open","section":"文件 IO"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A03","category":"linux","day":6,"priority":"P0","title":"close 释放什么？失败后可以盲目重试吗？","answer":"close 释放当前进程中的描述符引用；底层打开文件描述在最后引用消失后释放。Linux 在关闭过程较早就释放 fd 编号，之后仍可能报告写回等错误，因此不应盲目重试 close，否则可能关闭其他线程刚复用的 fd。","trap":"close 成功不等于持久化已保证；也不要把一个已交给 RAII 管理的 fd 再手工重复关闭。","lab":"为文件描述符包装关闭逻辑，检查只关闭一次和错误记录位置。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · close(2)","url":"https://man7.org/linux/man-pages/man2/close.2.html"},{"label":"Linux man-pages · fsync(2)","url":"https://man7.org/linux/man-pages/man2/fsync.2.html"}],"origins":[{"collectionId":"csdn-linux","no":"1.2 close","section":"文件 IO"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A04","category":"linux","day":6,"priority":"P0","title":"lseek 移动偏移就能把文件变大吗？","answer":"lseek 修改打开文件描述的当前偏移，可相对起点、当前位置或末尾定位。仅把偏移移到文件末尾之外不会扩大文件；随后写入才可能扩展并形成空洞。管道和流式套接字等通常不支持 seek。","trap":"返回的新偏移不是总能当作“文件大小”；不要把所有 fd 都当普通磁盘文件。","lab":"先 lseek 到末尾之后，用 stat 看大小不变，再写一个字节观察差异。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · lseek(2)","url":"https://man7.org/linux/man-pages/man2/lseek.2.html"}],"origins":[{"collectionId":"csdn-linux","no":"1.2 lseek","section":"文件 IO"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A05","category":"linux","day":6,"priority":"P0","title":"ftruncate 扩展文件与写零数据有什么区别？","answer":"truncate 按路径、ftruncate 按 fd 调整文件长度，变短会丢弃尾部，变长的区域读取表现为零。扩展可能形成稀疏区域，不等于已经为每个字节分配物理磁盘块，也不改变已有 fd 的文件偏移。","trap":"调整文件长度有破坏性；映射后文件被截短可能使后续访问产生 SIGBUS。","lab":"只对测试文件比较逻辑大小与实际占用，并检查每个返回值。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · truncate(2)","url":"https://man7.org/linux/man-pages/man2/truncate.2.html"},{"label":"Linux man-pages · mmap(2)","url":"https://man7.org/linux/man-pages/man2/mmap.2.html"}],"origins":[{"collectionId":"csdn-linux","no":"1.2 truncate / ftruncate","section":"文件 IO"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A06","category":"linux","day":6,"priority":"P0","title":"errno 与 perror 怎样使用，pthread 接口有什么不同？","answer":"errno 通常在线程范围提供最近相关失败的错误码，只有接口声明失败时才有意义；perror 按当前 errno 输出描述，可能被后续调用改写时应先保存。许多 pthread 函数直接返回错误号，应使用该返回值而非假定 errno。","trap":"成功不保证清零 errno；read 的有效字节数不是 strlen，而二进制 write 的长度也不应靠 strlen 猜。","lab":"分别故意触发 open 失败和 pthread 接口错误，用正确的错误号生成日志。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · errno(3)","url":"https://man7.org/linux/man-pages/man3/errno.3.html"},{"label":"Linux man-pages · perror(3)","url":"https://man7.org/linux/man-pages/man3/perror.3.html"},{"label":"Linux man-pages · pthreads(7)","url":"https://man7.org/linux/man-pages/man7/pthreads.7.html"}],"origins":[{"collectionId":"csdn-linux","no":"1.2 perror","section":"文件 IO"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A07","category":"debug","day":5,"priority":"P0","title":"部署和文件排查时 file 与 stat 分别看什么？","answer":"file 根据文件特征识别类型等信息，适合检查产物是否为目标架构 ELF。stat 查看文件类型、大小、权限、时间等元数据；二者不替代程序实际运行和依赖验证。","trap":"文件扩展名不能证明内容格式，也不能凭可执行权限判断二进制架构。","lab":"对主机编译产物、板端产物和软链接分别运行 file 与 stat。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · file(1)","url":"https://man7.org/linux/man-pages/man1/file.1.html"},{"label":"Linux man-pages · stat(1)","url":"https://man7.org/linux/man-pages/man1/stat.1.html"}],"origins":[{"collectionId":"csdn-linux","no":"1.3 file / stat 命令","section":"文件 IO"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A08","category":"linux","day":6,"priority":"P0","title":"stat、lstat、fstat 如何选择？","answer":"stat 通常跟随符号链接获取目标信息；lstat 获取链接本身信息；fstat 面向已经打开的 fd。需要在操作同一个已打开对象时检查属性，fstat 可避免重新按路径定位到另一个对象。","trap":"先按路径检查再打开可能存在竞争；stat 结果不能消除文件随后被更改的可能。","lab":"创建一个软链接，比较三种接口的类型、大小与 inode 信息。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · stat(2)","url":"https://man7.org/linux/man-pages/man2/stat.2.html"}],"origins":[{"collectionId":"csdn-linux","no":"1.3 stat / lstat / fstat","section":"文件 IO"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A09","category":"linux","day":6,"priority":"P0","title":"dup 和 dup2 共享偏移吗？dup2 何时是空操作？","answer":"dup 返回新 fd，但与原 fd 引用同一打开文件描述，共享偏移和相应状态标志。dup2 原子地把指定 newfd 指向 oldfd 的打开文件描述，必要时关闭原 newfd。oldfd==newfd 且 oldfd 有效时才是该特殊的空操作。","trap":"两个 fd 指向同一路径，不代表同一打开文件描述；别用 close(newfd)+dup(oldfd) 替代原子的定向复制。","lab":"先两次 open 同一文件，再做 dup2，通过偏移变化比较共享关系。","points":[],"follow":["FD_CLOEXEC 是描述符标志还是打开文件状态标志？"],"code":"","sources":[{"label":"Linux man-pages · dup(2)","url":"https://man7.org/linux/man-pages/man2/dup.2.html"}],"origins":[{"collectionId":"csdn-linux","no":"1.4 dup / dup2","section":"文件 IO"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A10","category":"linux","day":8,"priority":"P0","title":"如何定位进程并有序终止自己的程序？","answer":"先用 ps 等核对 PID、命令和状态，再对目标发送适当信号。SIGTERM 允许程序执行退出协议，必要时才考虑 SIGKILL；kill 的名字不意味着只能杀死进程，它可以发送多种信号。","trap":"不要照抄命令向不确定的 PID 发信号；SIGKILL 无法让程序运行清理处理函数。","lab":"启动自己的测试进程，对比 TERM 清理日志与 KILL 的行为。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · kill(2)","url":"https://man7.org/linux/man-pages/man2/kill.2.html"},{"label":"Linux man-pages · signal(7)","url":"https://man7.org/linux/man-pages/man7/signal.7.html"}],"origins":[{"collectionId":"csdn-linux","no":"2.1 进程命令","section":"进程与 IPC"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A11","category":"linux","day":8,"priority":"P0","title":"exec 会创建新 PID 吗，l / v / p / e 有什么含义？","answer":"exec 用新程序映像替换当前进程，通常保留 PID，成功不返回。l/v 区分可变参数列表与数组，p 表示相关形式按 PATH 查找，e 表示显式传递环境。启动子程序常先 fork 再 exec，并让父进程回收。","trap":"在 execl 类变参尾部使用适当的空指针哨兵；exec 不是新建进程的同义词。","lab":"用 execvp 运行一个已知命令，分别测试成功、路径错误和参数传递。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · exec(3)","url":"https://man7.org/linux/man-pages/man3/exec.3.html"},{"label":"Linux man-pages · execve(2)","url":"https://man7.org/linux/man-pages/man2/execve.2.html"}],"origins":[{"collectionId":"csdn-linux","no":"2.1 exec / execl / execlp","section":"进程与 IPC"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A12","category":"linux","day":8,"priority":"P0","title":"exit、_exit 与 main 的 return 有什么区别？","answer":"exit 做正常终止处理，包括注册的退出回调和 stdio 清理；_exit 跳过这类用户态终止处理，但内核仍处理资源关闭。main 返回触发正常终止；普通函数 return 只回到调用者。fork 后 exec 失败的子进程通常使用 _exit。","trap":"exit 不会像从当前普通函数一路返回那样析构所有自动对象；fork 后缓冲区副本可能因 exit 被重复刷新。","lab":"在 fork 前写入未刷新的测试输出，比较父子不同终止方式，避免误写真实数据。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · exit(3)","url":"https://man7.org/linux/man-pages/man3/exit.3.html"},{"label":"Linux man-pages · _exit(2)","url":"https://man7.org/linux/man-pages/man2/_exit.2.html"},{"label":"C++ 标准草案 · support.start.term","url":"https://eel.is/c++draft/support.start.term"}],"origins":[{"collectionId":"csdn-linux","no":"2.1 结束进程","section":"进程与 IPC"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A13","category":"linux","day":22,"priority":"P0","title":"传统守护化与服务管理器启动如何取舍？","answer":"传统守护化涉及脱离终端、建立会话、整理目录/权限掩码和文件描述符，有时采用双 fork 等策略。受 systemd 等服务管理器管理的程序通常更适合留在前台，由管理器负责监督、日志和重启。","trap":"不是名字以 d 结尾就自动是守护进程；守护化不等于进程永久存活或自动恢复。","lab":"为自己的前台程序写启动说明，核对日志去向和停止行为。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · daemon(7)","url":"https://man7.org/linux/man-pages/man7/daemon.7.html"},{"label":"Linux man-pages · setsid(2)","url":"https://man7.org/linux/man-pages/man2/setsid.2.html"}],"origins":[{"collectionId":"csdn-linux","no":"2.1 守护进程","section":"进程与 IPC"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A14","category":"linux","day":8,"priority":"P0","title":"waitpid 一定非阻塞吗，如何解析退出状态？","answer":"waitpid 可指定目标子进程；选项为 0 时通常阻塞等待，加入 WNOHANG 才可在没有可报告状态时返回 0。返回正数表示相应子 PID，-1 是错误。先检查 WIFEXITED/WIFSIGNALED，再读取对应状态宏。","trap":"一次 waitpid(-1,...) 不会同时回收所有子进程；应根据返回结果循环，正确处理 EINTR 和 ECHILD。","lab":"创建两个短生命周期子进程，用循环回收并记录各自退出方式。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · wait(2)","url":"https://man7.org/linux/man-pages/man2/wait.2.html"}],"origins":[{"collectionId":"csdn-linux","no":"2.1 wait / waitpid","section":"进程与 IPC"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A15","category":"linux","day":8,"priority":"P0","title":"pipe 的两端如何在 fork 后关闭？","answer":"pipe 返回读端 pipefd[0] 和写端 pipefd[1]。fork 后父子各持有相应引用，按单向通信分工关闭不需要的一端；读到 EOF 要等所有写端引用关闭且缓冲数据读完。双向通信可用两条管道或合适套接字。","trap":"匿名管道常通过继承共享，但“只能有血缘关系通信”忽略了可通过 Unix 域套接字传递 fd 等情况。","lab":"父子通过一条管道通信，故意保留多余写端，解释为何迟迟没有 EOF。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · pipe(2)","url":"https://man7.org/linux/man-pages/man2/pipe.2.html"},{"label":"Linux man-pages · pipe(7)","url":"https://man7.org/linux/man-pages/man7/pipe.7.html"}],"origins":[{"collectionId":"csdn-linux","no":"2.2 管道通信 / 匿名管道","section":"进程与 IPC"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A16","category":"linux","day":8,"priority":"P0","title":"FIFO 的名字代表数据保存在磁盘吗？","answer":"FIFO 通过文件系统路径提供会合点，数据仍经内核管道缓冲传递，不是普通磁盘文件内容。可用 mkfifo 建立，并通过 open/read/write 操作；阻塞或非阻塞打开在读写端是否就绪时有不同规则。","trap":"不能用普通文件偏移或 seek 理解 FIFO，也不能认为有名字就会自动持久保存消息。","lab":"在两个终端中用测试 FIFO 通信，检查先开读端与先开写端的阻塞情况。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · fifo(7)","url":"https://man7.org/linux/man-pages/man7/fifo.7.html"},{"label":"Linux man-pages · mkfifo(3)","url":"https://man7.org/linux/man-pages/man3/mkfifo.3.html"}],"origins":[{"collectionId":"csdn-linux","no":"2.2 有名管道","section":"进程与 IPC"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A17","category":"linux","day":8,"priority":"P0","title":"管道容量、PIPE_BUF 和 SIGPIPE 分别解决什么？","answer":"管道容量限制可缓冲总量，可按系统接口查询；PIPE_BUF 是特定条件下写入不与其他写入交错的边界，不等于总容量。无数据且仍有写端时读可能等待；无读端写入会产生 SIGPIPE，若信号被处理/忽略则需处理 EPIPE。","trap":"默认容量不是普遍固定 4 KB；有缓冲空间也不能忽略部分写入、阻塞模式和多写者协议。","lab":"查询 F_GETPIPE_SZ，测试关闭所有写端后的 EOF 与关闭读端后的 EPIPE。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · pipe(7)","url":"https://man7.org/linux/man-pages/man7/pipe.7.html"},{"label":"Linux man-pages · F_GETPIPE_SZ(2const)","url":"https://man7.org/linux/man-pages/man2const/F_GETPIPE_SZ.2const.html"}],"origins":[{"collectionId":"csdn-linux","no":"2.2 管道容量 / 读写行为","section":"进程与 IPC"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A18","category":"linux","day":9,"priority":"P0","title":"mmap 的长度、偏移、失败值和 munmap 怎样处理？","answer":"映射长度应大于零，文件偏移按运行系统页大小对齐；页大小通过 sysconf 等查询，不能固定写死。失败返回 MAP_FAILED 而非 NULL。munmap 撤销映射；映射建立后关闭原 fd 并不等于解除映射。","trap":"offset 可以是 0；文件长度与映射长度要匹配使用范围，超出文件有效范围访问可能故障。","lab":"为测试文件映射一段区域，验证关闭 fd 后仍能访问，munmap 后则不能再用。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · mmap(2)","url":"https://man7.org/linux/man-pages/man2/mmap.2.html"},{"label":"Linux man-pages · sysconf(3)","url":"https://man7.org/linux/man-pages/man3/sysconf.3.html"}],"origins":[{"collectionId":"csdn-linux","no":"2.3 创建 / 释放内存映射","section":"进程与 IPC"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A19","category":"linux","day":9,"priority":"P0","title":"共享映射是否必须先写盘再让另一进程读取？","answer":"多个进程的 MAP_SHARED 映射可指向相同底层内存页，彼此可见不需要每次数据先绕磁盘。匿名共享映射也可在合适场景通过继承共享。数据可见性、线程/进程间同步和持久化是三个不同问题。","trap":"MAP_SHARED 本身不替代互斥或协议；mmap 也不是专指“动态库区域”，不必依赖普通磁盘文件。","lab":"使用共享区域加进程共享同步原语交换计数，说明 msync 与互斥的不同作用。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · mmap(2)","url":"https://man7.org/linux/man-pages/man2/mmap.2.html"},{"label":"Linux man-pages · msync(2)","url":"https://man7.org/linux/man-pages/man2/msync.2.html"},{"label":"Linux man-pages · pthread_mutexattr_getpshared(3)","url":"https://man7.org/linux/man-pages/man3/pthread_mutexattr_getpshared.3.html"}],"origins":[{"collectionId":"csdn-linux","no":"2.3 映射进程通信","section":"进程与 IPC"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A20","category":"linux","day":9,"priority":"P0","title":"用 mmap 拷贝文件要处理哪些边界？","answer":"先获取并验证源大小，零长度文件单独处理；创建目标并设置足够长度，分别映射后复制有效字节，再处理同步/关闭和失败回滚。大文件可分块映射，避免地址空间和资源压力。","trap":"mmap 后 memcpy 仍有数据拷贝；“自动写回”不代表断电时一定完整落盘。","lab":"实现只操作测试目录的映射复制，验证空文件和目标创建失败。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · mmap(2)","url":"https://man7.org/linux/man-pages/man2/mmap.2.html"},{"label":"Linux man-pages · truncate(2)","url":"https://man7.org/linux/man-pages/man2/truncate.2.html"},{"label":"Linux man-pages · msync(2)","url":"https://man7.org/linux/man-pages/man2/msync.2.html"}],"origins":[{"collectionId":"csdn-linux","no":"2.3 内存映射拷贝文件","section":"进程与 IPC"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A21","category":"linux","day":9,"priority":"P0","title":"System V 共享内存如何创建，ftok 能保证唯一吗？","answer":"shmget 使用 key 创建或查找共享内存段，返回 shmid。IPC_CREAT 表示需要时创建，配合 IPC_EXCL 可检测已有对象；ftok 由已有路径及项目标识生成 key，但可能碰撞。共享内存段的 ID、key 和映射地址不同。","trap":"宏为 IPC_CREAT 而非 IPC_CREATE；不能把 ftok 输出当全球唯一 ID。","lab":"在隔离测试中创建、检查已存在情况并清理共享段，用 ipcs 核对。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · shmget(2)","url":"https://man7.org/linux/man-pages/man2/shmget.2.html"},{"label":"Linux man-pages · ftok(3)","url":"https://man7.org/linux/man-pages/man3/ftok.3.html"}],"origins":[{"collectionId":"csdn-linux","no":"2.4 shmget / ftok","section":"进程与 IPC"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A22","category":"linux","day":9,"priority":"P0","title":"shmat、shmdt 怎样管理映射地址？","answer":"shmat 把共享内存段附加到调用进程地址空间，返回可访问地址，失败是 (void*)-1。不同进程可能映射到不同虚拟地址。shmdt 解除当前附加；进程退出也会解除其附加，但这不等于立即删除共享段。","trap":"共享结构中不要直接保存只能在本进程解释的裸指针，可使用偏移等表示；函数名是 shmat。","lab":"两个进程打印同一共享段的映射地址，使用偏移定位共享数据。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · shmop(2)","url":"https://man7.org/linux/man-pages/man2/shmop.2.html"}],"origins":[{"collectionId":"csdn-linux","no":"2.4 shmat / shmdt","section":"进程与 IPC"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A23","category":"linux","day":9,"priority":"P0","title":"IPC_RMID 标记删除后，共享内存何时释放？","answer":"shmctl 的 IPC_RMID 把段标记删除，实际销毁要等最后附加解除。应用应设计明确的创建者、使用者和清理职责，检查调用结果；共享内存生命周期并不由某一个进程的退出自动完全管理。","trap":"“重复调用删除永远无害”不可依赖；ID 失效或状态改变都可能返回错误。","lab":"一个进程标记删除、另一个保持附加，用 ipcs 和实际访问观察阶段变化。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · shmctl(2)","url":"https://man7.org/linux/man-pages/man2/shmctl.2.html"},{"label":"Linux man-pages · shmop(2)","url":"https://man7.org/linux/man-pages/man2/shmop.2.html"}],"origins":[{"collectionId":"csdn-linux","no":"2.4 shmctl / 生命周期","section":"进程与 IPC"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A24","category":"linux","day":9,"priority":"P0","title":"shm 一定比 mmap 快，mmap 一定能抗断电吗？","answer":"System V shm 和 mmap 是不同接口族，可都把共享内存映射到进程地址空间。性能依赖访问模式、缺页、同步及后端，不能仅按接口名排序。文件映射的持久化还需考虑同步与存储保证；匿名共享内存不提供断电持久性。","trap":"共享映射不是经磁盘逐次转发；mmap 也不自动提供事务或崩溃一致性。","lab":"从命名方式、生命周期、同步和持久化四个维度比较，而不是给出绝对速度排名。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · shm_overview(7)","url":"https://man7.org/linux/man-pages/man7/shm_overview.7.html"},{"label":"Linux man-pages · mmap(2)","url":"https://man7.org/linux/man-pages/man2/mmap.2.html"},{"label":"Linux man-pages · msync(2)","url":"https://man7.org/linux/man-pages/man2/msync.2.html"}],"origins":[{"collectionId":"csdn-linux","no":"2.4 shm 与 mmap 对比","section":"进程与 IPC"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A25","category":"linux","day":12,"priority":"P0","title":"信号产生、未决、递达和屏蔽是什么关系？","answer":"信号产生后尚未递达时处于未决状态；屏蔽会暂缓相关信号递达，不等于不产生，也不同于忽略。信号处置通常是进程属性，屏蔽掩码是每线程属性。普通信号通常不按每次产生排队累计。","trap":"不要把 sigset_t 的大小或位布局当稳定 API；代码使用接口和 SIG 名称，不能写死架构编号。","lab":"屏蔽 SIGUSR1，发送后查询未决，再解除屏蔽观察处理。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · signal(7)","url":"https://man7.org/linux/man-pages/man7/signal.7.html"},{"label":"Linux man-pages · sigpending(2)","url":"https://man7.org/linux/man-pages/man2/sigpending.2.html"},{"label":"Linux man-pages · pthread_sigmask(3)","url":"https://man7.org/linux/man-pages/man3/pthread_sigmask.3.html"}],"origins":[{"collectionId":"csdn-linux","no":"3.1 信号状态 / 3.3 阻塞与未决","section":"信号"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A26","category":"linux","day":12,"priority":"P0","title":"kill、raise、abort 的目标和用途如何区分？","answer":"kill 按 PID 等规则向目标发送信号；raise 向调用者发送相应信号，多线程中针对调用线程；abort 触发异常终止相关行为，使用 SIGABRT。它们都不应代替正常业务的错误返回和可控退出协议。","trap":"kill(pid,0) 可做存在/权限检查但存在竞争，不能据此保证后续操作仍针对原进程。","lab":"仅对自己创建的测试程序发送用户信号，不把 abort 当普通退出手段。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · kill(2)","url":"https://man7.org/linux/man-pages/man2/kill.2.html"},{"label":"Linux man-pages · raise(3)","url":"https://man7.org/linux/man-pages/man3/raise.3.html"},{"label":"Linux man-pages · abort(3)","url":"https://man7.org/linux/man-pages/man3/abort.3.html"}],"origins":[{"collectionId":"csdn-linux","no":"3.2 kill / raise / abort","section":"信号"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A27","category":"linux","day":12,"priority":"P0","title":"alarm 有哪些调度和信号方面的限制？","answer":"alarm 安排经过给定实时时间后产生 SIGALRM，新调用会替换原定时；alarm(0) 可取消。返回值表示之前闹钟剩余秒数。信号产生和处理函数获得 CPU 执行之间可能存在延迟。","trap":"信号处理函数不能随意调用日志、分配内存等非异步信号安全操作；alarm 与 ITIMER_REAL 可能相互影响。","lab":"设置并取消自己的测试定时器，记录单调时钟实测延迟，不要求精确实时。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · alarm(2)","url":"https://man7.org/linux/man-pages/man2/alarm.2.html"},{"label":"Linux man-pages · signal-safety(7)","url":"https://man7.org/linux/man-pages/man7/signal-safety.7.html"}],"origins":[{"collectionId":"csdn-linux","no":"3.2 alarm","section":"信号"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A28","category":"linux","day":12,"priority":"P0","title":"ITIMER_REAL、VIRTUAL、PROF 分别按什么计时？","answer":"ITIMER_REAL 按现实经过时间计时并产生 SIGALRM；ITIMER_VIRTUAL 按进程用户态 CPU 时间产生 SIGVTALRM；ITIMER_PROF 按用户态加内核态 CPU 时间产生 SIGPROF。it_value 是首次超时，it_interval 是后续间隔。","trap":"PROF 不是“只统计内核时间”；普通信号可能合并，不能把收到信号次数当准确计时次数。","lab":"对比睡眠程序与忙循环对三类定时器的影响；新设计也可评估 timerfd 等接口。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · setitimer(2)","url":"https://man7.org/linux/man-pages/man2/setitimer.2.html"},{"label":"Linux man-pages · timerfd_create(2)","url":"https://man7.org/linux/man-pages/man2/timerfd_create.2.html"}],"origins":[{"collectionId":"csdn-linux","no":"3.2 setitimer","section":"信号"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A29","category":"linux","day":12,"priority":"P0","title":"如何使用 sigset_t，而不是自行操作位图？","answer":"使用 sigemptyset、sigfillset、sigaddset、sigdelset、sigismember 构造和查询集合。再用相应接口读写掩码或查询未决信号，检查返回值。集合对象只是描述所选信号，不会单凭创建它就更改线程掩码。","trap":"不能用一个普通整数替代 sigset_t，也不能靠假定内部位数遍历所有合法信号。","lab":"构造只含 SIGUSR1 的集合，并在设置线程掩码前后比较行为。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · sigsetops(3)","url":"https://man7.org/linux/man-pages/man3/sigsetops.3.html"},{"label":"Linux man-pages · pthread_sigmask(3)","url":"https://man7.org/linux/man-pages/man3/pthread_sigmask.3.html"}],"origins":[{"collectionId":"csdn-linux","no":"3.3 信号集操作函数","section":"信号"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A30","category":"linux","day":12,"priority":"P0","title":"多线程程序如何统一处理退出信号？","answer":"多线程环境优先用 pthread_sigmask 控制调用线程掩码；可在创建工作线程前屏蔽选定信号，使新线程继承掩码，再用专门线程 sigwait，或在 Linux 中使用 signalfd。sigpending 查询调用上下文中的未决集合。","trap":"屏蔽不是忽略；SIGKILL 和 SIGSTOP 无法通过此办法阻止。不要直接在异步处理函数里锁业务互斥锁。","lab":"用信号等待线程接收 SIGTERM，再触发队列关闭和 join。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · pthread_sigmask(3)","url":"https://man7.org/linux/man-pages/man3/pthread_sigmask.3.html"},{"label":"Linux man-pages · sigwait(3)","url":"https://man7.org/linux/man-pages/man3/sigwait.3.html"},{"label":"Linux man-pages · signalfd(2)","url":"https://man7.org/linux/man-pages/man2/signalfd.2.html"}],"origins":[{"collectionId":"csdn-linux","no":"3.3 sigprocmask / sigpending","section":"信号"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A31","category":"linux","day":12,"priority":"P0","title":"为什么用 sigaction 明确注册信号处理行为？","answer":"sigaction 明确描述处理函数、处理期间的掩码和标志，可获取旧设置。使用 SA_SIGINFO 时选择相应签名的处理函数。处理代码受异步信号安全约束，复杂退出通常转交正常执行上下文完成。","trap":"signal 的历史语义存在平台差异；清空 sa_mask 也不意味着当前信号一定不会被临时屏蔽，需看标志规则。","lab":"用 sigaction 为测试信号安装最小处理逻辑，并核对被中断系统调用的处理。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · sigaction(2)","url":"https://man7.org/linux/man-pages/man2/sigaction.2.html"},{"label":"Linux man-pages · signal(2)","url":"https://man7.org/linux/man-pages/man2/signal.2.html"},{"label":"Linux man-pages · signal-safety(7)","url":"https://man7.org/linux/man-pages/man7/signal-safety.7.html"}],"origins":[{"collectionId":"csdn-linux","no":"3.4 信号捕捉 / signal / sigaction","section":"信号"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A32","category":"thread","day":11,"priority":"P0","title":"线程数为什么不能机械设为核心数的两倍？","answer":"合理并发度由 CPU 工作量、等待比例、任务粒度、缓存与内存压力、硬件并行能力共同决定。CPU 密集任务可从核心数附近试验，I/O 密集则需测量等待和瓶颈。有状态外设或串行服务还可能限制应用实际可利用的并发度。","trap":"2×核心数不是 I/O 程序效率最高的通用公式；增加线程可能只增加排队和竞争。","lab":"固定输入，改变工作线程数，记录吞吐、时延、CPU 和内存。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · pthreads(7)","url":"https://man7.org/linux/man-pages/man7/pthreads.7.html"},{"label":"Linux man-pages · sched(7)","url":"https://man7.org/linux/man-pages/man7/sched.7.html"}],"origins":[{"collectionId":"csdn-linux","no":"4.1 线程数与性能","section":"多线程"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A33","category":"thread","day":9,"priority":"P0","title":"pthread_create 的参数、返回值和 pthread_t 怎样使用？","answer":"pthread_create 接收线程入口 void* (*)(void*) 与上下文指针，成功返回 0，失败返回错误号。pthread_t 是不透明标识，应按接口使用；比较使用 pthread_equal，获取当前线程 ID 用 pthread_self。","trap":"把 for 循环变量地址反复传给线程容易竞争和越界生命周期；不要假定 pthread_t 就是内核 TID 或固定整数类型。","lab":"为每个线程准备稳定上下文，用 -pthread 构建并正确检查创建失败。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · pthread_create(3)","url":"https://man7.org/linux/man-pages/man3/pthread_create.3.html"},{"label":"Linux man-pages · pthread_self(3)","url":"https://man7.org/linux/man-pages/man3/pthread_self.3.html"},{"label":"Linux man-pages · pthread_equal(3)","url":"https://man7.org/linux/man-pages/man3/pthread_equal.3.html"}],"origins":[{"collectionId":"csdn-linux","no":"4.2 创建线程","section":"多线程"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A34","category":"thread","day":9,"priority":"P0","title":"线程 return、pthread_exit 与进程 exit 有何区别？","answer":"线程入口 return 和 pthread_exit 可结束当前线程并提供退出值；exit 终止整个进程。退出值不能指向已结束线程的自动存储对象。使用 pthread_exit 还应理解清理处理与线程局部资源规则。","trap":"主线程从 main 返回通常使整个进程结束，不能靠 detach 让工作线程脱离进程继续活着。","lab":"让工作线程返回堆上或外部有效对象，join 后按明确所有权释放。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · pthread_exit(3)","url":"https://man7.org/linux/man-pages/man3/pthread_exit.3.html"},{"label":"Linux man-pages · exit(3)","url":"https://man7.org/linux/man-pages/man3/exit.3.html"}],"origins":[{"collectionId":"csdn-linux","no":"4.3 线程退出","section":"多线程"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A35","category":"thread","day":9,"priority":"P0","title":"pthread_join 谁可以调用？为什么必须设计回收责任？","answer":"join 等待一个可连接线程结束并回收相关资源，可取得退出值；调用者不必是所谓“主线程”，但要避免多线程同时 join 同一目标或等待自身。必须为每个可连接线程安排唯一回收责任。","trap":"join 不等于强制停止线程；线程等着你持有的锁时，持锁 join 可能死锁。","lab":"用关闭标志和唤醒协议先让工作线程退出，再 join。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · pthread_join(3)","url":"https://man7.org/linux/man-pages/man3/pthread_join.3.html"}],"origins":[{"collectionId":"csdn-linux","no":"4.4 线程回收","section":"多线程"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A36","category":"thread","day":11,"priority":"P0","title":"pthread_cancel 是立即杀线程吗？什么是取消点？","answer":"pthread_cancel 发出取消请求，是否以及何时响应由取消状态和类型决定。默认延迟取消通常在取消点处理；取消点不等于任意系统调用。应安排清理处理函数，避免资源半释放或锁遗留，工程上常优先用协作退出。","trap":"不能承诺请求返回时目标已退出；异步取消风险更高，不能靠它替代正常关闭协议。","lab":"对一个有取消点的测试线程请求取消并 join，核对清理函数执行。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · pthread_cancel(3)","url":"https://man7.org/linux/man-pages/man3/pthread_cancel.3.html"},{"label":"Linux man-pages · pthreads(7)","url":"https://man7.org/linux/man-pages/man7/pthreads.7.html"},{"label":"Linux man-pages · pthread_cleanup_push(3)","url":"https://man7.org/linux/man-pages/man3/pthread_cleanup_push.3.html"}],"origins":[{"collectionId":"csdn-linux","no":"4.6 线程取消","section":"多线程"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A37","category":"thread","day":9,"priority":"P0","title":"pthread_mutex 的初始化、加锁、解锁和销毁有什么约束？","answer":"使用前通过静态初始化器或 pthread_mutex_init 正确初始化；在每条访问共享约束的路径上使用同一同步协议。检查返回的错误号，由合法持有者解锁，销毁时确保没有线程持有或等待该锁。C++ 可用 RAII 减少遗漏。","trap":"trylock 返回失败需要分支处理，不是自动避免死锁的魔法；重复锁同一普通互斥锁的行为不能随意依赖。","lab":"制造早返回分支，比较手工解锁与 lock_guard 的资源路径。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · pthread_mutex_init(3)","url":"https://man7.org/linux/man-pages/man3/pthread_mutex_init.3.html"},{"label":"C++ 标准草案 · thread.lock.guard","url":"https://eel.is/c++draft/thread.lock.guard"}],"origins":[{"collectionId":"csdn-linux","no":"5.2 互斥锁操作","section":"线程同步"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A38","category":"thread","day":10,"priority":"P0","title":"读写锁一定写优先，也一定优于互斥锁吗？","answer":"读锁允许多个读者，写锁要求排他访问；等待者的顺序和饥饿策略依实现与配置，不应默认全部平台写优先。读多写少也需结合临界区长度和管理成本评估，短临界区可能普通互斥锁更合适。","trap":"读锁内写共享数据仍是错误；把读锁直接升级成写锁可能死锁，必须查明并设计升级协议。","lab":"在可复现读写比例下比较两种锁，并记录最慢写等待时间。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · pthread_rwlock_rdlock(3)","url":"https://man7.org/linux/man-pages/man3/pthread_rwlock_rdlock.3.html"},{"label":"Linux man-pages · pthread_rwlockattr_setkind_np(3)","url":"https://man7.org/linux/man-pages/man3/pthread_rwlockattr_setkind_np.3.html"}],"origins":[{"collectionId":"csdn-linux","no":"5.4 读写锁","section":"线程同步"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A39","category":"thread","day":10,"priority":"P0","title":"条件变量的通知和超时返回后该做什么？","answer":"wait 原子地释放互斥锁并等待，返回前重新取得锁；signal/broadcast 唤醒等待者去竞争锁和复查谓词。超时参数通常是所配置时钟上的绝对时间点，返回超时也应在锁内检查业务条件和退出状态。","trap":"通知不是永久消息；wait 返回不代表条件成立。不要把绝对截止时刻误写成相对等待秒数。","lab":"为阻塞队列增加关闭和超时测试，同时测试没有等待者时发通知。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · pthread_cond_wait(3)","url":"https://man7.org/linux/man-pages/man3/pthread_cond_wait.3.html"},{"label":"C++ 标准草案 · thread.condition","url":"https://eel.is/c++draft/thread.condition"}],"origins":[{"collectionId":"csdn-linux","no":"5.5 timedwait / signal / broadcast","section":"线程同步"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A40","category":"thread","day":10,"priority":"P0","title":"信号量能否用于互斥？与 mutex 有什么区别？","answer":"信号量维护许可计数，wait 获取许可，post 归还或发布许可。正确使用初值为 1 的信号量可实现互斥，但它与拥有者语义明确的 mutex 不同，允许不同线程发布许可。生产者消费者常分别管理空位与数据数量。","trap":"“信号量完全不能保证线程安全”过于绝对；能否安全取决于是否正确覆盖共享状态和业务约束。","lab":"画出队列空位和元素两种计数的变化，再说明队列内部为何仍可能需要互斥。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · sem_overview(7)","url":"https://man7.org/linux/man-pages/man7/sem_overview.7.html"},{"label":"Linux man-pages · sem_init(3)","url":"https://man7.org/linux/man-pages/man3/sem_init.3.html"}],"origins":[{"collectionId":"csdn-linux","no":"5.6 信号量","section":"线程同步"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"A41","category":"thread","day":10,"priority":"P0","title":"POSIX 信号量的错误返回和跨进程使用要注意什么？","answer":"sem_init 的 pshared 非零用于进程共享时，sem_t 本身必须位于共享内存。sem_wait 等失败通常返回 -1 并设置 errno，需处理 EINTR；trywait 无许可时给出 EAGAIN，timedwait 使用规定时钟的绝对截止时间。","trap":"不能照 pthread 接口方式直接把返回值当错误号；销毁仍有等待者的信号量不安全。","lab":"测试无许可、超时、信号中断与正常 post，并保证退出时无人继续等待。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · sem_wait(3)","url":"https://man7.org/linux/man-pages/man3/sem_wait.3.html"},{"label":"Linux man-pages · sem_init(3)","url":"https://man7.org/linux/man-pages/man3/sem_init.3.html"},{"label":"Linux man-pages · sem_destroy(3)","url":"https://man7.org/linux/man-pages/man3/sem_destroy.3.html"}],"origins":[{"collectionId":"csdn-linux","no":"5.6 sem_init / wait / trywait / timedwait / post","section":"线程同步"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"B01","category":"cpp","day":1,"title":"一个可移植的 C++ 入门程序应包含哪些要素？","answer":"包含需要的标准头文件，在全局定义 main，并用 std:: 限定标准库名称。头文件提供声明，不等于把整个标准库编译进来。main 正常返回可以用返回值表达成功与失败；交互示例不应靠特定平台的暂停命令维持窗口。","points":["std::cout 声明来自 \u003ciostream>；std::string 应直接包含 \u003cstring>。","普通换行可用 \"\\n\"；std::endl 还会刷新输出流。"],"trap":"不要把 using namespace std; 当成每个头文件都必须加的语句。","follow":["为什么公共头文件通常不整体引入命名空间？","编译完成后如何在终端运行？"],"lab":"用 g++ -std=c++17 -Wall -Wextra 编译一个输出与读取程序。","sources":[{"label":"C++ 标准草案 · basic.start.main","url":"https://eel.is/c++draft/basic.start.main"},{"label":"C++ 标准草案 · namespace.udir","url":"https://eel.is/c++draft/namespace.udir"},{"label":"C++ 标准草案 · ostream.manip","url":"https://eel.is/c++draft/ostream.manip"}],"priority":"P0","code":"#include \u003ciostream>\nint main() {\n    std::cout \u003c\u003c \"Hello, Linux\\n\";\n    return 0;\n}","origins":[{"collectionId":"csdn-cpp-basics","no":"B01","section":"Hello C++ / 程序、头文件与输出"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"B02","category":"c","day":1,"title":"局部变量未初始化时可以默认当成 0 吗？","answer":"不可以。按 C++17 的常用情形，局部自动存储期的 int x; 没有得到有效初值，读取它通常是未定义行为。int x{}; 则将该整数初始化为 0。静态存储期对象另有零初始化阶段，不能把它的规则套用到普通局部变量。","points":["初始化与之后的赋值是不同阶段。","类类型的默认初始化可能调用构造函数，不能一律理解为清零。"],"trap":"调试器显示 0、调试构建填入固定模式，都不是语言保证。","follow":["int a[4]{} 与 int a[4]; 有什么差别？","对象的存储期和生命周期如何区分？"],"lab":"开启未初始化警告，对比显式初始化的写法；不要为了观察而读取无效值。","sources":[{"label":"C++ 标准草案 · dcl.init","url":"https://eel.is/c++draft/dcl.init"},{"label":"C++ 标准草案 · basic.start.static","url":"https://eel.is/c++draft/basic.start.static"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-basics","no":"B02","section":"Hello C++ / 变量与初始化"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"B03","category":"c","day":1,"title":"标识符、关键字与实现保留名称怎么区分？","answer":"关键字不能作为普通变量名；名字还受标识符规则及保留名称规则约束。工程中宜用清晰的普通字母、数字和下划线命名，并避免双下划线，以及以下划线加大写字母开头的标识符。","points":["名字区分大小写。","普通变量不能以数字开头；语言实际还允许部分非 ASCII 标识符。"],"trap":"“只要不是关键字就随便起名”忽略了标准库和实现保留名字。","follow":["头文件防重复宏怎样命名？","局部与全局同名会产生什么影响？"],"lab":"检查一个头文件中的 include guard 和全局标识符，去掉实现保留形式。","sources":[{"label":"C++ 标准草案 · lex.name","url":"https://eel.is/c++draft/lex.name"},{"label":"C++ 标准草案 · global.names","url":"https://eel.is/c++draft/global.names"}],"priority":"P1","code":"","origins":[{"collectionId":"csdn-cpp-basics","no":"B04","section":"Hello C++ / 关键字、标识符"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"B04","category":"c","day":2,"title":"int、long、char、bool 的大小都固定吗？","answer":"不固定。C++ 规定基本类型的能力和一些相对大小约束，而不规定 int 永远 4 字节、long 永远 8 字节。sizeof(char) 恒为 1，但这里的字节位数由实现决定；bool 的值是 false/true，并不能由此推出其存储大小固定为 1。","points":["用 sizeof、CHAR_BIT、std::numeric_limits 检查实现属性。","固定宽度整数类型在实现提供该类型时可用，但序列化仍要明确字节序。"],"trap":"把常见 x86-64 Linux 的结果背成所有平台的规则会误导跨平台开发。","follow":["LP64 与 LLP64 的 long 有何差异？","size_t 为什么不宜直接用 int 接收？"],"lab":"输出目标环境各类型大小和数值范围；只把结果作为该环境记录。","sources":[{"label":"C++ 标准草案 · basic.fundamental","url":"https://eel.is/c++draft/basic.fundamental"},{"label":"C++ 标准草案 · support.types","url":"https://eel.is/c++draft/support.types"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-basics","no":"B05","section":"数据类型 / 整型与 bool"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"B05","category":"cpp","day":2,"title":"浮点数为什么会出现精度误差，比较时要注意什么？","answer":"有限位数的浮点表示不能精确存下所有实数；在常见二进制实现中，一些简单十进制小数也只能近似表示。运算包含舍入，判断近似相等时需要根据数据量级和业务允许误差制定标准，不能把固定 epsilon 当成适用于所有场景的答案。","points":["float、double 的精度与范围通过 numeric_limits 查询。","将整数相除后赋给浮点变量，不能恢复已经截断的小数部分。"],"trap":"不要把输出显示的位数当成内部有效精度；也不要声称浮点数永远不能用 ==。","follow":["钱款能否用浮点数表示？","比较 NaN 时会出现什么特殊情况？"],"lab":"打印 max_digits10 精度下的结果，对比 1/2 与 1.0/2。","sources":[{"label":"C++ 标准草案 · basic.fundamental","url":"https://eel.is/c++draft/basic.fundamental"},{"label":"C++ 标准草案 · numeric.limits","url":"https://eel.is/c++draft/numeric.limits"},{"label":"C++ 标准草案 · conv.fpint","url":"https://eel.is/c++draft/conv.fpint"}],"priority":"P1","code":"","origins":[{"collectionId":"csdn-cpp-basics","no":"B07","section":"数据类型 / 浮点型"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"B06","category":"c","day":2,"title":"字符、字符串与结束符 \\0 的区别是什么？","answer":"字符是单个字符类型的值；C 风格字符串是由空字符终止的字符序列，数组容量还要为结束符留空间。字符字面量和字符串字面量类型不同。std::string 自己管理长度，可以包含内嵌的空字符。","points":["char s[] = \"ab\"; 数组有三个元素。","UTF-8 汉字可能占多个字节，std::string::size() 统计的是 char 元素数，不是人眼看到的字符数。"],"trap":"C++ 不保证所有字符都只用 ASCII；不能用 strlen 读取没有有效终止符的缓冲区。","follow":["sizeof(\"ab\") 与 strlen(\"ab\") 的结果为何不同？","字符串字面量为什么不应被修改？"],"lab":"构造 std::string(\"a\\0b\", 3)，比较 size() 与 strlen(c_str())。","sources":[{"label":"C++ 标准草案 · lex.string","url":"https://eel.is/c++draft/lex.string"},{"label":"C++ 标准草案 · lex.ccon","url":"https://eel.is/c++draft/lex.ccon"},{"label":"C++ 标准草案 · basic.string","url":"https://eel.is/c++draft/basic.string"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-basics","no":"B08","section":"数据类型 / 字符、转义与字符串"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"B07","category":"cpp","day":2,"title":"std::string 与 char 数组在所有权和接口上有什么差别？","answer":"std::string 是管理字符序列的值类型，支持自动资源管理、拷贝与移动；char 数组的容量在类型中固定，传参时还常退化为指针。与 C 接口交互时，要明确指针有效期、是否要求空终止以及是否允许写入。","points":["不能把 c_str() 返回的只读指针当作任意可写输出缓冲区。","修改 string 可能令此前取得的指针或迭代器失效；不要无条件长期缓存。"],"trap":"string 对象的 sizeof 不是字符串实际字符长度。","follow":["如何将 string 交给只读 C API？","data() 与 c_str() 在 C++17 下如何理解？"],"lab":"写接收 const char* 和长度的打印函数，用 string 和字符数组各调用一次。","sources":[{"label":"C++ 标准草案 · basic.string","url":"https://eel.is/c++draft/basic.string"},{"label":"C++ 标准草案 · string.accessors","url":"https://eel.is/c++draft/string.accessors"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-basics","no":"B09","section":"数据类型 / C++ 字符串"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"B08","category":"cpp","day":2,"title":"cin >> 与 getline 为什么混用时容易读到空行？","answer":"格式化提取通常跳过前导空白并按类型读取，但可能把行尾分隔符留在流中；随后 getline 会读到它并立刻结束。应按输入协议选择清理当前行，或使用 std::ws 跳过空白；后者会跳过所有前导空白，不适合保留空行的协议。","points":["以读取表达式的成功与否驱动循环，读取失败后检查流状态。","恢复格式错误输入需要清除错误状态，并按协议消耗不合法字符。"],"trap":"while (!eof()) 不能保证下一次读取成功。","follow":["std::ws 会不会改变前导空格？","failbit 与 eofbit 可以同时出现吗？"],"lab":"用 istringstream 输入数字加下一行文本，测试空行、错误数字和正常结束。","sources":[{"label":"C++ 标准草案 · istream.formatted.reqmts","url":"https://eel.is/c++draft/istream.formatted.reqmts"},{"label":"C++ 标准草案 · string.io","url":"https://eel.is/c++draft/string.io"},{"label":"C++ 标准草案 · ios.iostate","url":"https://eel.is/c++draft/ios.iostate"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-basics","no":"B10","section":"数据类型 / 输入"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"B09","category":"c","day":2,"title":"整数除法、取余和溢出有哪些边界？","answer":"整数除法结果向 0 截断；在结果可表示时，商和余数满足 a == (a/b)*b + a%b。除以 0 是无效操作；有符号整数溢出在 C++17 中是未定义行为，不能假定自动回绕。无符号算术按其类型的模运算规则处理。","points":["-7/3 为 -2，-7%3 为 -1。","最小有符号整数除以 -1 若结果不可表示，也有问题。"],"trap":"1/2 的整数结果是 0，再赋给 double 仍是 0。","follow":["有符号和无符号混合比较有何风险？","如何在乘法前检查容量计算是否溢出？"],"lab":"用合法边界值检查商和余数；对危险表达式先做范围检查再计算。","sources":[{"label":"C++ 标准草案 · expr.mul","url":"https://eel.is/c++draft/expr.mul"},{"label":"C++ 标准草案 · basic.fundamental","url":"https://eel.is/c++draft/basic.fundamental"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-basics","no":"B11","section":"运算符 / 算数运算"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"B10","category":"c","day":2,"title":"逻辑短路、赋值与比较表达式有哪些常见误写？","answer":"内置 && 和 || 从左侧开始并短路，因此可以先检查指针再访问对象。& 和 | 是按位运算，不提供同样的逻辑短路。条件中的赋值、连续大小比较也可能编译通过，却不符合业务意图。","points":["0 \u003c x && x \u003c 10 才表达区间判断；0 \u003c x \u003c 10 不是数学链式比较。","if (x = 1) 是赋值后的条件判断，不是比较；开启编译告警。"],"trap":"类类型重载的逻辑运算符不保留内置运算符那样的短路行为。","follow":["p && p->ready 为什么常用？","位掩码检查时应该用哪个运算符？"],"lab":"用计数函数验证 && / || 的短路，并复写一个输入校验表达式。","sources":[{"label":"C++ 标准草案 · expr.log.and","url":"https://eel.is/c++draft/expr.log.and"},{"label":"C++ 标准草案 · expr.log.or","url":"https://eel.is/c++draft/expr.log.or"},{"label":"C++ 标准草案 · expr.ass","url":"https://eel.is/c++draft/expr.ass"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-basics","no":"B13","section":"运算符 / 赋值、比较与逻辑"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"B11","category":"c","day":2,"title":"if 与 switch 在作用域和分支执行上有何区别？","answer":"if 能表达一般条件；switch 按转换后的整数或枚举条件匹配常量 case 标签。case 本身不自动形成新的块作用域，缺少 break 可能继续执行后续分支。需要局部对象时用花括号建立清晰作用域。","points":["有意贯穿可在 C++17 中使用 [[fallthrough]] 表达意图。","不能从一个 case 直接跨过不允许被跳过的变量初始化进入其作用域。"],"trap":"switch 没有 break 不一定是错误，但必须是明确设计；default 也不是错误处理的全部。","follow":["为什么 case 内定义对象常加花括号？","break 退出 switch 还是外层循环？"],"lab":"写一个枚举状态处理函数，开启 switch 和 fallthrough 相关告警。","sources":[{"label":"C++ 标准草案 · stmt.switch","url":"https://eel.is/c++draft/stmt.switch"},{"label":"C++ 标准草案 · stmt.dcl","url":"https://eel.is/c++draft/stmt.dcl"},{"label":"C++ 标准草案 · dcl.attr.fallthrough","url":"https://eel.is/c++draft/dcl.attr.fallthrough"}],"priority":"P1","code":"","origins":[{"collectionId":"csdn-cpp-basics","no":"B14","section":"程序流程 / 选择结构"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"B12","category":"c","day":2,"title":"for、while、do-while 以及 break/continue 如何选择？","answer":"循环形式首先影响条件测试和更新的时机。while 可以一次不执行，do-while 至少执行一次；for 便于把计数初始化、条件和更新放在一起。break 结束最近的循环或 switch，continue 则开始最近一层循环的下一轮。","points":["for 的 continue 会走到迭代表达式，再进行条件检查。","while 的 continue 不会替你执行写在循环体末尾的计数更新。"],"trap":"嵌套循环中的 break 不会自动跳出所有层；无符号倒序计数也容易下溢。","follow":["循环退出条件如何保持可验证？","处理错误时 return 与 break 各影响哪一层？"],"lab":"把同一个数组遍历改成三种循环，验证空输入、单元素和嵌套循环。","sources":[{"label":"C++ 标准草案 · stmt.iter","url":"https://eel.is/c++draft/stmt.iter"},{"label":"C++ 标准草案 · stmt.jump","url":"https://eel.is/c++draft/stmt.jump"}],"priority":"P1","code":"","origins":[{"collectionId":"csdn-cpp-basics","no":"B15","section":"程序流程 / 循环与跳转"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"B13","category":"c","day":1,"title":"二维数组作为函数参数时，为什么不是 int**？","answer":"int a[2][3] 是两个元素组成的数组，每个元素又是一个含 3 个 int 的数组。在常见表达式和参数调整中它变为指向一行的指针 int (*)[3]，不是指向指针的指针。列宽属于行类型的一部分，决定指针递增的距离。","points":["int** 通常指向一个指针对象，内存布局与连续二维数组不同。","std::array 的嵌套类型或显式行列加连续存储也能表达矩阵。"],"trap":"不能通过强制转换把二维数组安全地变成 int**。","follow":["如何保留行数与列数信息？","&a 与 a 的类型分别是什么？"],"lab":"写接收 int (&a)[2][3] 的函数，并打印 sizeof(a) 与 sizeof(a[0])。","sources":[{"label":"C++ 标准草案 · dcl.array","url":"https://eel.is/c++draft/dcl.array"},{"label":"C++ 标准草案 · conv.array","url":"https://eel.is/c++draft/conv.array"},{"label":"C++ 标准草案 · dcl.fct","url":"https://eel.is/c++draft/dcl.fct"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-basics","no":"B17","section":"数组 / 二维数组"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"B17","category":"cpp","day":7,"title":"冒泡排序的循环边界与时间复杂度怎样解释？","answer":"每一轮比较相邻元素并按序交换，可以把尚未就位的最大元素推到当前末尾。已就位的后缀不再参与下一轮。普通实现的平均和最坏比较量是二次级；增加“本轮未发生交换就结束”后，有序输入可以线性完成。","points":["循环应保证 j+1 不越界，先处理长度小于 2 的情况。","相等时不交换可保留稳定性；交换规则变了要重新判断。"],"trap":"“最常用”不是选择算法的依据，实际 C++ 程序通常优先使用合适的标准算法。","follow":["冒泡与选择排序的稳定性如何比较？","为什么要避免 unsigned 的 n-1 下溢？"],"lab":"对空数组、单元素、重复值、逆序和有序输入进行测试。","sources":[{"label":"C++ 标准草案 · alg.sorting","url":"https://eel.is/c++draft/alg.sorting"}],"priority":"P1","code":"","origins":[{"collectionId":"csdn-cpp-basics","no":"B18","section":"数组 / 冒泡排序与边界"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"B16","category":"debug","day":5,"title":"函数声明、定义与分文件编译是什么关系？","answer":"声明向编译器描述函数的名字和类型；定义还提供函数体。使用声明可以分文件编译，链接时需要找到匹配的定义。公共头文件放声明；普通非内联函数的定义通常放一个源文件，避免重复定义。","points":["头文件保护只防同一翻译单元内重复包含，不自动解决跨翻译单元的多重定义。","声明和定义的命名空间、参数类型及语言链接等需要匹配。"],"trap":"不要在每个 cpp 中各写一份可能不一致的函数声明。","follow":["未定义引用为什么可能到链接时才出现？","头文件中哪些定义可以合法重复？"],"lab":"创建 main.cpp、util.cpp、util.h，通过 CMake 构建；故意漏掉 util.cpp 观察报错。","sources":[{"label":"C++ 标准草案 · basic.def","url":"https://eel.is/c++draft/basic.def"},{"label":"C++ 标准草案 · basic.def.odr","url":"https://eel.is/c++draft/basic.def.odr"},{"label":"C++ 标准草案 · dcl.fct","url":"https://eel.is/c++draft/dcl.fct"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-basics","no":"B19","section":"函数 / 声明、定义与分文件"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"B14","category":"c","day":1,"title":"指针加减为什么必须考虑同一数组的边界？","answer":"指针加减是按指向的元素类型移动，不是任意地址计算。通常只允许在同一数组对象内以及其尾后一位置范围内形成结果；尾后指针可用于结束标记，但不能解引用。两个指针求差也要求满足同一数组等规则。","points":["p+1 的跨度依赖类型，而不是始终 1 字节。","不要对已释放对象形成的悬空指针继续执行遍历。"],"trap":"数值地址看起来相邻，并不自动允许把两个无关对象当一个数组。","follow":["end 指针为什么可以比较却不能读取？","ptrdiff_t 用来表达什么？"],"lab":"用 begin/end 遍历固定数组；将所有解引用放在 p != end 条件之后。","sources":[{"label":"C++ 标准草案 · expr.add","url":"https://eel.is/c++draft/expr.add"},{"label":"C++ 标准草案 · basic.compound","url":"https://eel.is/c++draft/basic.compound"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-basics","no":"B25","section":"指针 / 数组与步进"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"B15","category":"cpp","day":3,"title":"结构体如何初始化、传参和管理嵌套成员？","answer":"结构体可以把相关数据组织成一个类型；在满足聚合类型条件时可用聚合初始化。传值会创建参数对象，传引用或指针则访问原对象。包含指针的结构体默认拷贝指针值，不会自动复制指向的资源。","points":["只读的大对象可考虑 const 引用；小而廉价的值可直接传值。","struct 可以包含成员函数与构造函数，它和 class 都属于类类型。"],"trap":"不能把“结构体复制”理解为递归复制整个指针可达对象图。","follow":["嵌套结构体何时随着外层对象销毁？","为什么含 string 的对象不适合直接 fwrite？"],"lab":"写一个含 string 和嵌套配置的结构体，比较传值与 const 引用；再讨论裸指针成员的所有权。","sources":[{"label":"C++ 标准草案 · dcl.init.aggr","url":"https://eel.is/c++draft/dcl.init.aggr"},{"label":"C++ 标准草案 · class.copy.ctor","url":"https://eel.is/c++draft/class.copy.ctor"},{"label":"C++ 标准草案 · class.access","url":"https://eel.is/c++draft/class.access"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-basics","no":"B26","section":"结构体 / 定义、嵌套与传参"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K01","category":"cpp","day":3,"title":"返回引用时，如何证明被引用对象还活着？","answer":"返回引用不会自动延长被引用对象的生命。不能返回普通局部对象的引用；返回成员引用也要求调用者保证所属对象仍存在。优先返回值；只有确实需要借用语义时，才清楚约定引用的有效期和修改权限。","points":["返回静态对象引用虽可避免局部悬空，却带来共享状态和并发问题。","从另一个引用继续传递，不会重复延长临时对象生命周期。"],"trap":"“第一次访问输出正确”不代表返回局部引用合法。","follow":["const 引用返回能阻止悬空吗？","返回容器元素引用后扩容会怎样？"],"lab":"写一个安全按值返回 string 的函数；让编译器对返回局部引用的反例发出警告，不运行反例。","sources":[{"label":"C++ 标准草案 · dcl.init.ref","url":"https://eel.is/c++draft/dcl.init.ref"},{"label":"C++ 标准草案 · class.temporary","url":"https://eel.is/c++draft/class.temporary"},{"label":"C++ 标准草案 · stmt.return","url":"https://eel.is/c++draft/stmt.return"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K05","section":"引用 / 返回值"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K02","category":"cpp","day":3,"title":"const 引用绑定临时对象会一直延长其生命周期吗？","answer":"不能一概而论。局部 const 引用直接绑定到符合规则的临时对象时，通常可把该临时对象延长到引用的生命周期；但参数、返回语句和其他上下文有例外。通过引用再转交不会再次延长生命，const 也不提供所有权。","points":["void f(const T&) 在调用期间借用临时对象可以正常工作，但把其地址保存到调用之后可能悬空。","只读引用也可绑定已有对象；这时不会改变原对象的生命周期。"],"trap":"“用了 const T&，临时对象就永远安全”是错误推断。","follow":["返回 const T& 为什么可能比按值返回更危险？","哪类场景更适合值返回？"],"lab":"画出局部引用和函数参数引用两种情况下的临时对象存活区间。","sources":[{"label":"C++ 标准草案 · class.temporary","url":"https://eel.is/c++draft/class.temporary"},{"label":"C++ 标准草案 · dcl.init.ref","url":"https://eel.is/c++draft/dcl.init.ref"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K06","section":"引用 / const 引用与临时对象"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K03","category":"cpp","day":7,"title":"默认参数怎样与声明、重载和虚函数交互？","answer":"默认实参由调用点能看到的声明决定。普通参数列表里，带默认值的参数之后通常也需有可用默认值。不能在同一作用域重复给已有默认值；不同声明可按规则补充。重载与默认值并用时要检查候选是否二义。","points":["仅靠返回值不同不能重载函数。","虚函数的函数体可能动态分派，但默认实参按调用点的静态类型确定。"],"trap":"“声明和实现绝对不能分别出现任何默认值”过于粗糙；关键是作用域、可见性与是否重复指定。","follow":["f(int) 和 f(int,int=0) 能否无歧义调用 f(1)？","为什么不建议在重写函数中改变默认值？"],"lab":"写两个有二义的声明观察编译诊断，然后改成一个清晰接口。","sources":[{"label":"C++ 标准草案 · dcl.fct.default","url":"https://eel.is/c++draft/dcl.fct.default"},{"label":"C++ 标准草案 · over.match","url":"https://eel.is/c++draft/over.match"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K07","section":"函数提高 / 默认参数与重载"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K04","category":"cpp","day":7,"title":"未命名形参是没有作用的参数吗？","answer":"函数声明或定义中可以只写形参类型，不给形参命名。它仍是参数列表的一部分并参与函数类型与重载等规则；调用时仍需按规则提供实参，除非有默认实参。常用于统一回调接口、暂不使用的参数或后置递增的区分参数。","points":["省略参数名，不等于省略参数本身。","C++17 接口里使用未命名形参，可避免某些未使用参数警告。"],"trap":"不能仅因为函数体不访问该参数，就声称它不影响接口或 ABI。","follow":["operator++(int) 的 int 用来区分什么？","只在声明中省略名字有什么好处？"],"lab":"写一个要求两个参数、但只使用第一个的回调函数，并尝试少传一个参数。","sources":[{"label":"C++ 标准草案 · dcl.fct","url":"https://eel.is/c++draft/dcl.fct"},{"label":"C++ 标准草案 · over.inc","url":"https://eel.is/c++draft/over.inc"}],"priority":"P1","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K08","section":"函数提高 / 未命名形参"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K05","category":"cpp","day":3,"title":"构造、析构、初始化列表与默认构造应该怎样区分？","answer":"构造函数建立对象初始状态，析构函数在生命周期结束时清理对象拥有的资源。默认构造是无实参即可调用的构造方式，不等于编译器总会替你生成构造函数。成员初始化列表先于构造函数体，const、引用成员及某些无默认构造的成员应在那里初始化。","points":["写出用户声明的构造函数后，需要重新检查是否还存在可用的默认构造。","成员按类内声明顺序初始化，而不是按列表书写顺序。"],"trap":"构造函数体内赋值不能代替所有成员的初始化。","follow":["析构函数应该抛异常吗？","构造失败时已经构造的成员会怎样清理？"],"lab":"设计含 const 配置和 string 成员的类型，用初始化列表初始化并记录构造顺序。","sources":[{"label":"C++ 标准草案 · class.ctor","url":"https://eel.is/c++draft/class.ctor"},{"label":"C++ 标准草案 · class.base.init","url":"https://eel.is/c++draft/class.base.init"},{"label":"C++ 标准草案 · class.dtor","url":"https://eel.is/c++draft/class.dtor"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K12","section":"对象初始化 / 构造与析构"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K06","category":"cpp","day":4,"title":"按值返回对象一定调用一次拷贝构造吗？","answer":"不一定。C++17 的某些纯右值初始化会直接构造目标对象，而命名返回值优化 NRVO 是满足条件时允许的优化。不能机械地根据函数返回值是对象，就数出固定次数的拷贝。先区分初始化、赋值、移动和消除的适用情形。","points":["return T{}; 与 T t; return t; 不是完全相同的规则。","为了“优化”把 return t 写成 return std::move(t)，反而可能阻止 NRVO。"],"trap":"日志中没有拷贝构造不代表复制语义永远不存在，也不等于编译器可以消除任意复制。","follow":["按值传入已有左值时通常如何初始化参数？","为什么现代 C++ 经常可以放心返回值？"],"lab":"在 C++17 下分别打印构造、拷贝、移动日志，比较返回临时对象与命名局部对象。","sources":[{"label":"C++ 标准草案 · class.copy.elision","url":"https://eel.is/c++draft/class.copy.elision"},{"label":"C++ 标准草案 · dcl.init","url":"https://eel.is/c++draft/dcl.init"},{"label":"C++ 标准草案 · class.copy.ctor","url":"https://eel.is/c++draft/class.copy.ctor"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K14","section":"对象初始化 / 拷贝调用时机与消除"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K13","category":"cpp","day":7,"title":"继承体系中，构造和析构按什么顺序执行？","answer":"通常先构造虚基类，再构造直接基类，然后按成员声明顺序构造成员，最后执行当前类构造函数体；销毁按相反方向清理。虚基类的初始化由最派生类负责。列表写法不能随意改变这些顺序。","points":["构造失败时，已经成功构造的子对象会被清理。","构造或析构期间的虚调用不会派发到尚未构造或已销毁的更派生部分。"],"trap":"不要在基类构造中期待派生类状态已经准备好。","follow":["为何锁、线程成员的声明顺序也会影响安全？","虚基类由谁初始化？"],"lab":"写 Base、Member、Derived 三个类型记录构造析构，并比较初始化列表顺序。","sources":[{"label":"C++ 标准草案 · class.base.init","url":"https://eel.is/c++draft/class.base.init"},{"label":"C++ 标准草案 · class.dtor","url":"https://eel.is/c++draft/class.dtor"},{"label":"C++ 标准草案 · class.cdtor","url":"https://eel.is/c++draft/class.cdtor"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K17","section":"对象初始化 / 类成员与构造顺序"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K07","category":"cpp","day":7,"title":"友元函数、友元类会变成类成员吗？","answer":"友元声明授予指定函数或类访问本类私有和受保护成员的权限，但不自动把它变成本类成员。友元关系不是传递关系，不由继承自动传播，也不是双向关系。需要权限时优先授予最小范围，避免把所有内部表示暴露出去。","points":["可以把某个特定成员函数声明为另一个类的友元。","常见用途是与类型接口紧密相关的非成员运算符。"],"trap":"友元放在 public 或 private 段不改变它被授予的访问权限。","follow":["为何输出运算符有时选择非成员友元？","一个类的朋友的朋友能否访问该类？"],"lab":"为一个小数值类写 friend operator\u003c\u003c，其余内部状态保持私有。","sources":[{"label":"C++ 标准草案 · class.friend","url":"https://eel.is/c++draft/class.friend"}],"priority":"P1","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K23","section":"友元 / 函数、类与成员函数"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K09","category":"cpp","day":7,"title":"自定义输出运算符为什么通常返回 ostream&？","answer":"返回原输出流引用可以支持连续的 \u003c\u003c 调用，并保留同一条流的状态。因为左操作数是标准流，用户类型的输出重载常写成非成员函数；读取对象通常用 const 引用，必要时通过友元访问内部数据。","points":["典型签名是 std::ostream& operator\u003c\u003c(std::ostream&, const T&)。","不要试图通过复制流对象来返回结果。"],"trap":"有输出语句不等于成功写出；流状态依然需要由调用方检查。","follow":["怎样避免不必要的 friend？","日志接口是否应该强制 flush？"],"lab":"为结构体实现输出接口，验证 std::cout \u003c\u003c a \u003c\u003c b; 并检查状态。","sources":[{"label":"C++ 标准草案 · ostream","url":"https://eel.is/c++draft/ostream"},{"label":"C++ 标准草案 · class.friend","url":"https://eel.is/c++draft/class.friend"}],"priority":"P1","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K25","section":"运算符重载 / 输出运算符"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K08","category":"cpp","day":7,"title":"前置与后置递增的重载为什么有不同签名？","answer":"前置递增通常写成 T& operator++()，修改当前对象后返回自己；后置通常写成 T operator++(int)，先保留旧值、修改对象，再返回旧值。那个未使用的 int 用于区分语法形式。返回类型与行为是接口设计，应尽量符合内置语义。","points":["后置版本为返回旧值可能需要额外复制，但优化与具体类型决定实际成本。","不能声称 ++i 在所有场景必然更快。"],"trap":"重载可以写出反直觉的返回类型，但可编译不代表合理。","follow":["迭代器什么时候需要旧值？","为什么前置通常返回引用？"],"lab":"给计数器写前置与后置版本，分别检查自增后值和表达式结果。","sources":[{"label":"C++ 标准草案 · over.inc","url":"https://eel.is/c++draft/over.inc"}],"priority":"P1","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K26","section":"运算符重载 / 递增运算符"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K10","category":"cpp","day":3,"title":"拷贝赋值与拷贝构造不同在哪里，怎样避免资源损坏？","answer":"拷贝构造创建新对象，拷贝赋值修改已存在对象；后者还要处理目标当前拥有的资源。资源类应考虑自赋值和分配失败，通常优先组合 string、vector 和智能指针采用 Rule of Zero，而不是手工管理裸指针。","points":["常见拷贝赋值签名为 T& operator=(const T&)。","先分配成功再替换旧状态，或采用合适的 copy-and-swap，可以改善异常安全。"],"trap":"先释放自己的缓冲区再直接读右侧对象，会在自赋值场景破坏数据。","follow":["不可复制资源如何明确禁用复制？","移动赋值要如何处理目标原有资源？"],"lab":"为仅含 vector 的类使用默认特殊成员，再与手写裸指针实现对比风险。","sources":[{"label":"C++ 标准草案 · class.copy.assign","url":"https://eel.is/c++draft/class.copy.assign"},{"label":"C++ 标准草案 · class.copy.ctor","url":"https://eel.is/c++draft/class.copy.ctor"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K27","section":"运算符重载 / 赋值运算符"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K11","category":"cpp","day":10,"title":"函数对象与普通函数、Lambda 怎样联系起来？","answer":"定义了可调用接口的对象可以像函数一样被调用。C++17 中类可通过 operator() 表达该接口，Lambda 的闭包类型也提供调用运算符。对象可以保存状态，复制它会按成员语义复制该状态，是否共享资源要另行分析。","points":["有状态谓词比依赖全局变量的回调更容易表达依赖。","const 调用接口与 mutable Lambda 影响可否修改闭包自身成员。"],"trap":"可调用不代表线程安全；两个线程调用同一有状态对象需要考虑同步。","follow":["std::function 带来什么类型擦除取舍？","Lambda 捕获引用为什么可能悬空？"],"lab":"写一个保存阈值的谓词对象，再用 Lambda 实现同样的筛选。","sources":[{"label":"C++ 标准草案 · over.call","url":"https://eel.is/c++draft/over.call"},{"label":"C++ 标准草案 · expr.prim.lambda.closure","url":"https://eel.is/c++draft/expr.prim.lambda.closure"}],"priority":"P1","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K28","section":"运算符重载 / 调用运算符"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K12","category":"cpp","day":7,"title":"public、protected、private 继承会怎样影响访问？","answer":"继承方式控制基类公开和受保护成员通过派生类暴露的访问级别，以及基类转换的可访问性。public 继承常表达可替代的 is-a 关系；protected/private 继承会收紧访问。基类私有成员仍属于基类子对象，但派生类不能直接访问它们。","points":["默认继承方式在 class 中是 private，在 struct 中是 public。","访问控制影响可访问性，不是把基类私有数据从对象中删掉。"],"trap":"“派生类不能直接访问”不等于“没有继承或不存在该成员存储”。","follow":["何时应该用组合替代 private 继承？","public 继承是否自动保证业务上可替代？"],"lab":"用三种继承方式测试基类指针转换的可访问性，保留编译结果。","sources":[{"label":"C++ 标准草案 · class.access.base","url":"https://eel.is/c++draft/class.access.base"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K29","section":"继承 / 基本语法与访问方式"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K14","category":"cpp","day":7,"title":"纯虚函数、抽象类和纯虚析构函数有哪些规则？","answer":"纯虚函数声明带 =0；若类仍有最终覆盖者为纯虚的虚函数，它就是抽象类，不能直接实例化，但可通过指针或引用表示接口。纯虚函数不等于绝对不能有类外定义；纯虚析构函数尤其需要定义，派生类析构会调用基类析构。","points":["抽象类可以有构造函数、状态和非纯虚成员。","经常通过基类接口删除对象时，应设计正确的虚析构接口。"],"trap":"在构造或析构期间对正在构造或销毁对象进行纯虚调用会有问题，不能当成派生类回调。","follow":["为什么纯虚析构只有声明会产生链接问题？","派生类忘记覆盖一个纯虚函数会怎样？"],"lab":"写最小接口类，提供纯虚析构的类外定义，并用 unique_ptr\u003cBase> 管理 Derived。","sources":[{"label":"C++ 标准草案 · class.abstract","url":"https://eel.is/c++draft/class.abstract"},{"label":"C++ 标准草案 · class.dtor","url":"https://eel.is/c++draft/class.dtor"},{"label":"C++ 标准草案 · class.cdtor","url":"https://eel.is/c++draft/class.cdtor"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K34","section":"多态 / 纯虚函数、抽象类与纯虚析构"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K15","category":"cpp","day":6,"title":"ifstream、ofstream、fstream 与打开模式如何使用？","answer":"ifstream 面向输入，ofstream 面向输出，fstream 同时支持两者。打开模式需要明确是否截断、追加或二进制。常见 ofstream 默认输出会截断现有文件；app 意味着每次写到结尾，ate 则只在打开时定位到结尾。","points":["打开成功与后续读写成功是两次需要分别检查的事情。","使用自动对象管理文件资源；需要报告写入失败时显式检查 flush/close 等操作后的状态。"],"trap":"std::ios::binary 不会自动序列化对象，也不保证任何写入已经持久化到磁盘。","follow":["追加日志为什么应明确 app？","fstream 默认 in|out 能否创建一个不存在的文件？"],"lab":"在临时目录分别测试截断、追加、文件不存在和权限不足。","sources":[{"label":"C++ 标准草案 · fstream","url":"https://eel.is/c++draft/fstream"},{"label":"C++ 标准草案 · filebuf.members","url":"https://eel.is/c++draft/filebuf.members"},{"label":"C++ 标准草案 · ios.openmode","url":"https://eel.is/c++draft/ios.openmode"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K35","section":"文件操作 / 文本流与打开模式"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K17","category":"cpp","day":6,"title":"文件读取为什么应以读取结果驱动循环，而不是 !eof()？","answer":"eofbit 一般在读取尝试遇到输入结束时才设置；循环开始时未到 EOF，不保证本轮读取会成功。文本常用 while (getline(in, line))，二进制则检查 read 的结果及 gcount，按协议决定最后不足一块的数据是否有效。","points":["区分正常读完、格式失败和设备 I/O 错误。","处理错误后再决定 clear、重新定位或退出，避免无限重复同一失败输入。"],"trap":"is_open() 只说明是否关联打开的文件，不证明每次读写成功。","follow":["eofbit 和 failbit 同时出现时如何解释？","定长记录读取到半条应该怎样报错？"],"lab":"测试空文件、无末尾换行、损坏记录和错误路径，并逐一说明结果。","sources":[{"label":"C++ 标准草案 · istream.unformatted","url":"https://eel.is/c++draft/istream.unformatted"},{"label":"C++ 标准草案 · string.io","url":"https://eel.is/c++draft/string.io"},{"label":"C++ 标准草案 · ios.iostate","url":"https://eel.is/c++draft/ios.iostate"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K36","section":"文件操作 / 正确读取与错误处理"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"},{"id":"K16","category":"cpp","day":6,"title":"为什么不能把整个 C++ 对象直接写成可移植二进制文件？","answer":"对象的内存表示可能含指针、填充字节、虚表相关实现信息以及 string/vector 的内部管理状态。直接复制这些字节并不等于保存其逻辑内容。持久化应定义字段、长度、编码、字节序和版本，并在读入时检查范围与完整性。","points":["某些平凡可复制类型允许在受限条件下复制对象字节，但这不自动建立跨平台文件协议。","binary 模式与 read/write 只是按字节操作接口，不会替你处理对象所有权。"],"trap":"把 string 的内部地址写入文件，再恢复到新进程中，会得到无意义的地址。","follow":["含固定 char 数组的记录仍有哪些移植风险？","数据长度字段为什么要设置上限？"],"lab":"手工写入“长度 + UTF-8 字节”，读取时校验长度和实际读取量。","sources":[{"label":"C++ 标准草案 · basic.types","url":"https://eel.is/c++draft/basic.types"},{"label":"C++ 标准草案 · istream.unformatted","url":"https://eel.is/c++draft/istream.unformatted"},{"label":"C++ 标准草案 · ostream.unformatted","url":"https://eel.is/c++draft/ostream.unformatted"}],"priority":"P0","code":"","origins":[{"collectionId":"csdn-cpp-core","no":"K37","section":"文件操作 / 二进制与序列化"}],"answerKind":"知识点重组 · C++17 基础口径","license":"CC BY-SA 4.0"}],"categories":[{"id":"c","name":"C 语言与内存","label":"C / MEMORY","description":"指针、存储期与内存边界","icon":"code"},{"id":"cpp","name":"现代 C++","label":"MODERN C++","description":"资源所有权、对象与容器","icon":"box"},{"id":"linux","name":"Linux 系统编程","label":"LINUX SYSTEM","description":"进程、文件与系统接口","icon":"terminal"},{"id":"thread","name":"线程与并发","label":"CONCURRENCY","description":"同步、队列与安全退出","icon":"layers"},{"id":"net","name":"网络编程","label":"NETWORKING","description":"TCP、Socket 与 epoll","icon":"network"},{"id":"debug","name":"构建与调试","label":"BUILD / DEBUG","description":"CMake、GDB 与故障定位","icon":"tool"},{"id":"embedded","name":"嵌入式部署","label":"EMBEDDED LINUX","description":"工具链、ABI 与设备接口","icon":"chip"}],"plan":[{"day":1,"title":"指针、数组与常量","category":"c","questionIds":["C01","C02","C03","C04","B13","B14"],"tasks":[{"id":"b01-t1","type":"八股","text":"画出数组与指针的类型、步长和生命周期；选约 4 道新题或主题卡。"},{"id":"b01-t2","type":"实验","text":"打印 sizeof 并写正确的数组参数接口；记录输入、输出与边界。"},{"id":"b01-t3","type":"复习","text":"优先复习到期题，再脱稿复述今天的重点；用自评标出待巩固题。"}],"acceptance" function formatTimer(n){return `${pad(Math.floor(n/60))}:${pad(n%60)}`;}
function updateTimer(){const num=$('#timer-number');if(num)num.textContent=formatTimer(timerRemaining);$('#timer-display')?.classList.toggle('expired',timerRemaining===0);const b=$('#timer-toggle');if(b)b.textContent=timerRunning?'暂停':timerRemaining===0?'重新计时':'开始计时';}
function stopTimer(reset=true){clearInterval(timerId);timerId=null;timerRunning=false;if(reset)timerRemaining=90;updateTimer();}
function toggleTimer(){if(timerRunning){timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));stopTimer(false);return;}if(timerRemaining===0)timerRemaining=90;timerEnd=Date.now()+timerRemaining*1000;timerRunning=true;updateTimer();timerId=setInterval(()=>{timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));updateTimer();if(!timerRemaining){stopTimer(false);toast('90 秒到了。可以继续回答，再自行核对答案。');}},250);}
function markGrade(grade){if(!session||!session.revealed||session.index>=session.ids.length)return;const id=session.ids[session.index],now=Date.now(),prev=state.reviews[id],next=nextSchedule(id,grade,now);state.reviews[id]={...next,grade,last:now,count:(prev?.count||0)+1,first:prev?.first||now};state.history.push({id,at:now,grade});state.history=state.history.slice(-10000);session.graded.push({id,grade});session.index++;session.revealed=false;stopTimer();save();render();window.scrollTo({top:0,behavior:'instant'});}
function shuffle(xs){const a=[...xs];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function download(text,name,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}

async function importBackup(file){if(!file)return;try{if(file.size>32*1024*1024)throw new Error('文件过大，备份上限为 32 MB。');const envelope=JSON.parse(await file.text());if(envelope?.app!=='embedded-linux-study'||![1,2,3].includes(envelope.version))throw new Error('不是知行栈 v1 / v2 / v3 备份。请选导出的 JSON 文件，而非 Markdown 或题库源文件。');const clean=validateState(migrateState(envelope.state,envelope.version));if(!confirm(`即将替换当前数据：\n${Object.keys(clean.reviews).length} 道已练题、${clean.history.length} 次自评、${Object.values(clean.tasks).filter(Boolean).length} 项已勾选任务。\n建议先导出当前备份。是否继续？`))return;state=clean;storageOK=true;storageError='';session=null;editingId=null;editingSourceId=null;pendingPack=null;importText='';migrationMessage='';selectedDay=currentDay();stopTimer();save();render();toast(storageOK?'备份已恢复。':'已恢复到内存，但浏览器未能持久保存，请保留备份。');}catch(e){toast(`导入失败：${e.message}`);}finally{$('#import-file').value='';}}

function mergeOrigins(...lists) {
 const out=[],seen=new Set();
 for(const o of lists.flat()) {if(!o)continue;const key=[o.collectionId,o.no||'',o.section||''].join('\u001f');if(!seen.has(key)){seen.add(key);out.push({collectionId:o.collectionId,no:o.no||'',section:o.section||''});}}
 return out;
}
function cleanCollection(s) {
 if(!isObj(s))throw new Error('资料信息必须是对象。');
 const id=String(s.id||'');
 if(!/^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$/.test(id)||['constructor','prototype','__proto__'].includes(id))throw new Error('资料 ID 必须为 1–64 个英文字母、数字、横线或下划线。');
 if(typeof s.name!=='string'||!s.name.trim()||s.name.length>200)throw new Error('资料名称不能为空且不能超过 200 字。');
 const url=String(s.url||'').trim();if(url&&!safeURL(url))throw new Error('资料网址仅允许 http / https。');
 if(url.length>2000)throw new Error('资料网址过长。');
 return {id,name:s.name.trim(),shortName:String(s.shortName||s.name).slice(0,40),author:String(s.author||'未填写').slice(0,200),url,description:String(s.description||'').slice(0,3000),license:String(s.license||'由添加者确认').slice(0,200),licenseUrl:safeURL(s.licenseUrl)?String(s.licenseUrl).slice(0,2000):'',version:String(s.version||'1').slice(0,80),kind:'custom'};
}
function cleanCard(q, id, sourceIds) {

 if(!SEED.categories.some(c=>c.id===q.category))throw new Error('模块必须为 c / cpp / linux / thread / net / debug / embedded。');
 if(q.priority&&!['P0','P1','P2'].includes(q.priority))throw new Error('优先级必须为 P0、P1 或 P2。');
 if(q.day!==undefined&&(!Number.isInteger(Number(q.day))||Number(q.day)<1||Number(q.day)>28))throw new Error('计划日必须为 1–28。');
 const arr=(v,label)=>{if(v===undefined)return [];if(!Array.isArray(v)||v.length>30)throw new Error(label+'需为最多 30 项的文本数组。');return v.map(x=>text(x,3000,label));};
 const refs=q.sources||[];if(!Array.isArray(refs)||refs.length>20)throw new Error('核对来源需为最多 20 项的数组。');
 const sources=refs.map(s=>{if(!isObj(s)||!safeURL(s.url)||String(s.url).length>2000)throw new Error('核对来源含无效网址，仅允许 http / https。');return{label:text(s.label||'核对来源',200,'来源标签'),url:s.url};});
 let os=q.origins;if(os===undefined)os=[{collectionId:'personal',no:'',section:''}];
 if(!Array.isArray(os)||os.length>200)throw new Error('题目出处格式错误。');

 return {id,category:q.category,day:Number(q.day||1),priority:q.priority||'P0',title:text(q.title,300,'题目',true),answer:text(q.answer,20000,'答案',true),points:arr(q.points,'要点'),trap:text(q.trap,6000,'易错点'),follow:arr(q.follow,'追问'),lab:text(q.lab,6000,'实验'),code:text(q.code,30000,'代码'),sources,origins,answerKind:text(q.answerKind||'用户整理 · 待自行核对',120,'整理说明'),license:text(q.license||'由添加者确认',200,'许可'),importKey:text(q.importKey||'',500,'导入标识')};
}

function parseMarkdown(text){
