 const fieldMap={'资料ID':'id','来源':'url','作者':'author','许可':'license','版本':'version'},qMap={'分类':'category','优先级':'priority','计划日':'day','原题号':'sourceNo','章节':'section'},secMap={'答案':'answer','要点':'points','易错点':'trap','追问':'follow','实验':'lab','代码':'code','参考':'sources'};
 const flush=()=>{if(!q)return;for(const k of ['answer','trap','lab','code'])q[k]=(q[k]||[]).join('\n').trim();for(const k of ['points','follow'])q[k]=(q[k]||[]).map(t=>t.replace(/^\s*[-*]\s+/, '').trim()).filter(Boolean);q.sources=(q.sources||[]).filter(t=>t.trim()).map(t=>{const m=t.trim().match(/^-?\s*\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)\s*$/);if(!m)throw new Error('Markdown 参考必须使用 - [标签](https://地址)。');return {label:m[1],url:m[2]};});if(q.day!==undefined)q.day=Number(q.day);questions.push(q);q=null;};
 for(const line of lines){const f=line.match(/^\s*(`{3,}|~{3,})/);if(fenceChar){if(f&&f[1][0]===fenceChar&&f[1].length>=fenceLength){fenceChar='';continue;}if(q&&section)(q[section]??=[]).push(line);continue;}if(f){fenceChar=f[1][0];fenceLength=f[1].length;continue;}
 const t=line.match(/^#\s+(.+)$/);if(t&&!q){header.name=t[1].trim();continue;}
 const qq=line.match(/^##\s+(?:\[([^\]]+)\]\s*)?(.+)$/);if(qq){flush();q={id:qq[1]||'',title:qq[2].trim()};section='';continue;}
 const ss=line.match(/^###\s+(.+)$/);if(ss&&q){section=secMap[ss[1].trim()];if(!section)throw new Error('未知的小节 '+ss[1]+'；请使用模板标题。');continue;}
 const meta=line.match(/^([^:：]+)[:：]\s*(.*)$/);if(meta&&!section){const target=q?qMap:fieldMap;const key=target[meta[1].trim()];if(key){(q||header)[key]=meta[2].trim();continue;}}
 if(q&&section)(q[section]??=[]).push(line);
 }
 if(fenceChar)throw new Error('Markdown 代码围栏未闭合。');flush();if(!header.id)throw new Error('缺少“资料ID:”；请先下载模板。');if(!questions.length)throw new Error('没有找到 ## [编号] 题目；请使用模板结构。');return {format:'zhixing-question-bank',version:1,source:header,questions};
}
function parsePack(text){if(typeof text!=='string'||new Blob([text]).size>32*1024*1024)throw new Error('单次题库包上限 32 MB。');let p;try{p=/^\s*[\[{]/.test(text.replace(/^\uFEFF/,''))?JSON.parse(text.replace(/^\uFEFF/,'')):parseMarkdown(text);}catch(e){throw new Error('解析失败：'+e.message);}if(p?.app==='embedded-linux-study')throw new Error('这是完整进度备份，请到“记录与备份”恢复；这里仅合并题库包。');if(p?.format!=='zhixing-question-bank'||p.version!==1)throw new Error('不是知行栈题库包 v1，请按 JSON / Markdown 模板整理。');if(!Array.isArray(p.questions)||!p.questions.length||p.questions.length>4000)throw new Error('一次导入需要 1–4000 道题。');return p;}
function stableId(text){let a=2166136261,b=5381;for(const c of text){a=Math.imul(a^c.charCodeAt(0),16777619);b=Math.imul(b,33)^c.charCodeAt(0);}return 'U'+(a>>>0).toString(36)+'_'+(b>>>0).toString(36);}
function titleKey(q){return q.category+'|'+q.title.normalize('NFKC').replace(/\s+/g,'').toLowerCase();}
function makePreview(p){
 if(p?.format!=='zhixing-question-bank'||p.version!==1||!Array.isArray(p.questions)||!p.questions.length||p.questions.length>4000)throw new Error('题库包格式或数量无效。');
 const existingSources=collections(),sourceMap=new Map(existingSources.map(s=>[s.id,s])),newSources=[];
 const supplied=p.source?[p.source,...(p.collections||[])]:p.collections;if(!Array.isArray(supplied)||!supplied.length||supplied.length>200)throw new Error('题库包需包含 source 或 collections 资料信息。');
 for(const raw of supplied){const s=cleanCollection(raw),old=sourceMap.get(s.id);if(old){if(old.url!==s.url||old.name!==s.name)throw new Error(`资料 ID“${s.id}”已存在但名称或网址不同，请改 ID 或先编辑资料。`);}else{sourceMap.set(s.id,s);newSources.push(s);}}
 if(existingSources.length+newSources.length>200)throw new Error('资料数量上限为 200。');
 const src=p.source?.id,ids=new Set(sourceMap.keys()),existing=allCards(),byId=new Map(existing.map(q=>[q.id,q])),byTitle=new Map(existing.map(q=>[titleKey(q),q])),byImport=new Map(existing.filter(q=>q.importKey).map(q=>[q.importKey,q])),seenIds=new Set(),seenTitles=new Set(),seenTargets=new Set(),items=[];
 for(let i=0;i<p.questions.length;i++) {try{
  const raw=p.questions[i];if(!isObj(raw))throw new Error('条目必须是对象。');
  const external=String(raw.id||'').trim();if(external.length>100)throw new Error('题目 ID 过长。');if(external&&seenIds.has(external))throw new Error('同一包内题目 ID 重复。');if(external)seenIds.add(external);
  const origins=raw.origins||(src?[{collectionId:src,no:String(raw.sourceNo||''),section:String(raw.section||'')}]:null);if(!origins)throw new Error('没有找到题目所属资料。');
  const input=cleanCard({...raw,origins},external||'pending',ids),tk=titleKey(input);if(seenTitles.has(tk))throw new Error('同一包内模块及题目重复，请合并后导入。');seenTitles.add(tk);
  const importKey=raw.importKey||`${src||input.origins[0]?.collectionId||'pack'}::${external||input.category+'::'+input.title}`;
  const old=(external&&byId.get(external))||byImport.get(importKey)||byTitle.get(tk);
  let id=old?.id||stableId(importKey);if(!old){let n=0;while(byId.has(id))id=stableId(importKey+'::'+(++n));}
  if(seenTargets.has(id))throw new Error('本包多道题命中了同一已有卡片，请合并后重试。');seenTargets.add(id);
  input.id=id;input.importKey=old?.importKey||importKey;input.answerKind='用户导入 · 待自行核对';
  if(input.origins.some(o=>sourceMap.get(o.collectionId)?.license.includes('CC BY-SA')))input.license='CC BY-SA 4.0';
  items.push({q:input,old:old||null,action:old?'duplicate':'new'});
 }catch(e){throw new Error(`第 ${i+1} 题：${e.message}`);}}
 const added=items.filter(x=>x.action==='new').length;if(state.custom.length+added>3000)throw new Error('个人新增题上限为 3000；请拆分工作区或归档导出后另开浏览器配置。');
 return {newSources,items,added,duplicates:items.length-added,baseUpdatedAt:state.updatedAt,pack:p};
}
function previewHTML(){if(!pendingPack)return '';return `<section class="panel section-space import-preview"><div class="panel-header"><div><h2>导入预览 · 尚未写入</h2><p>${pendingPack.items.length} 道题：新增 ${pendingPack.added}，已存在 ${pendingPack.duplicates}；新增资料 ${pendingPack.newSources.length} 份。</p></div><span class="tag green">验证通过</span></div><label class="label" for="duplicate-policy">遇到已有题目</label><select class="select" id="duplicate-policy"><option value="keep" ${importPolicy==='keep'?'selected':''}>保留现有答案，只合并来源（推荐）</option><option value="update" ${importPolicy==='update'?'selected':''}>用导入内容更新答案，保留编号与学习记录</option></select><p class="form-note">按固定 ID / 导入标识、再按同模块的规范化标题检查；不做语义模糊合并。归档题不会被重新激活。更新答案不改变复习排期，旧答案不保存版本历史，建议先备份。</p><div class="preview-list">${pendingPack.items.slice(0,100).map(x=>`<div class="preview-row"><span class="tag ${x.old?'':'green'}">${x.old?'已有':'新增'}</span><div><b>${h(x.q.title)}</b><small>${h(x.q.id)} · ${h(category(x.q.category).name)}${x.old?' · 原记录保留':''}${state.hidden.includes(x.q.id)?' · 已归档':''}</small></div></div>`).join('')}</div>${pendingPack.items.length>100?`<p class="form-note">列表仅展示前 100 道；全部 ${pendingPack.items.length} 道都已验证，确认后全部合并。</p>`:''}<div class="row">${button('确认合并到题库','commit-pack','primary')}${button('取消预览','cancel-preview')}</div></section>`;}
function importForm(){return `<section class="panel"><div class="panel-header"><div><h2>把下一份资料加进来</h2><p>填写模板 → 选择文件或粘贴内容 → 检查预览 → 确认合并。</p></div></div><div class="row">${button(`${icon('download')}JSON 模板`,'template-json')}${button('Markdown 模板','template-md')}<label class="btn primary file-label">选择 .json / .md 文件<input type="file" id="pack-file" accept=".json,.md,.markdown,.txt" hidden></label></div><label class="label" for="pack-text">或粘贴符合模板的内容</label><textarea id="pack-text" class="import-text" spellcheck="false" placeholder="支持题库 JSON 或带固定标题的 Markdown；不是直接粘贴网址。">${h(importText)}</textarea><div class="row">${button('解析并预览','preview-pack','primary')}${button('清空输入','clear-import','small')}</div><div class="callout compact"><strong>题库导入 ≠ 进度恢复</strong>这里是增量合并，不清空旧题、笔记和计划。完整 JSON 备份请在“记录与备份”恢复。每批最多 4000 道、32 MB；新增题共最多 3000 道。网页没有抓取代理或 AI 服务，单个 URL 不会自动变成问答。</div></section>${previewHTML()}`;}
function managePage(){const archived=state.hidden.map(question).filter(Boolean);return pageHead('A LIBRARY THAT GROWS WITH YOU','题库可以一直长大。','已有题支持本地修订；新增资料和题目一起进入筛选、复习、面试与备份。',button('导出全部题库包','export-pack','small','data-source="all"'))+`<div class="manage-tabs" role="group" aria-label="题库管理功能">${[['import','批量导入'],['edit',editingId?'编辑题目':'新增题目'],['source','资料信息']].map(([id,t])=>`<button class="btn ${manageTab===id?'primary':''}" data-action="manage-tab" data-tab="${id}" aria-pressed="${manageTab===id}">${t}</button>`).join('')}</div>${manageTab==='import'?importForm():manageTab==='edit'?editForm():sourceForm()}<section class="panel section-space"><div class="panel-header"><div><h2>已归档 · ${archived.length} 道</h2><p>归档仅暂停展示和练习；笔记、来源及复习记录都保留，可随时恢复。</p></div></div>${archived.length?archived.map(q=>`<div class="preview-row"><div><b>${h(q.title)}</b><small>${h(q.id)} · ${h(category(q.category).name)}</small></div>${button('恢复到题库','restore-card','small',`data-id="${h(q.id)}"`)}</div>`).join(''):'<p class="muted">尚未归档题目。打开题库卡片的“编辑”入口可归档。</p>'}</section>`;}
function storeCard(q){const seed=SEED.questions.find(x=>x.id===q.id),old=question(q.id);q.origins=mergeOrigins(seed?.origins||[],old?.origins||[],q.origins||[]);if(seed?.license==='CC BY-SA 4.0'||old?.license==='CC BY-SA 4.0'||q.origins.some(o=>collection(o.collectionId)?.license.includes('CC BY-SA')))q.license='CC BY-SA 4.0';if(seed)state.overrides[q.id]=q;else{const i=state.custom.findIndex(x=>x.id===q.id);if(i<0)state.custom.push(q);else state.custom[i]=q;}}
function commitPreview(){if(!pendingPack)return;try{if(state.updatedAt!==pendingPack.baseUpdatedAt){pendingPack=makePreview(pendingPack.pack);render();toast('数据已发生变化，已重新计算预览，请再确认一次。');return;}if(importPolicy==='update'&&pendingPack.duplicates&&!confirm(`将更新 ${pendingPack.duplicates} 道已有题的答案；保留学习记录但不保留旧答案版本。建议先备份，继续吗？`))return;const oldState=structuredClone(state),snapshot=pendingPack;try{state.collections.push(...snapshot.newSources);for(const item of snapshot.items){const old=question(item.q.id);if(old&&importPolicy==='keep')storeCard({...old,origins:mergeOrigins(old.origins,item.q.origins)});else storeCard(item.q);}state=validateState(state);}catch(e){state=oldState;throw e;}save();pendingPack=null;importText='';render();toast(`导入完成：新增 ${snapshot.added} 道，${snapshot.duplicates} 道已有题${importPolicy==='keep'?'保留答案并关联来源':'已更新答案'}。`);}catch(e){toast('合并失败：'+e.message);}}
function exportPackObject(id='all'){const qs=allCards().filter(q=>hasSource(q,id));const used=new Set(qs.flatMap(q=>q.origins.map(o=>o.collectionId)));return {format:'zhixing-question-bank',version:1,exportedAt:new Date().toISOString(),notice:'题库内容包，不含私人笔记、复习排期和计划；相关改编内容遵循其来源许可。归档题也包含在包中，但归档状态只在完整备份保留。',collections:collections().filter(c=>used.has(c.id)),questions:qs};}
function parseReferenceLines(text){return text.split('\n').map(t=>t.trim()).filter(Boolean).map(line=>{const i=line.indexOf('|');return i<0?{label:'核对参考',url:line}:{label:line.slice(0,i).trim(),url:line.slice(i+1).trim()};});}
function saveQuestionForm(){try{const old=editingId?question(editingId):null;const arr=id=>$(id).value.split('\n').map(t=>t.trim()).filter(Boolean);const id=old?.id||('U'+Date.now().toString(36)+Math.random().toString(36).slice(2,9));const q=cleanCard({category:$('#edit-category').value,day:Number($('#edit-day').value),priority:$('#edit-priority').value,title:$('#edit-title').value,answer:$('#edit-answer').value,points:arr('#edit-points'),trap:$('#edit-trap').value,follow:arr('#edit-follow'),lab:$('#edit-lab').value,code:$('#edit-code').value,sources:parseReferenceLines($('#edit-refs').value),origins:mergeOrigins(old?.origins||[],[{collectionId:$('#edit-source').value,no:$('#edit-no').value.trim(),section:$('#edit-section').value.trim()}]),answerKind:'用户整理 · 待自行核对',importKey:old?.importKey||'',license:old?.license||'由添加者确认'},id,sourceIds());if(!old&&state.custom.length>=3000)throw new Error('新增题上限为 3000。');const dup=allCards().find(x=>x.id!==id&&titleKey(x)===titleKey(q));if(dup)throw new Error(`同模块已有相同题目（${dup.id}），请编辑该卡片或使用导入合并来源。`);storeCard(q);save();editingId=id;render();toast('题目已保存，原有学习记录保留。');}catch(e){toast('保存失败：'+e.message);}}
function saveSourceForm(){try{const s=cleanCollection({id:$('#source-id').value.trim(),name:$('#source-name').value,url:$('#source-url').value.trim(),author:$('#source-author').value,license:$('#source-license').value,version:$('#source-version').value,description:$('#source-description').value});const exists=collection(s.id);if(exists&&!editingSourceId)throw new Error('该资料 ID 已存在，请使用另一 ID。');if(exists&&exists.kind!=='custom')throw new Error('内置资料的署名和链接不可改写。');if(!exists&&collections().length>=200)throw new Error('资料数量上限为 200。');const duplicate=collections().find(x=>s.url&&x.url===s.url&&x.id!==s.id);if(duplicate)throw new Error('该网址已经登记为：'+duplicate.name);const index=state.collections.findIndex(x=>x.id===s.id);if(index<0)state.collections.push(s);else state.collections[index]=s;editingSourceId=s.id;save();render();toast('资料信息已保存。接着添加题目或导入题库包。');}catch(e){toast('保存失败：'+e.message);}}

Object.assign(actions,{
 'source-filter':el=>{bank={query:'',cat:'all',status:'all',priority:'all',source:el.dataset.source};bankLimit=60;go('bank');},
 'source-study':el=>startSession(sourceOrderedCards(el.dataset.source).map(q=>q.id),'filter'),
 'source-outline':el=>{sourceView=el.dataset.source;render();setTimeout(()=>$('#source-outline')?.scrollIntoView({behavior:'smooth',block:'start'}),20);},
 'more-bank':()=>{bankLimit+=60;$('#bank-results').innerHTML=bankResult();},
 'manage-tab':el=>{manageTab=el.dataset.tab;render();},
 'edit-card':el=>{if(!question(el.dataset.id))return;editingId=el.dataset.id;manageTab='edit';go('manage');},
 'cancel-edit':()=>{editingId=null;manageTab='edit';render();},
 'edit-source':el=>{editingSourceId=el.dataset.source;manageTab='source';go('manage');},
 'archive-card':el=>{const id=el.dataset.id;if(!question(id))return;if(!confirm('归档后不再进入日常练习，但笔记、来源和复习记录全部保留。是否归档？'))return;state.hidden=[...new Set([...state.hidden,id])];if(session?.ids.includes(id))session=null;editingId=null;save();render();toast('题目已归档，可在题库管理底部恢复。');},
 'restore-card':el=>{state.hidden=state.hidden.filter(id=>id!==el.dataset.id);save();render();toast('已恢复。原有笔记和复习排期不变。');},
 'reset-card':el=>{const id=el.dataset.id;if(!state.overrides[id])return;if(!confirm('恢复内置答案与字段，保留后来关联的来源和学习记录。继续吗？'))return;const base=SEED.questions.find(q=>q.id===id),origins=state.overrides[id].origins;delete state.overrides[id];const merged=mergeOrigins(base.origins,origins);if(merged.length>base.origins.length)state.overrides[id]={...base,origins:merged};save();render();toast('已恢复内置答案，来源和学习记录保留。');},
 'preview-pack':()=>{importText=$('#pack-text').value;try{pendingPack=makePreview(parsePack(importText));render();setTimeout(()=>$('.import-preview')?.scrollIntoView({behavior:'smooth',block:'start'}),20);}catch(e){pendingPack=null;$('.import-preview')?.remove();toast(e.message);}},
 'clear-import':()=>{pendingPack=null;importText='';render();},
 'cancel-preview':()=>{pendingPack=null;render();},
 'commit-pack':commitPreview,
 'template-json':()=>download(JSON.stringify(templatePack(),null,2),'知行栈_题库导入模板.json','application/json;charset=utf-8'),
 'template-md':()=>download(packMarkdown(templatePack()),'知行栈_题库导入模板.md','text/markdown;charset=utf-8'),
 'export-pack':el=>{const id=el.dataset.source||'all',pack=exportPackObject(id);if(!pack.questions.length){toast('这份资料还没有题目，添加后再导出。');return;}download(JSON.stringify(pack,null,2),`知行栈_题库包_${id}_${today()}.json`,'application/json;charset=utf-8');toast('题库包已导出，含出处与许可，不含私人学习记录。');}
});
document.addEventListener('input',e=>{if(e.target.id==='pack-text'){importText=e.target.value;pendingPack=null;$('.import-preview')?.remove();}});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='bank-source'){bank.source=el.value;bankLimit=60;$('#bank-results').innerHTML=bankResult();}if(el.id==='outline-source'){sourceView=el.value;render();}if(el.id==='duplicate-policy')importPolicy=el.value;if(el.id==='pack-file'){const file=el.files?.[0];if(!file)return;try{if(file.size>32*1024*1024)throw new Error('题库包超过 32 MB。');importText=await file.text();pendingPack=makePreview(parsePack(importText));render();toast('文件已解析，请检查预览后确认合并。');setTimeout(()=>$('.import-preview')?.scrollIntoView({behavior:'smooth',block:'start'}),20);}catch(err){pendingPack=null;render();toast('导入预览失败：'+err.message);}}});
document.addEventListener('submit',e=>{if(e.target.id==='question-form'){e.preventDefault();saveQuestionForm();}if(e.target.id==='source-form'){e.preventDefault();saveSourceForm();}});

// Test-facing helpers are pure; there are no network or AI calls.
window.LinuxStudy={getState:()=>structuredClone(state),getQuestions:()=>structuredClone(cards()),getPlan:()=>structuredClone(SEED.plan),getCollections:()=>structuredClone(collections()),getAllQuestions:()=>structuredClone(allCards()),nextSchedule,validateState,migrateState,markdown,dayDiff,shiftDate,parsePack,parseMarkdown,makePreview,templatePack,packMarkdown,exportPackObject};
render();
})();
