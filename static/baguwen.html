<body><aside class="sidebar" id="sidebar"></aside><div class="shell"><header class="topbar"><div class="breadcrumb" id="breadcrumb"></div><div class="top-actions"><button class="search-link" data-action="search" aria-label="搜索题库"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>搜索知识点<kbd>/</kbd></button><span class="date-text" id="top-date"></span><div class="avatar" aria-hidden="true">学</div></div></header><main class="main"><div id="storage-warning"></div><div id="content"></div><footer class="footer" id="footer"></footer></main></div><div class="toast" id="toast" role="status" aria-live="polite"></div><input type="file" class="file-input" id="import-file" accept=".json,application/json" aria-label="选择学习备份文件"><noscript>此网站需要启用 JavaScript。它不需要联网；源码包中另有可直接阅读的八股学习 Markdown 计划。</noscript><script id="seed" type="application/json">{"questions":[{"id":"C01","category":"c","day":1,"title":"数组和指针到底有什么区别？","answer":"数组是连续存放同类型元素的对象；指针保存地址。数组表达式在许多场景中会转换为首元素指针，但数组本身不是指针。函数形参写成 int a[] 时会调整为指针参数，不能在函数里用 sizeof(a) 得到原数组大小。","points":["sizeof 数组得到整个数组的字节数，sizeof 指针得到指针自身大小。","指向数组的指针 int (*)[4] 与存放指针的数组 int*[4] 类型不同。"],"trap":"“数组名就是常量指针”只是粗糙类比，不能当语言规则。","follow":["函数如何同时接收数据和长度？","为什么 &a 与 a 指向相同起始位置，但步进不同？"],"lab":"打印数组、首元素指针和数组指针的 sizeof，并观察 p+1。","sources":[{"label":"C++ 标准草案 · conv.array","url":"https://eel.is/c++draft/conv.array"},{"label":"C++ 标准草案 · dcl.fct","url":"https://eel.is/c++draft/dcl.fct"}],"priority":"P0","code":"int a[4] = {1, 2, 3, 4};\nint* p = a;\nint (*pa)[4] = &a;\n// sizeof(a) == 4 * sizeof(int)\n// p + 1 跨过一个 int；pa + 1 跨过整个数组。","origins":[{"collectionId":"core","no":"C01","section":"原有核心题"},{"collectionId":"csdn-cpp-basics","no":"B16","section":"数组 / 一维数组与数组名"}],"answerKind":"核心题整理"},{"id":"C02","category":"c","day":1,"title":"sizeof 和 strlen 有什么区别？","answer":"sizeof 是求对象或类型所占字节数的运算符；strlen 统计以空字符结尾的字符串中，终止空字符之前的字节数，不包含终止符。sizeof 不会沿着指针扫描字符串。","points":["char s[] = \"abc\" 的 sizeof 是 4，strlen 是 3。","strlen 要求在可访问范围内遇到终止符；二进制图像数据不能用它计算长度。"],"trap":"C 的变长数组可能涉及运行时大小；不要把 C++ 常见情况泛化成所有 C 场景。","follow":["把字符串传给 char* 参数后，sizeof 结果是什么？","没有终止符会怎样？"],"lab":"对字符串数组、字符串指针和含中间零字节的数据分别测试。","sources":[{"label":"C++ 标准草案 · expr.sizeof","url":"https://eel.is/c++draft/expr.sizeof"},{"label":"Linux man-pages · strlen(3)","url":"https://man7.org/linux/man-pages/man3/strlen.3.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"C02","section":"原有核心题"},{"collectionId":"csdn-cpp-basics","no":"B06","section":"数据类型 / sizeof"}],"answerKind":"核心题整理"},{"id":"C03","category":"c","day":1,"title":"const int* 和 int* const 如何区分？","answer":"const int* 限制通过该指针修改所指的 int，指针自身可以重新指向别处。int* const 限制指针自身重新赋值，但可以通过它修改非 const 对象。const int* const 两者都限制。","points":["const 约束访问方式，不意味着对象一定存于只读段。","用 const_cast 去掉限定后，修改原本就是 const 的对象会产生未定义行为。"],"trap":"不要把只读访问接口等同于“对象永远不会被其他别名修改”。","follow":["指向非 const 对象的 const 指针能否观察到变化？","如何设计只读图像接口？"],"lab":"写四种 const 声明，逐条尝试修改并观察编译诊断。","sources":[{"label":"C++ 标准草案 · dcl.type.cv","url":"https://eel.is/c++draft/dcl.type.cv"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"C03","section":"原有核心题"},{"collectionId":"csdn-cpp-basics","no":"B24","section":"指针 / const 修饰"}],"answerKind":"核心题整理"},{"id":"C04","category":"c","day":1,"title":"static、extern 与存储期是什么关系？","answer":"局部 static 对象具有静态存储期，但名字仍受块作用域限制。文件作用域的 static 常用于给予名字内部链接。extern 常用来声明定义在别处的对象；作用域、链接和存储期是不同概念。","points":["C++11 起局部静态对象的首次初始化有并发保证，其后对象读写并不会自动同步。","头文件可放 extern int count;，通常在一个源文件里定义 int count = 0;。"],"trap":"extern 带初始化器也可以是定义；不能简单背成“extern 永远不分配存储”。","follow":["头文件定义普通全局变量为什么可能重复定义？","局部 static 对象是否线程安全？"],"lab":"创建两个源文件，共享一个计数器，再试验文件作用域 static。","sources":[{"label":"C++ 标准草案 · basic.stc","url":"https://eel.is/c++draft/basic.stc"},{"label":"C++ 标准草案 · basic.link","url":"https://eel.is/c++draft/basic.link"},{"label":"C++ 标准草案 · stmt.dcl","url":"https://eel.is/c++draft/stmt.dcl"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"C04","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"C05","category":"c","day":2,"title":"栈、堆和对象生命周期怎么讲？","answer":"栈和堆是常见实现中的内存组织概念。语言层面更准确地讨论自动、静态、线程与动态存储期。离开作用域通常会销毁局部自动对象；动态对象需要匹配的资源管理。对象生命周期和底层存储存在的时间并不完全相同。","points":["返回局部对象的地址，函数结束后就可能留下悬空指针。","局部 vector 对象可在栈上，其元素存储通常由分配器动态取得。"],"trap":"不能用“指针变量在栈上”推断它指向的数据也在栈上。","follow":["RAII 对象销毁时如何释放堆资源？","为何不能返回局部数组地址？"],"lab":"画出局部 vector、本地指针和动态数组之间的所有权关系。","sources":[{"label":"C++ 标准草案 · basic.stc","url":"https://eel.is/c++draft/basic.stc"},{"label":"C++ 标准草案 · basic.life","url":"https://eel.is/c++draft/basic.life"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"C05","section":"原有核心题"},{"collectionId":"csdn-cpp-core","no":"K01","section":"内存分区 / 存储期与生命周期"}],"answerKind":"核心题整理"},{"id":"C06","category":"c","day":2,"title":"malloc/free 与 new/delete 的区别？","answer":"malloc 分配原始存储，失败返回空指针；new 表达式通常会申请存储并初始化对象，普通抛异常形式失败通常抛出 bad_alloc。delete 表达式销毁对象并调用相应释放函数。两组接口必须匹配。","points":["new[] 对应 delete[]，malloc 对应 free。","现代 C++ 优先用容器和智能指针表达所有权。"],"trap":"不要把 glibc 的 128 KB 阈值当作语言规则，也不要混用 new 和 free。","follow":["placement new 与普通 new 有什么区别？","构造失败时已分配内存如何处理？"],"lab":"打印构造析构日志，对比 new 对象和 malloc 原始字节。","sources":[{"label":"C++ 标准草案 · expr.new","url":"https://eel.is/c++draft/expr.new"},{"label":"C++ 标准草案 · expr.delete","url":"https://eel.is/c++draft/expr.delete"},{"label":"Linux man-pages · malloc(3)","url":"https://man7.org/linux/man-pages/man3/malloc.3.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"C06","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"42","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K03","section":"内存分区 / new 与 delete"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"C07","category":"c","day":2,"title":"悬空指针、泄漏和重复释放有什么区别？","answer":"悬空指针指向生命周期已结束或存储已释放的对象；内存泄漏是仍占有的动态内存失去正常释放路径；重复释放是同一资源被再次释放。三者都需要沿着所有权和生命周期定位。","points":["将一个指针设为 nullptr 不会自动清除其他别名。","异常和提前返回会增加手动清理遗漏的风险。"],"trap":"程序没有立刻崩溃，不代表释放后访问合法。","follow":["如何定位偶发 use-after-free？","跨线程缓冲区怎样避免提前归还？"],"lab":"用 AddressSanitizer 复现一次释放后使用，再通过 RAII 修正。","sources":[{"label":"C++ 标准草案 · basic.life","url":"https://eel.is/c++draft/basic.life"},{"label":"Clang · AddressSanitizer","url":"https://clang.llvm.org/docs/AddressSanitizer.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"C07","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"41","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-basics","no":"B23","section":"指针 / 空指针与野指针"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"C08","category":"c","day":9,"title":"结构体内存对齐有什么意义？","answer":"成员偏移和结构体总大小可能含填充，以满足成员和对象自身的对齐要求。具体布局依赖类型、ABI 与编译选项，不是简单把成员大小相加。调整成员顺序可能改变大小。","points":["用 sizeof、alignof 和适用类型上的 offsetof 验证布局。","网络协议和文件格式应明确序列化字段，不能直接依赖本机结构体布局。"],"trap":"强行 packed 不是通用优化，可能引入未对齐访问和可移植性问题。","follow":["为什么末尾还需要填充？","图像 stride 与结构体 padding 有什么相似处？"],"lab":"比较两种成员顺序的结构体，在主机和板端分别记录大小。","sources":[{"label":"C++ 标准草案 · basic.align","url":"https://eel.is/c++draft/basic.align"},{"label":"C++ 标准草案 · expr.sizeof","url":"https://eel.is/c++draft/expr.sizeof"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"C08","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"18","section":"C/C++ 面经"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"C09","category":"c","day":6,"title":"memcpy 和 memmove 如何选择？","answer":"memcpy 复制指定字节数，要求源和目的区域不重叠；memmove 允许重叠，其效果等同于经临时缓冲区完成复制。它们处理字节，不负责一般 C++ 对象的所有权和拷贝语义。","points":["先证明目标容量足够，再检查源目的生命周期。","复制含 string 或独占资源的对象，不能粗暴用 memcpy 代替拷贝构造。"],"trap":"“从后往前复制就一定正确”也需要依据具体重叠方向判断。","follow":["图像行步长不同时应怎样复制？","为何不能直接 memcpy 一个 std::string？"],"lab":"在一个数组内移动数据，对比重叠区间；图像练习按行复制。","sources":[{"label":"Linux man-pages · memcpy(3)","url":"https://man7.org/linux/man-pages/man3/memcpy.3.html"},{"label":"Linux man-pages · memmove(3)","url":"https://man7.org/linux/man-pages/man3/memmove.3.html"}],"priority":"P0","code":"char a[] = \"abcdef\";\n// 源与目的重叠，因此使用 memmove。\nstd::memmove(a + 1, a, 5);\na[6] = '\\0'; // 结果：aabcde","origins":[{"collectionId":"core","no":"C09","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"C10","category":"c","day":23,"title":"函数指针、回调和上下文指针怎么用？","answer":"函数指针保存可调用函数的地址，回调用于让库在约定时机调用用户逻辑。C 接口经常额外传入 void* 上下文，把状态与回调关联；调用约定、参数类型和上下文生命周期必须正确。","points":["普通非静态成员函数需要对象，不能随意当作普通 C 函数指针。","异步回调结束前，不能销毁它依赖的上下文。"],"trap":"强制转换成看似匹配的函数指针，不能修复真实类型不兼容。","follow":["为何回调接口需要 user_data？","如何从 C 回调转发到 C++ 对象？"],"lab":"设计 on_frame(void* user, const Frame* f)，写注册、调用和取消流程。","sources":[{"label":"C++ 标准草案 · dcl.fct","url":"https://eel.is/c++draft/dcl.fct"},{"label":"C++ 标准草案 · dcl.link","url":"https://eel.is/c++draft/dcl.link"}],"priority":"P1","code":"","origins":[{"collectionId":"core","no":"C10","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"82","section":"C/C++ 面经"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"CPP01","category":"cpp","day":3,"title":"RAII 到底管理的是什么？","answer":"RAII 将资源所有权绑定到对象生命周期：成功构造后对象负责资源，析构时释放。资源不只是内存，也包括文件描述符、锁和 SDK 句柄。它使正常返回、提前返回和异常路径共享可靠的清理逻辑。","points":["资源获取失败不应留下“看似有效”的半成品对象。","可能失败且业务必须获知的提交或刷新操作，宜提供显式接口，析构兜底。"],"trap":"RAII 不等于必须用 shared_ptr，更不等于只封装 new/delete。","follow":["文件描述符类应允许复制吗？","析构函数为什么通常不能抛异常？"],"lab":"实现不可拷贝、可移动的 Fd 类，并测试移动和错误分支。","sources":[{"label":"C++ Core Guidelines · R.1","url":"https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Rr-raii"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"CPP01","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"CPP02","category":"cpp","day":3,"title":"深拷贝、浅拷贝和 Rule of Zero？","answer":"浅层复制成员值可能导致多个对象误以为独占同一资源。深拷贝为新对象取得独立资源。Rule of Zero 建议让资源管理成员承担这些职责，业务类尽量不手写析构、拷贝和移动函数。","points":["声明或删除某些特殊成员函数会影响其他特殊成员函数的隐式生成。","资源不可复制时应明确 delete 拷贝操作，而不是悄悄共享裸指针。"],"trap":"深拷贝不是永远更好；共享、转移或禁止拷贝都可能更符合语义。","follow":["为何手写析构后应检查拷贝与移动？","资源对象适合深拷贝还是转移所有权？"],"lab":"给管理资源的类定义清晰的复制策略，再尝试放入容器。","sources":[{"label":"C++ 标准草案 · class.copy.ctor","url":"https://eel.is/c++draft/class.copy.ctor"},{"label":"C++ 标准草案 · class.copy.assign","url":"https://eel.is/c++draft/class.copy.assign"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"CPP02","section":"原有核心题"},{"collectionId":"csdn-cpp-basics","no":"B27","section":"结构体 / 复制与所有权"},{"collectionId":"csdn-cpp-core","no":"K15","section":"对象初始化 / 深拷贝与浅拷贝"}],"answerKind":"核心题整理"},{"id":"CPP03","category":"cpp","day":3,"title":"unique_ptr 如何表达独占所有权？","answer":"unique_ptr 在同一时刻只有一个所有者，不可复制、可以移动；销毁时调用删除器。它适合无需共享生命周期的资源，也能用自定义删除器对接 C 库释放函数。","points":["get 取得非拥有型裸指针，release 放弃所有权且不释放，reset 替换并释放旧资源。","自定义删除器要与真实资源释放接口匹配。"],"trap":"拿到 get() 的调用方不能擅自 delete，也不能在所有者销毁后继续使用。","follow":["release 为什么容易泄漏？","怎样用自定义删除器管理 SDK 句柄？"],"lab":"把资源所有权通过 std::move 放入队列，验证恰好释放一次。","sources":[{"label":"C++ 标准草案 · unique.ptr","url":"https://eel.is/c++draft/unique.ptr"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"CPP03","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"CPP04","category":"cpp","day":4,"title":"shared_ptr、weak_ptr 与循环引用？","answer":"shared_ptr 通过共享控制块管理共同所有权；最后一个强引用消失时销毁对象。weak_ptr 不增加强引用计数，使用前用 lock 尝试获得共享所有权，可用于打破强引用环。","points":["不同 shared_ptr 实例共享控制块时，计数管理可并发；被指向对象的读写仍需同步。","不要用同一裸指针分别创建两个互不相关的 shared_ptr 控制块。"],"trap":"shared_ptr 不是万能的线程安全或生命周期设计替代品。","follow":["对象已销毁后，weak_ptr 还可能存在吗？","同一个 shared_ptr 变量能否无保护并发改写？"],"lab":"创建两对象相互引用，再把其中一条边改为 weak_ptr，观察析构。","sources":[{"label":"C++ 标准草案 · util.smartptr.shared","url":"https://eel.is/c++draft/util.smartptr.shared"},{"label":"C++ 标准草案 · util.smartptr.weak","url":"https://eel.is/c++draft/util.smartptr.weak"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"CPP04","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"CPP05","category":"cpp","day":4,"title":"std::move 会真的移动数据吗？","answer":"std::move 本身是类型转换工具，把表达式转换成允许移动的值类别。实际是否移动取决于后续选中的构造、赋值或重载；不存在合适移动操作时仍可能发生拷贝。","points":["被 std::move 的 const 对象往往不能绑定到常见的 T&& 移动构造参数。","标准库对象被移动后通常处于有效但未指定的状态，不能一概假定为空。"],"trap":"std::move 不会自动“清空变量”，更不会立刻释放资源。","follow":["为什么 return local; 通常不应强行 std::move？","右值引用变量作为表达式是什么值类别？"],"lab":"给类型的拷贝与移动函数打印日志，分别传入普通对象和 const 对象。","sources":[{"label":"C++ 标准草案 · forward","url":"https://eel.is/c++draft/forward"},{"label":"C++ 标准草案 · lib.types.movedfrom","url":"https://eel.is/c++draft/lib.types.movedfrom"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"CPP05","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"35","section":"C/C++ 面经"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"CPP06","category":"cpp","day":4,"title":"vector 的 size、capacity、reserve、resize？","answer":"size 是当前元素数，capacity 是当前容量。reserve 请求至少容纳指定数量元素的容量，不改变 size；resize 改变元素数，会构造或销毁元素，必要时重分配。","points":["发生重分配时，原元素的指针、引用和迭代器都会失效。","扩容倍数不是标准固定的 2 倍或 1.5 倍。"],"trap":"reserve(100) 后直接访问 v[99]，若 size 不足仍然越界。","follow":["erase 后哪些迭代器失效？","为什么动态缓冲区应避免频繁扩容？"],"lab":"记录 capacity 和 data() 在连续 push_back 时的变化。","sources":[{"label":"C++ 标准草案 · vector.capacity","url":"https://eel.is/c++draft/vector.capacity"},{"label":"C++ 标准草案 · vector.modifiers","url":"https://eel.is/c++draft/vector.modifiers"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"CPP06","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"50","section":"C/C++ 面经"},{"collectionId":"csdn-cpp","no":"60","section":"C/C++ 面经"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"CPP07","category":"cpp","day":7,"title":"map 和 unordered_map 如何选择？","answer":"map 按比较器维持有序键，常见实现是平衡树，查找具有对数复杂度；unordered_map 是无序关联容器，通常依靠哈希，查找平均常数、最坏线性。选型要看是否需要顺序、最坏情况和实际负载。","points":["哈希质量、负载因子和 rehash 会影响性能与迭代器。","operator[] 在键不存在时可能插入元素，纯查询可用 find。"],"trap":"标准未要求 map 必须实现为红黑树，也不能说哈希查找永远 O(1)。","follow":["为什么 rehash 会让迭代器失效？","查不到键时怎样避免意外插入？"],"lab":"用相同数据测试两种容器，分别测插入、查找与有序遍历需求。","sources":[{"label":"C++ 标准草案 · associative.reqmts","url":"https://eel.is/c++draft/associative.reqmts"},{"label":"C++ 标准草案 · unord.req","url":"https://eel.is/c++draft/unord.req"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"CPP07","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"47","section":"C/C++ 面经"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"CPP08","category":"cpp","day":7,"title":"虚函数与虚析构函数怎么解释？","answer":"虚函数使通过基类指针或引用的调用，能够依据对象动态类型选择覆盖版本。若接口允许通过基类指针删除派生对象，常规做法是让基类析构函数为 virtual。","points":["虚表和虚指针是常见实现机制，不是所有对象布局的语言保证。","构造与析构期间的虚调用不会简单地分派到最派生类版本。","构造函数不能是 virtual；通过基类指针 delete 派生对象时，通常应有可访问的虚析构，不能依赖只释放基类部分的行为。"],"trap":"普通非静态成员函数不能通过空对象指针合法调用，即便某次没有崩溃。","follow":["override 能发现什么错误？","所有类都需要虚析构吗？"],"lab":"通过基类指针调用并销毁派生对象，观察函数和析构日志。","sources":[{"label":"C++ 标准草案 · class.virtual","url":"https://eel.is/c++draft/class.virtual"},{"label":"C++ 标准草案 · class.dtor","url":"https://eel.is/c++draft/class.dtor"},{"label":"C++ 标准草案 · class.mfct.non.static","url":"https://eel.is/c++draft/class.mfct.non.static"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"CPP08","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"25","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K33","section":"多态 / 虚函数与虚析构"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"CPP09","category":"cpp","day":7,"title":"重载、重写与名称隐藏有什么区别？","answer":"重载是在同一查找范围内用不同参数列表提供同名函数；重写是派生类覆盖匹配的基类虚函数；隐藏是派生类中的同名声明影响对基类同名成员的查找，未必是重写。","points":["派生类写 override 可让编译器检查确实覆盖了虚函数。","using Base::f 可把基类重载集合引入派生类作用域。"],"trap":"仅返回类型不同不能构成普通函数重载；参数差一点可能是隐藏而非覆盖。","follow":["给派生函数误加 const 会怎样？","如何保留基类的其他重载？"],"lab":"写 Base::f(int) 与 Derived::f(double)，加 override 检查诊断。","sources":[{"label":"C++ 标准草案 · class.virtual","url":"https://eel.is/c++draft/class.virtual"},{"label":"C++ 标准草案 · over.load","url":"https://eel.is/c++draft/over.load"},{"label":"C++ 标准草案 · class.member.lookup","url":"https://eel.is/c++draft/class.member.lookup"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"CPP09","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"89","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K09","section":"函数提高 / 重载、重写与隐藏"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"CPP10","category":"cpp","day":10,"title":"Lambda 捕获在多线程里有什么坑？","answer":"值捕获把所需状态存入闭包，引用捕获依赖外部对象持续存活；异步执行时尤其要检查生命周期。捕获 this 通常保存对象指针，不会自动延长原对象寿命。","points":["引用捕获局部变量后把闭包交给后台线程，函数返回可能留下悬空引用。","捕获独占资源可以用初始化捕获并移动进入闭包。"],"trap":"值捕获指针只复制地址，并未深拷贝所指对象。","follow":["[=] 会自动安全管理 this 吗？","如何将 unique_ptr 转移到任务中？"],"lab":"让线程晚于创建任务的函数返回，再改写为安全的所有权捕获。","sources":[{"label":"C++ 标准草案 · expr.prim.lambda.capture","url":"https://eel.is/c++draft/expr.prim.lambda.capture"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"CPP10","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"57","section":"C/C++ 面经"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"CPP11","category":"cpp","day":5,"title":"extern \"C\" 与 inline 分别解决什么？","answer":"extern \"C\" 指定语言链接，使接口能按相应 C 链接规则衔接；它不把 C++ 代码按 C 语法编译。inline 影响定义与链接规则，不保证机器码一定在调用处展开，也不禁止函数同时为 virtual。","points":["C 可调用接口通常暴露兼容的类型与清晰所有权，不直接暴露 STL 类型。","头文件中 inline 函数的多份定义须遵守单一定义规则。"],"trap":"名称修饰规则是 ABI 实现的一部分，不能只背“去掉函数名后缀”。","follow":["为何 C++ 调用 C 库时可能链接失败？","inline 与编译器优化内联有何区别？"],"lab":"写一个 C 函数和 C++ 主程序，分别尝试有无 C 链接声明。","sources":[{"label":"C++ 标准草案 · dcl.link","url":"https://eel.is/c++draft/dcl.link"},{"label":"C++ 标准草案 · dcl.inline","url":"https://eel.is/c++draft/dcl.inline"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"CPP11","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"68","section":"C/C++ 面经"},{"collectionId":"csdn-cpp","no":"75","section":"C/C++ 面经"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"CPP12","category":"cpp","day":13,"title":"异常安全和 noexcept 应该怎么回答？","answer":"异常安全关注操作失败后资源和状态是否仍然正确，常讨论无泄漏的基本保证、失败不改变可见状态的强保证，以及不抛异常保证。noexcept 声明不传播异常的契约；违反时会调用 terminate。","points":["先用 RAII 保证释放，再设计修改状态的提交时机。","析构清理应避免抛出异常；需要报告的 I/O 失败宜显式处理。"],"trap":"noexcept 不会自动吞掉异常，也不代表函数一定成功。","follow":["构造函数中途失败已构造成员会怎样？","如何给配置加载提供强保证？"],"lab":"先解析到临时配置，验证后整体替换，模拟任一步骤失败。","sources":[{"label":"C++ 标准草案 · except.spec","url":"https://eel.is/c++draft/except.spec"},{"label":"C++ 标准草案 · except.ctor","url":"https://eel.is/c++draft/except.ctor"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"CPP12","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"L01","category":"linux","day":8,"title":"进程与线程分别共享哪些资源？","answer":"进程通常拥有独立虚拟地址空间；同一进程内的线程共享地址空间、文件描述符等资源，各自拥有执行上下文、栈和线程局部状态。多线程方便共享数据，也需要同步和生命周期管理。","points":["线程各自有栈，不表示栈在地址空间中互相隔离。","多进程隔离更强，但共享数据通常需要 IPC。"],"trap":"“线程切换一定比进程切换快多少倍”没有通用固定答案。","follow":["崩溃隔离更重要时怎样选择？","信号屏蔽字是进程级还是线程级？"],"lab":"创建两线程打印 PID、线程标识和局部变量地址，比较访问全局变量。","sources":[{"label":"Linux man-pages · pthreads(7)","url":"https://man7.org/linux/man-pages/man7/pthreads.7.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"L01","section":"原有核心题"},{"collectionId":"csdn-linux","no":"4.1 线程概述","section":"多线程"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"L02","category":"linux","day":8,"title":"fork、exec 与 wait 各做什么？","answer":"fork 创建子进程，父子根据返回值走不同分支；exec 系列替换当前进程的程序映像，成功不返回；wait/waitpid 回收子进程状态。Linux 的 fork 常通过写时复制降低初始内存复制成本。","points":["fork 后打开文件描述符可指向共享的打开文件描述，因此偏移可能共享。","多线程进程 fork 后，子进程到 exec 前只能安全调用受约束的异步信号安全函数。"],"trap":"exec 不是再创建一个新进程；不要把三者混成一次操作。","follow":["父子如何区分 fork 返回值？","为何多线程 fork 后子进程容易卡锁？"],"lab":"fork 后子进程 exec 一个小程序，父进程 waitpid 并检查退出状态。","sources":[{"label":"Linux man-pages · fork(2)","url":"https://man7.org/linux/man-pages/man2/fork.2.html"},{"label":"Linux man-pages · exec(3)","url":"https://man7.org/linux/man-pages/man3/exec.3.html"},{"label":"Linux man-pages · wait(2)","url":"https://man7.org/linux/man-pages/man2/wait.2.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"L02","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"31","section":"C/C++ 面经"},{"collectionId":"csdn-linux","no":"2.1 进程创建 / fork","section":"进程与 IPC"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"L03","category":"linux","day":8,"title":"僵尸进程与孤儿进程有什么区别？","answer":"僵尸进程已退出，但父进程尚未回收其退出状态，仍占用少量进程记录；孤儿进程是父进程先退出而自己仍在运行。孤儿通常会被相应的子收割者或 init 接管，两者并不等价。","points":["父进程应正确使用 wait 系列回收子进程。","僵尸已不执行代码，给它发 SIGKILL 不能替代父进程回收。"],"trap":"不要把“所有孤儿都只能由宿主机 PID 1 回收”当成无条件规则。","follow":["如何处理同时退出的多个子进程？","waitpid 的 WNOHANG 用于什么？"],"lab":"暂时不 wait 观察进程状态，再添加回收逻辑验证变化。","sources":[{"label":"Linux man-pages · wait(2)","url":"https://man7.org/linux/man-pages/man2/wait.2.html"},{"label":"Linux man-pages · prctl(2)","url":"https://man7.org/linux/man-pages/man2/prctl.2.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"L03","section":"原有核心题"},{"collectionId":"csdn-linux","no":"2.1 孤儿进程 / 僵尸进程","section":"进程与 IPC"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"L04","category":"linux","day":6,"title":"文件描述符、FILE* 和打开文件描述？","answer":"文件描述符是进程描述符表中的整数索引；打开文件描述是内核维护的打开状态，包含偏移和状态标志。FILE* 是标准 I/O 库的流对象，通常还有用户态缓冲。三者处于不同抽象层。","points":["read/write 处理描述符，fread/fwrite 处理流。","不要在缺乏同步和偏移管理时随意混用同一文件的两套 I/O。"],"trap":"文件描述符不是指向文件内容的内存指针。","follow":["两个 open 与一次 open 后 dup 有什么差别？","fork 后偏移是否共享？"],"lab":"使用 dup 后交替 read，观察共享偏移；再对比两次 open。","sources":[{"label":"Linux man-pages · open(2)","url":"https://man7.org/linux/man-pages/man2/open.2.html"},{"label":"Linux man-pages · stdio(3)","url":"https://man7.org/linux/man-pages/man3/stdio.3.html"},{"label":"Linux man-pages · dup(2)","url":"https://man7.org/linux/man-pages/man2/dup.2.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"L04","section":"原有核心题"},{"collectionId":"csdn-linux","no":"1.1 文件描述符","section":"文件 IO"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"L05","category":"linux","day":6,"title":"read/write 为什么必须处理部分读写？","answer":"成功返回的字节数可能小于请求值。read 返回 0 通常表示相应输入的文件结束；-1 需结合 errno 处理。write 返回正值时只说明已接受这些字节，应用要推进偏移继续发送剩余部分。","points":["EINTR 通常需要依接口语义重试；非阻塞 EAGAIN 应等待就绪，不能忙循环。","先判断负返回值，再转换为无符号长度，避免巨大整数。"],"trap":"一次 read 不等于一条完整消息；write 成功不等于持久化或对端应用已处理。","follow":["写循环如何推进指针与剩余长度？","非阻塞读取何时停下来？"],"lab":"实现 write_all，显式处理部分写、EINTR、EAGAIN 和无法推进的情况。","sources":[{"label":"Linux man-pages · read(2)","url":"https://man7.org/linux/man-pages/man2/read.2.html"},{"label":"Linux man-pages · write(2)","url":"https://man7.org/linux/man-pages/man2/write.2.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"L05","section":"原有核心题"},{"collectionId":"csdn-linux","no":"1.2 read / write","section":"文件 IO"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"L06","category":"linux","day":9,"title":"mmap 相比 read/write 有什么特点？","answer":"mmap 把文件或其他支持映射的对象映射到虚拟地址空间，可通过内存访问读写映射区域。它不等于把整个文件立即读入物理内存；缺页、同步、边界和映射生命周期仍需管理。","points":["MAP_SHARED 与 MAP_PRIVATE 的修改可见性不同。","文件大小变化或访问无效映射区域可能引发故障；结束后 munmap。"],"trap":"mmap 不是无条件更快，也不意味着任何设备缓冲区都能任意映射。","follow":["共享映射为什么还需要同步？","关闭 fd 后映射是否立即失效？"],"lab":"映射一个小文件，修改共享区域，显式同步并验证文件内容。","sources":[{"label":"Linux man-pages · mmap(2)","url":"https://man7.org/linux/man-pages/man2/mmap.2.html"},{"label":"Linux man-pages · msync(2)","url":"https://man7.org/linux/man-pages/man2/msync.2.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"L06","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"L07","category":"linux","day":8,"title":"管道、共享内存与 Unix 域 Socket 如何选？","answer":"管道适合字节流式单向通信；共享内存允许多个进程访问同一存储，但需要额外同步协议；Unix 域 Socket 提供本机进程间通信，支持不同通信语义，也可传递文件描述符。","points":["共享内存不是“无需同步的最快消息队列”。","所有管道写端关闭后，读完缓冲数据才会读到 EOF。"],"trap":"父子进程忘记关闭不使用的管道端，可能导致永远等不到结束。","follow":["共享内存如何通知新数据到达？","什么时候需要传递 fd 而不是其数值？"],"lab":"父子用管道传消息，关闭多余端；再设计共享区中的序号与同步。","sources":[{"label":"Linux man-pages · pipe(7)","url":"https://man7.org/linux/man-pages/man7/pipe.7.html"},{"label":"Linux man-pages · shm_overview(7)","url":"https://man7.org/linux/man-pages/man7/shm_overview.7.html"},{"label":"Linux man-pages · unix(7)","url":"https://man7.org/linux/man-pages/man7/unix.7.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"L07","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"19","section":"C/C++ 面经"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"L08","category":"linux","day":13,"title":"SIGTERM、SIGKILL、SIGPIPE 与信号安全？","answer":"SIGTERM 常用于请求程序有序退出；SIGKILL 不能被捕获、忽略或阻塞。向没有读端的管道写入会产生 SIGPIPE。异步信号处理函数只能调用异步信号安全的操作，不宜在里面执行复杂日志、加锁或资源清理。","points":["多线程程序可考虑阻塞信号并由专用线程 sigwait 同步处理。","主线程收到退出请求后，应唤醒工作线程并组织回收。","SIGPIPE 是断管等相关信号，SIGALRM 才是 alarm 等定时器信号。信号编号依架构可能不同，代码优先使用符号名。"],"trap":"SIGALRM 是定时器相关信号，不是断管信号。","follow":["为何信号处理函数里 printf 或 mutex 可能出问题？","如何把信号转换为主循环事件？"],"lab":"写一个能响应 SIGTERM 的程序，把实际清理留给正常执行路径。","sources":[{"label":"Linux man-pages · signal(7)","url":"https://man7.org/linux/man-pages/man7/signal.7.html"},{"label":"Linux man-pages · signal-safety(7)","url":"https://man7.org/linux/man-pages/man7/signal-safety.7.html"},{"label":"Linux man-pages · sigwait(3)","url":"https://man7.org/linux/man-pages/man3/sigwait.3.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"L08","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"83","section":"C/C++ 面经"},{"collectionId":"csdn-linux","no":"3.1 信号概述 / 编号 / 默认动作","section":"信号"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"L09","category":"linux","day":6,"title":"fflush、fsync 与文件删除后仍可读？","answer":"fflush 将标准 I/O 用户态缓冲交给底层输出；fsync 要求把指定文件的数据及必要元数据同步到存储设备。删除目录项不会立即终止已有打开描述符对文件的访问。","points":["重要的文件创建或重命名持久化，还可能需要同步所在目录。","日志占空间却找不到文件时，检查是否仍有进程持有已删除文件。"],"trap":"write 成功不等于断电可恢复；unlink 不等于立即擦除底层数据。","follow":["为什么清空日志后空间仍未释放？","文件更新如何减小半写风险？"],"lab":"打开临时文件后 unlink，再从已有描述符读取并观察关闭前后的行为。","sources":[{"label":"Linux man-pages · fsync(2)","url":"https://man7.org/linux/man-pages/man2/fsync.2.html"},{"label":"Linux man-pages · fflush(3)","url":"https://man7.org/linux/man-pages/man3/fflush.3.html"},{"label":"Linux man-pages · unlink(2)","url":"https://man7.org/linux/man-pages/man2/unlink.2.html"}],"priority":"P1","code":"","origins":[{"collectionId":"core","no":"L09","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"L10","category":"linux","day":20,"title":"如何理解用户态、内核态与上下文切换？","answer":"应用通过系统调用请求内核服务，执行权限从用户态进入内核态再返回；这不必然切换到另一个进程。调度上下文切换则保存与恢复不同任务的执行状态。两者相关但不是同一个概念。","points":["阻塞 I/O 可能引发调度；一个未阻塞的系统调用也可能直接返回当前任务。","优化应先测量系统调用频率、等待和热点，而不是凭术语猜。"],"trap":"不能把所有用户态/内核态转换都说成进程切换。","follow":["CPU 高是计算多还是系统调用多？","线程阻塞时占用 CPU 吗？"],"lab":"对文件复制程序使用 strace -c，比较小缓冲区和大缓冲区调用次数。","sources":[{"label":"Linux man-pages · syscalls(2)","url":"https://man7.org/linux/man-pages/man2/syscalls.2.html"},{"label":"Linux man-pages · sched(7)","url":"https://man7.org/linux/man-pages/man7/sched.7.html"}],"priority":"P1","code":"","origins":[{"collectionId":"core","no":"L10","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"T01","category":"thread","day":10,"title":"join 与 detach 对生命周期有什么影响？","answer":"join 等待线程结束，并完成线程回收与相应同步；detach 让线程独立运行，调用方失去 join 它的能力。被分离的线程仍需要保证其数据和依赖对象持续有效。","points":["可 join 的 std::thread 在析构时会调用 terminate，必须事先 join 或 detach。","应用退出方案要覆盖正在等待、正在 I/O 和正在执行任务的线程。"],"trap":"detach 不是“自动安全管理后台任务”，也不延长局部变量生命周期。","follow":["线程持有对象引用而对象先销毁怎么办？","为何服务退出更适合受控 join？"],"lab":"实现可停止的工作线程，让销毁入口通知停止并 join。","sources":[{"label":"C++ 标准草案 · thread.thread.destr","url":"https://eel.is/c++draft/thread.thread.destr"},{"label":"C++ 标准草案 · thread.thread.member","url":"https://eel.is/c++draft/thread.thread.member"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"T01","section":"原有核心题"},{"collectionId":"csdn-linux","no":"4.5 线程分离","section":"多线程"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"T02","category":"thread","day":10,"title":"数据竞争与业务竞态有什么不同？","answer":"C++ 数据竞争通常指不同线程间未按 happens-before 排序的冲突访问，至少一次写入且并非都为原子访问，会导致未定义行为。业务竞态则可能在没有数据竞争时仍然出现，例如多个独立原子步骤之间逻辑被插入。","points":["原子计数器的单次自增安全，不代表“先检查再执行”整体原子。","多个字段的状态不变量通常更适合在同一把锁下维护。"],"trap":"“只读线程不需要锁”只有在不存在未同步写入等前提下才成立。","follow":["先检查队列不空再取元素为何有风险？","原子变量能保护关联缓冲区吗？"],"lab":"用 ThreadSanitizer 检查普通计数器竞争，再比较原子和互斥锁方案。","sources":[{"label":"C++ 标准草案 · intro.races","url":"https://eel.is/c++draft/intro.races"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"T02","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"43","section":"C/C++ 面经"},{"collectionId":"csdn-linux","no":"5.1 线程同步方式","section":"线程同步"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"T03","category":"thread","day":10,"title":"互斥锁、自旋锁与读写锁怎么选？","answer":"互斥锁用于保护临界区，竞争时可以等待；自旋锁在等待期间持续尝试，适合特定短临界区和调度条件；读写锁允许多个读者或一个写者，但维护成本、公平性与负载也影响性能。","points":["一般应用先选清晰可靠的互斥锁，再用测量决定优化。","锁内避免耗时 I/O、计算与不受控的回调。"],"trap":"“读多写少必然读写锁更快”或“自旋锁必然更快”都不成立。","follow":["持锁线程被调度出去，自旋者会怎样？","锁粒度太大或太小有什么代价？"],"lab":"用互斥锁保护任务队列，只在锁内移动资源对象，不在锁内处理任务。","sources":[{"label":"Linux man-pages · pthread_mutex_lock(3)","url":"https://man7.org/linux/man-pages/man3/pthread_mutex_lock.3.html"},{"label":"Linux man-pages · pthread_spin_lock(3)","url":"https://man7.org/linux/man-pages/man3/pthread_spin_lock.3.html"},{"label":"Linux man-pages · pthread_rwlock_rdlock(3)","url":"https://man7.org/linux/man-pages/man3/pthread_rwlock_rdlock.3.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"T03","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"T04","category":"thread","day":11,"title":"条件变量为什么要配合谓词？","answer":"条件变量让线程在共享条件不满足时等待。wait 会释放互斥锁并进入等待，返回前重新获得锁；醒来后必须重新检查条件，因为可能虚假唤醒，或者条件已被其他线程消费。","points":["条件状态的访问与修改应遵守同一同步协议。","通知不是可永久记账的消息；等待的是条件，不是通知本身。"],"trap":"把 if 判断加一次 wait 当作完整实现，可能在唤醒后错误访问空队列。","follow":["为什么需要在关闭时 notify_all？","先通知再等待是否会丢通知？"],"lab":"实现等待“队列非空或已关闭”的 pop，并测试空队列关闭。","sources":[{"label":"C++ 标准草案 · thread.condition.condvar","url":"https://eel.is/c++draft/thread.condition.condvar"}],"priority":"P0","code":"std::unique_lock\u003cstd::mutex> lock(mutex);\ncv.wait(lock, [&] { return closed || !queue.empty(); });\nif (queue.empty()) return false; // 已关闭且排空\nauto item = std::move(queue.front());\nqueue.pop_front();","origins":[{"collectionId":"core","no":"T04","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"79","section":"C/C++ 面经"},{"collectionId":"csdn-linux","no":"5.5 条件变量","section":"线程同步"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"T05","category":"thread","day":15,"title":"有界阻塞队列应该包含哪些状态？","answer":"队列需要容量、存储、互斥锁、可读与可写条件变量，以及关闭标志。push 等待有空间或关闭，pop 等待有数据或关闭。必须定义关闭后拒绝新任务，以及旧任务排空还是取消的策略。","points":["关闭时唤醒两类等待者；等待谓词包含 closed。","队列对象销毁前，所有访问它的线程应已退出。"],"trap":"只给 pop 加锁但不保护 size、empty 和关闭状态，仍可能出错。","follow":["满队列关闭时生产者能退出吗？","只移动对象如何入队？"],"lab":"写容量为 2 的队列，测试慢消费者、关闭、排空与重复关闭。","sources":[{"label":"C++ 标准草案 · thread.condition.condvar","url":"https://eel.is/c++draft/thread.condition.condvar"},{"label":"C++ 标准草案 · thread.mutex.requirements","url":"https://eel.is/c++draft/thread.mutex.requirements"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"T05","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"T06","category":"thread","day":12,"title":"死锁的条件与工程防范？","answer":"典型资源死锁需要互斥、持有并等待、不可抢占和循环等待同时存在。工程上可统一锁顺序、减少嵌套持锁、使用合适的多锁获取机制，或避免在锁内调用不可控代码。","points":["锁的释放用 RAII 保证。","排查时查看所有线程栈和等待关系，而不只看主线程。"],"trap":"超时并不自动修复死锁设计；忙等重试还可能转化为活锁。","follow":["两线程反序获取两把锁会怎样？","join 时持有工作线程需要的锁有什么风险？"],"lab":"人为制造双锁死锁，用 thread apply all bt 找到等待关系后修正锁顺序。","sources":[{"label":"C++ Core Guidelines · CP.21","url":"https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Rconc-lock"},{"label":"C++ 标准草案 · thread.lock.algorithm","url":"https://eel.is/c++draft/thread.lock.algorithm"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"T06","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"26","section":"C/C++ 面经"},{"collectionId":"csdn-linux","no":"5.3 死锁","section":"线程同步"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"T07","category":"thread","day":12,"title":"原子操作等于不可被调度打断吗？","answer":"不是。原子性关注相关访问的不可分割性，不保证执行期间禁止线程调度。std::atomic 为原子访问提供接口；具体是否 lock-free 取决于类型和实现，多个原子操作也不自动组成事务。","points":["需要整个读改写不可分割时，用 fetch_add、exchange 或 CAS 等操作。","仅 a = a + 1 即便 a 是原子变量，也可能分成独立原子读与写。"],"trap":"不要把 atomic、lock-free、wait-free 和禁止抢占混为一谈。","follow":["compare_exchange 失败时 expected 会怎样？","为什么 ++a 与 a=a+1 不一样？"],"lab":"两线程对原子计数器使用 fetch_add，并解释更复杂条件更新需要什么。","sources":[{"label":"C++ 标准草案 · atomics.types.operations","url":"https://eel.is/c++draft/atomics.types.operations"},{"label":"C++ 标准草案 · atomics.order","url":"https://eel.is/c++draft/atomics.order"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"T07","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"16","section":"C/C++ 面经"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"T08","category":"thread","day":12,"title":"volatile 为什么不能做线程同步？","answer":"volatile 让相关访问遵守 volatile 语义，常见于实现规定的硬件访问场景，但不提供一般线程间原子性或 happens-before 同步。共享停止标志通常应使用原子对象或互斥锁保护。","points":["可见性、原子性和顺序是需要区分的问题。","MMIO 的正确访问还受平台、驱动和屏障规则约束。"],"trap":"volatile bool stop 不能代替 std::atomic\u003cbool>。","follow":["编译器不省略访问为何仍可能有数据竞争？","设备寄存器访问与普通共享内存有何区别？"],"lab":"把有竞争的 volatile 计数器改为 atomic，并用工具验证。","sources":[{"label":"C++ 标准草案 · dcl.type.cv","url":"https://eel.is/c++draft/dcl.type.cv"},{"label":"C++ 标准草案 · intro.races","url":"https://eel.is/c++draft/intro.races"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"T08","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"T09","category":"thread","day":16,"title":"acquire/release 到底保证什么？","answer":"当 acquire 读取观察到相应 release 写入的值，并满足标准规则时，可以建立同步，使 release 之前的相关写入对 acquire 之后的读取可见。relaxed 仅保证原子访问，不提供这种一般发布同步。","points":["简单独立计数可考虑 relaxed；发布数据要说明同步链。","初学优先默认顺序一致性或互斥锁，不为省几行代码设计未经证明的无锁协议。"],"trap":"看到 ready 为 true 不一定安全，必须核对它如何发布、如何读取和对象生命周期。","follow":["为什么标志原子化仍可能没有保护其他数据？","重复复用同一缓冲区还需要什么协议？"],"lab":"实现一次性发布不可变数据，并画出 release 到 acquire 的关系。","sources":[{"label":"C++ 标准草案 · atomics.order","url":"https://eel.is/c++draft/atomics.order"},{"label":"C++ 标准草案 · intro.races","url":"https://eel.is/c++draft/intro.races"}],"priority":"P1","code":"","origins":[{"collectionId":"core","no":"T09","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"T10","category":"thread","day":19,"title":"线程池应该怎样设计任务队列和退出协议？","answer":"线程池复用工作线程处理任务，常见结构是工作线程、任务队列和关闭状态。先明确任务的独立性、队列上限、拒绝或等待策略，再决定线程数。关闭时停止接收新任务，按约定处理或取消剩余任务，唤醒等待线程并由管理者回收。","points":["线程池应定义队列容量、拒绝策略、异常处理和关闭方式。","单个设备上下文是否可并发调用，以相应 SDK 契约为准。"],"trap":"不能仅凭“加了线程池”宣称吞吐量提升。","follow":["多个任务的输出顺序如何保证？","队列满时提交方应阻塞、超时还是拒绝？"],"lab":"写一个两个工作线程的有界线程池，分别测试空队列退出和任务未完成时关闭。","sources":[{"label":"C++ 标准草案 · thread.thread","url":"https://eel.is/c++draft/thread.thread"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"T10","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"N01","category":"net","day":15,"title":"TCP 与 UDP 在应用层的区别？","answer":"TCP 提供连接导向、可靠有序的字节流，不保留应用消息边界；UDP 提供数据报，保留每个报文边界，但不保证到达、顺序或不重复。应用要根据时延、丢失容忍和协议复杂度选择。","points":["TCP 的可靠传输不代表对端业务已成功处理。","UDP 并不是“必然更快”，应用自行可靠化也有开销。"],"trap":"不能把 UDP 报文边界与 TCP 接收调用次数等同。","follow":["控制命令为何常用 TCP？","实时数据使用 UDP 要补哪些机制？"],"lab":"分别写 TCP 与 UDP 回显，观察接收边界差异。","sources":[{"label":"Linux man-pages · tcp(7)","url":"https://man7.org/linux/man-pages/man7/tcp.7.html"},{"label":"Linux man-pages · udp(7)","url":"https://man7.org/linux/man-pages/man7/udp.7.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"N01","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"N02","category":"net","day":15,"title":"服务端 Socket 的基本调用流程？","answer":"TCP 服务端通常 socket、bind、listen、accept；客户端 socket、connect。监听描述符用于接受连接，accept 返回的新描述符才用于该连接的数据收发。每步都要处理失败并正确释放。","points":["一个监听 socket 可以接受多个连接，连接拥有独立状态。","端口、地址和字节序应显式转换，结构体初始化不能省略。"],"trap":"不要在监听描述符上当作普通已连接 socket 收发业务数据。","follow":["bind 失败常见原因是什么？","accept 返回后监听 socket 还在吗？"],"lab":"写单客户端回显，记录所有返回值并用 ss 查看连接。","sources":[{"label":"Linux man-pages · socket(2)","url":"https://man7.org/linux/man-pages/man2/socket.2.html"},{"label":"Linux man-pages · bind(2)","url":"https://man7.org/linux/man-pages/man2/bind.2.html"},{"label":"Linux man-pages · listen(2)","url":"https://man7.org/linux/man-pages/man2/listen.2.html"},{"label":"Linux man-pages · accept(2)","url":"https://man7.org/linux/man-pages/man2/accept.2.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"N02","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"N03","category":"net","day":16,"title":"TCP 三次握手与连接关闭为什么需要状态？","answer":"握手用于建立连接并同步双方序列号等状态。关闭是双向独立的：一方发送 FIN 表示该方向不再发送数据，另一方向仍可能传输。ACK 和 FIN 可以合并，不能认为抓包必然出现固定四个报文。","points":["讨论握手应结合序列号、确认和历史报文，而非只背“证明双方能收发”。","异常复位与正常关闭的语义不同。"],"trap":"close 调用返回不等于对端已经处理全部业务。","follow":["为什么会存在半关闭？","RST 与 FIN 在应用表现上有什么区别？"],"lab":"抓取本地连接建立和关闭过程，标注 SYN、ACK、FIN 与序列号。","sources":[{"label":"IETF · RFC 9293 §3.5 / §3.6","url":"https://www.rfc-editor.org/rfc/rfc9293.html#section-3.5"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"N03","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"N04","category":"net","day":16,"title":"TIME_WAIT 与 CLOSE_WAIT 怎样排查？","answer":"TIME_WAIT 通常出现在执行主动关闭相关流程的一端，用于处理连接残留报文和必要的重传；CLOSE_WAIT 表示本端已收到对端 FIN，而本地应用尚未完成自己的关闭。大量状态要结合连接速率和应用逻辑分析。","points":["CLOSE_WAIT 长期累积优先检查程序关闭路径与描述符泄漏。","不要为了消除 TIME_WAIT 就随意修改内核参数。"],"trap":"TIME_WAIT 不一定说明程序有 bug，CLOSE_WAIT 也不能只靠重启掩盖。","follow":["收到 read=0 后资源怎样回收？","为何短连接场景会积累 TIME_WAIT？"],"lab":"用 ss -tanp 观察短连接，并复现收到 EOF 后不 close 的行为。","sources":[{"label":"Linux man-pages · tcp(7)","url":"https://man7.org/linux/man-pages/man7/tcp.7.html"},{"label":"IETF · RFC 9293 状态机","url":"https://www.rfc-editor.org/rfc/rfc9293.html#section-3.3.2"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"N04","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"N05","category":"net","day":17,"title":"TCP 粘包、半包该怎样处理？","answer":"TCP 只提供字节流，一次发送和一次接收没有一一对应关系。应用协议需要定义消息边界，例如固定长度、分隔符或长度前缀；接收端维护缓冲区，累计够一条才解析，剩余数据留待下一次。","points":["长度字段要规定字节序、大小上限和是否包含头部。","同时处理不完整头部、多个消息和恶意超大长度。"],"trap":"不能靠 sleep 或假设 recv 次数解决消息边界。","follow":["长度前缀只到一半如何处理？","一条消息最大长度如何限制？"],"lab":"实现 4 字节长度前缀协议，测试一字节一发与多条合并发送。","sources":[{"label":"Linux man-pages · tcp(7)","url":"https://man7.org/linux/man-pages/man7/tcp.7.html"},{"label":"Linux man-pages · recv(2)","url":"https://man7.org/linux/man-pages/man2/recv.2.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"N05","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"N06","category":"net","day":19,"title":"recv 返回 0、EAGAIN、EINTR 如何处理？","answer":"对请求非零长度的 TCP 流读取，recv 返回 0 通常表示对端有序关闭发送方向；正数表示收到字节；-1 时检查 errno。EINTR 按接口语义重试，非阻塞 EAGAIN 表示当前无数据，应等待就绪。","points":["UDP 的零长度数据报与 TCP EOF 不同。","发送时还要处理部分发送、EPIPE 和可能的 SIGPIPE，可依接口使用 MSG_NOSIGNAL。"],"trap":"断开连接后继续忙循环重试会浪费 CPU。","follow":["为何要用 ssize_t 接收返回值？","发送成功是否代表业务确认？"],"lab":"主动半关闭连接，再测试非阻塞读取无数据与对端断开。","sources":[{"label":"Linux man-pages · recv(2)","url":"https://man7.org/linux/man-pages/man2/recv.2.html"},{"label":"Linux man-pages · send(2)","url":"https://man7.org/linux/man-pages/man2/send.2.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"N06","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"N07","category":"net","day":18,"title":"阻塞/非阻塞与同步/异步是同一维度吗？","answer":"阻塞/非阻塞描述调用在当前无法推进时是否等待；同步/异步常描述操作完成与通知模式。epoll 就绪通知之后，应用通常仍需自行执行 read/write，它不等于内核已经把所有数据异步读进应用缓冲区。","points":["非阻塞 I/O 遇到暂时不可用立即返回，可由事件循环决定何时重试。","讨论异步前先明确使用的是何种 API 与完成语义。"],"trap":"非阻塞 socket 加 epoll 不能直接等同于完成型异步 I/O。","follow":["就绪是否保证后续调用永不返回 EAGAIN？","为什么非阻塞模式仍需输出缓冲？"],"lab":"设置 O_NONBLOCK，记录立即返回，再接入就绪等待。","sources":[{"label":"Linux man-pages · epoll(7)","url":"https://man7.org/linux/man-pages/man7/epoll.7.html"},{"label":"Linux man-pages · fcntl(2)","url":"https://man7.org/linux/man-pages/man2/fcntl.2.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"N07","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"N08","category":"net","day":18,"title":"select、poll 与 epoll 怎么比较？","answer":"select 使用描述符集合，受 fd_set 表示范围限制；poll 使用 pollfd 数组；epoll 在内核中维护关注对象和就绪通知，适合持续管理多个 I/O 对象。性能取决于连接数量、活跃比例和使用方式。","points":["不能用“poll 是链表所以无限”解释接口。","epoll 支持范围和对象行为也有限制，例如普通文件不适合按网络事件方式处理。","LT 在仍满足就绪条件时可反复通知；ET 通常配合非阻塞描述符并处理到 EAGAIN、EOF 或错误。二者不是同步与异步 I/O 的区别。"],"trap":"不要只背“epoll O(1)”就认为所有工作量与连接数无关。","follow":["活跃连接很多时优势一定明显吗？","为什么 poll 仍然有使用场景？"],"lab":"对比一个小型 poll 回显与 epoll 回显的注册和事件处理方式。","sources":[{"label":"Linux man-pages · select(2)","url":"https://man7.org/linux/man-pages/man2/select.2.html"},{"label":"Linux man-pages · poll(2)","url":"https://man7.org/linux/man-pages/man2/poll.2.html"},{"label":"Linux man-pages · epoll(7)","url":"https://man7.org/linux/man-pages/man7/epoll.7.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"N08","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"21","section":"C/C++ 面经"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"N09","category":"net","day":18,"title":"epoll 的 LT 与 ET 核心区别？","answer":"LT 在对象仍就绪时可继续通知；ET 对就绪变化采用边沿触发方式，应用通常应配合非阻塞 I/O，持续处理直到 EAGAIN、EOF 或错误，不能收到一次事件只读一小块就等待下次。","points":["连接还需要输入缓冲、消息解析与输出缓冲。","有待发送数据且暂时发不完时关注可写，清空后取消不必要的可写关注。"],"trap":"ET 并不自动比 LT 快；默认 LT 更容易写对。","follow":["为什么一直订阅 EPOLLOUT 可能导致空转？","读取被其他路径抢先消费会怎样？"],"lab":"限制每次 read 缓冲大小，在 ET 下验证完整排空至 EAGAIN。","sources":[{"label":"Linux man-pages · epoll(7)","url":"https://man7.org/linux/man-pages/man7/epoll.7.html"},{"label":"Linux man-pages · epoll_ctl(2)","url":"https://man7.org/linux/man-pages/man2/epoll_ctl.2.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"N09","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"N10","category":"net","day":19,"title":"TCP 流量控制与拥塞控制有什么区别？","answer":"流量控制避免发送速度超过接收方接收能力；拥塞控制避免给网络造成过量负载。二者共同影响可发送的数据量。应用层还需要自身的任务队列和背压，TCP 不会替你限制所有业务缓存。","points":["协议窗口约束与应用处理速度相关，但不等于应用处理完成确认。","心跳与超时需要根据业务要求设计。"],"trap":"“TCP 保证不丢包所以应用队列可以无限大”是错误推论。","follow":["接收方很慢会怎样影响发送？","网络不断但业务卡死如何发现？"],"lab":"让服务端延迟读取，观察发送端等待或 EAGAIN，记录应用缓存大小。","sources":[{"label":"IETF · RFC 9293 窗口管理","url":"https://www.rfc-editor.org/rfc/rfc9293.html#section-3.8.6"},{"label":"IETF · RFC 5681 拥塞控制","url":"https://www.rfc-editor.org/rfc/rfc5681.html"}],"priority":"P1","code":"","origins":[{"collectionId":"core","no":"N10","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"D01","category":"debug","day":5,"title":"预处理、编译、汇编、链接各做什么？","answer":"预处理展开头文件与宏；编译将源代码转换为目标相关的中间或汇编表示；汇编产生目标文件；链接解析符号并组合目标文件与库，生成最终可执行文件或共享库。实际工具链可合并部分步骤。","points":["编译通过只证明单个翻译单元通过，不代表最终链接成功。","头文件通常描述接口，定义的放置需要遵守链接和单一定义规则。"],"trap":"undefined reference 是典型链接问题，不是重新 include 更多头文件就能解决。","follow":["目标文件里未定义符号一定错误吗？","静态库为什么和链接顺序有关？"],"lab":"用 g++ -E、-S、-c 分别查看产物，再手动链接两个目标文件。","sources":[{"label":"GCC · Overall Options","url":"https://gcc.gnu.org/onlinedocs/gcc/Overall-Options.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"D01","section":"原有核心题"},{"collectionId":"csdn-cpp","no":"14","section":"C/C++ 面经"}],"answerKind":"核心题整理","license":"CC BY-SA 4.0"},{"id":"D02","category":"debug","day":5,"title":"undefined reference 与 multiple definition 怎样排查？","answer":"未定义引用通常表示声明使用了符号，但链接时缺少匹配定义，可能是漏源文件、漏库、签名或语言链接不一致。重复定义则表示多个不允许重复的定义同时出现，常见于头文件放普通全局定义。","points":["检查真实链接命令，并用 nm/readelf 查看符号。","模板、inline 等存在特别规则，不能用所有定义都只能出现一次粗暴概括。"],"trap":"不应只靠不断增加库和绝对路径碰运气。","follow":["C/C++ 混合为何可能名字对不上？","声明与定义的 const 不一致会怎样？"],"lab":"故意漏链接一个源文件，再制造头文件全局变量重复定义并修复。","sources":[{"label":"GNU ld · Input files and libraries","url":"https://sourceware.org/binutils/docs/ld/Options.html"},{"label":"C++ 标准草案 · basic.def.odr","url":"https://eel.is/c++draft/basic.def.odr"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"D02","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"D03","category":"debug","day":5,"title":"CMake 中 target 思维有什么好处？","answer":"把每个可执行文件或库作为 target，分别声明源文件、头文件目录、链接库和编译要求。依赖关系清晰后，构建系统可以传播必要使用要求，避免到处使用全局参数和硬编码路径。","points":["PRIVATE 用于本目标内部，PUBLIC 同时影响本目标和使用者，INTERFACE 只描述使用者需求。","使用独立构建目录，保留可复现的配置参数。"],"trap":"CMake 负责生成构建系统，不等于编译器本身。","follow":["include_directories 全局堆积有什么问题？","如何单独构建核心库和测试程序？"],"lab":"创建 core 库与 app 可执行文件，用 target_link_libraries 连接。","sources":[{"label":"CMake · Tutorial","url":"https://cmake.org/cmake/help/latest/guide/tutorial/index.html"},{"label":"CMake · target_link_libraries","url":"https://cmake.org/cmake/help/latest/command/target_link_libraries.html"}],"priority":"P0","code":"cmake_minimum_required(VERSION 3.16)\nproject(video_app LANGUAGES CXX)\nadd_library(core src/core.cpp)\ntarget_include_directories(core PUBLIC include)\ntarget_compile_features(core PUBLIC cxx_std_17)\nadd_executable(app src/main.cpp)\ntarget_link_libraries(app PRIVATE core)","origins":[{"collectionId":"core","no":"D03","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"D04","category":"debug","day":20,"title":"GDB 如何定位崩溃与卡死？","answer":"崩溃先保留匹配的可执行文件、调试符号和 core，再查看调用栈、参数与局部变量。卡死要查看全部线程栈，区分等待锁、等待 I/O、循环计算和正常等待，不能只看主线程。","points":["常用 break、run、bt、frame、print、info threads、thread apply all bt。","优化可能让变量不可见，调试构建和线上构建应明确区分。"],"trap":"栈顶函数可能只是症状，不一定是最初写坏内存的位置。","follow":["如何查看所有线程等待哪把锁？","为何 core 与不同版本程序不能随意混用？"],"lab":"复现空队列退出卡死，保存所有线程栈并修正关闭唤醒。","sources":[{"label":"GDB · Threads","url":"https://sourceware.org/gdb/current/onlinedocs/gdb.html/Threads.html"},{"label":"GDB · Backtrace","url":"https://sourceware.org/gdb/current/onlinedocs/gdb.html/Backtrace.html"}],"priority":"P0","code":"gdb ./build/app core\n# 在 GDB 中：\nbt\ninfo threads\nthread apply all bt\nframe 0\ninfo locals","origins":[{"collectionId":"core","no":"D04","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"D05","category":"debug","day":2,"title":"ASan 与 TSan 分别发现什么？","answer":"AddressSanitizer 主要检查越界、释放后使用等内存错误；ThreadSanitizer 主要检查数据竞争。它们是动态工具，只能覆盖实际运行到的路径，不能证明整个程序没有问题。","points":["使用带调试信息的构建并保留报告。","通常分别建立 ASan 与 TSan 构建，不把两者随意混用。"],"trap":"工具未报错不是线程安全证明；设备驱动内部与未插桩库可能不在检查范围。","follow":["为何只测一次可能漏掉竞争？","如何让报告定位到源码行？"],"lab":"分别创建内存越界和计数竞争小实验，修复后重复运行。","sources":[{"label":"Clang · ASan","url":"https://clang.llvm.org/docs/AddressSanitizer.html"},{"label":"Clang · TSan","url":"https://clang.llvm.org/docs/ThreadSanitizer.html"}],"priority":"P0","code":"# 分别构建，勿同时开启两类 sanitizer。\ng++ -std=c++17 -g -O1 -fno-omit-frame-pointer \\\n  -fsanitize=address demo.cpp -o demo_asan\ng++ -std=c++17 -g -O1 -fsanitize=thread \\\n  race.cpp -pthread -o demo_tsan","origins":[{"collectionId":"core","no":"D05","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"D06","category":"debug","day":20,"title":"程序 CPU 高时如何排查？","answer":"先确认是哪个进程、哪个线程以及用户态还是内核态消耗，再采样调用栈和系统调用。常见假设包括忙等、过量日志、频繁小 I/O、无效事件循环和真实计算热点，必须用证据逐项验证。","points":["strace -c 适合观察系统调用分布，perf 可用于热点采样，权限与内核支持需确认。","对照输入规格和基线，每次只修改一个变量。"],"trap":"看到 CPU 高不能直接断言是线程太多或死循环。","follow":["EAGAIN 忙重试在统计中可能怎样表现？","为何空闲 socket 的 EPOLLOUT 会触发频繁？"],"lab":"给程序人为加入忙循环，记录线程与热点，再比较阻塞等待。","sources":[{"label":"Linux man-pages · strace(1)","url":"https://man7.org/linux/man-pages/man1/strace.1.html"},{"label":"Linux man-pages · perf(1)","url":"https://man7.org/linux/man-pages/man1/perf.1.html"}],"priority":"P1","code":"","origins":[{"collectionId":"core","no":"D06","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"D07","category":"debug","day":20,"title":"内存持续上涨与 fd 泄漏如何排查？","answer":"先区分资源泄漏、队列积压、缓存保留、内存映射和分配器未归还内存等原因。记录 RSS、队列深度、持有对象数、分配释放计数，以及 /proc/PID/fd 中描述符数量的变化。","points":["反复启动停止、失败路径和满队列测试往往比只跑正常路径更能暴露问题。","RSS 不下降不必然说明泄漏，需结合对象存活证据。"],"trap":"不能靠增大内存或队列容量掩盖失控增长。","follow":["删除日志后磁盘不释放怎样找持有者？","队列里的少量共享对象为何可能间接持有大块内存？"],"lab":"反复运行初始化和销毁，比较资源计数与 fd 列表，留下日志。","sources":[{"label":"Linux man-pages · proc_pid_fd(5)","url":"https://man7.org/linux/man-pages/man5/proc_pid_fd.5.html"},{"label":"Linux man-pages · proc_pid_status(5)","url":"https://man7.org/linux/man-pages/man5/proc_pid_status.5.html"},{"label":"Linux man-pages · malloc_trim(3)","url":"https://man7.org/linux/man-pages/man3/malloc_trim.3.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"D07","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"D08","category":"debug","day":25,"title":"吞吐、阶段耗时和端到端时延如何测？","answer":"先定义计时边界。吞吐量是单位墙钟时间完成的任务数；单任务时延是该任务从所声明的起点到终点的时间，可能包含排队、计算和 I/O。单个函数耗时不能冒充整个请求时延；流水线存在重叠时，阶段耗时之和也不等于相邻完成事件间隔。","points":["用单调时钟测时间差，明确预热与统计区间。","固定输入、构建选项和运行条件，同时报告均值与分位数，说明被丢弃的样本。"],"trap":"把异步提交返回时间当作设备完成耗时，通常会低估真实处理时间。","follow":["阶段耗时之和为什么不等于流水线吞吐的倒数？","队列增长会怎样影响时延？"],"lab":"记录任务提交、出队、完成时间；比较单线程与线程池的吞吐和延迟。","sources":[{"label":"C++ 标准草案 · time.clock.steady","url":"https://eel.is/c++draft/time.clock.steady"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"D08","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"E01","category":"embedded","day":22,"title":"交叉编译需要匹配哪些内容？","answer":"交叉编译是在一种主机环境为另一目标环境生成程序。除 CPU 架构外，还要匹配 ABI、目标 sysroot、C/C++ 运行库和依赖库；主机头文件或 x86 库混入 ARM 构建会造成错误。","points":["CMake toolchain 文件可指定目标系统、编译器与 sysroot。","先编译最小程序在目标环境验证，再加入第三方库依赖。"],"trap":"看到编译器名带 aarch64，不代表所有目标依赖都已自动匹配。","follow":["sysroot 解决什么问题？","为什么交叉编译时不能随意运行目标程序做检测？"],"lab":"用配套工具链编译最小多文件工程，在板端核对架构并执行。","sources":[{"label":"CMake · toolchains","url":"https://cmake.org/cmake/help/latest/manual/cmake-toolchains.7.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"E01","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"E02","category":"embedded","day":22,"title":"ABI 和 API 的区别？","answer":"API 描述源代码层面的调用接口；ABI 描述二进制层面的约定，包括调用规则、数据布局、符号、寄存器与栈等。源代码接口看似相同的库，也可能因 ABI 不兼容无法正确链接或运行。","points":["AArch64 参数可通过寄存器传递，不应照搬特定 x86 的统一压栈说法。","跨 C++ 库边界要留意编译器、标准库和 ABI 配置。"],"trap":"同为 64 位并不代表二进制兼容。","follow":["相同函数声明为什么还可能崩溃？","C 接口为何常用于稳定模块边界？"],"lab":"对比主机与目标的 file/readelf 输出，记录编译器和 C++ 运行库。","sources":[{"label":"Arm · AAPCS64","url":"https://github.com/ARM-software/abi-aa/blob/main/aapcs64/aapcs64.rst"}],"priority":"P1","code":"","origins":[{"collectionId":"core","no":"E02","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"E03","category":"embedded","day":22,"title":"上板后找不到动态库怎么排查？","answer":"先确认程序和库的架构、依赖名称与目标环境一致，再检查动态链接器搜索路径、RUNPATH/RPATH、系统缓存及实际部署位置。构建时能找到库，不代表运行时也能找到。","points":["readelf -d 可查看依赖与路径信息，file 可辅助核对架构。","不要对不可信可执行文件随意使用可能执行它的依赖检查方式。"],"trap":"把开发机整个 /usr/lib 复制上板通常不是可靠方案。","follow":["LD_LIBRARY_PATH 为什么不宜成为永久的混乱补丁？","如何把依赖和版本记录进部署包？"],"lab":"在干净目录部署程序与所需库，验证启动并保留依赖清单。","sources":[{"label":"Linux man-pages · ld.so(8)","url":"https://man7.org/linux/man-pages/man8/ld.so.8.html"},{"label":"Linux man-pages · ldd(1)","url":"https://man7.org/linux/man-pages/man1/ldd.1.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"E03","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"E04","category":"embedded","day":23,"title":"设备文件与 ioctl 在应用层做什么？","answer":"设备文件为应用提供访问相应驱动接口的入口。应用可能使用 open/read/write/mmap/ioctl 等操作；ioctl 用于设备特定控制，请求号、结构体、方向和生命周期须遵守驱动的用户态 ABI。","points":["应用开发重点是正确使用公开接口，不等于必须修改驱动。","检查权限、节点存在性和驱动版本，再检查参数。"],"trap":"不能拿别的设备或版本的 ioctl 结构体硬套。","follow":["ENOTTY 常提示哪类问题？","为什么结构体大小变化会破坏接口？"],"lab":"选一项 SDK 示例，记录设备节点、权限、请求接口与错误码。","sources":[{"label":"Linux man-pages · ioctl(2)","url":"https://man7.org/linux/man-pages/man2/ioctl.2.html"},{"label":"Linux Kernel · ioctl","url":"https://docs.kernel.org/driver-api/ioctl.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"E04","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"E05","category":"embedded","day":23,"title":"串口应用要配置和处理哪些内容？","answer":"串口通常需要配置波特率、数据位、停止位、校验、流控及终端模式，再按协议处理部分读写与超时。termios 的 VMIN/VTIME 等设置影响非规范模式读取行为。","points":["原始模式与行缓冲终端模式的语义不同。","协议分帧、校验和错误恢复不能由串口配置替代。"],"trap":"一次 read 不保证就是一整帧设备消息。","follow":["VMIN/VTIME 配置怎样影响等待？","如何处理拔出设备或通信超时？"],"lab":"先用伪终端或回环测试简单协议，记录超时和不完整消息。","sources":[{"label":"Linux man-pages · termios(3)","url":"https://man7.org/linux/man-pages/man3/termios.3.html"}],"priority":"P1","code":"","origins":[{"collectionId":"core","no":"E05","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"E06","category":"embedded","day":15,"title":"大小端、对齐和序列化为什么要分开？","answer":"大小端描述多字节数值的字节排列顺序，对齐描述对象地址与布局约束，序列化定义跨边界交换数据的具体格式。网络或设备协议应明确字段长度和字节序，而不是直接发送本机结构体。","points":["常用 htons/htonl 等转换协议要求的网络字节序。","输入字节流解析还要检查长度、整数溢出和取值范围。"],"trap":"结构体 packed 不能自动解决字节序、版本和数据校验问题。","follow":["如何安全解析 4 字节长度头？","为什么不能直接把任意 char* 转成结构体指针？"],"lab":"手工编码一条消息，再用独立解析程序复原并测试截断数据。","sources":[{"label":"Linux man-pages · byteorder(3)","url":"https://man7.org/linux/man-pages/man3/byteorder.3.html"},{"label":"C++ 标准草案 · basic.align","url":"https://eel.is/c++draft/basic.align"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"E06","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"E07","category":"embedded","day":1,"title":"开发板 SDK 版本为什么要记录而非盲目升级？","answer":"板端应用依赖系统镜像、内核驱动、用户态库和模型等组合。排障应先建立已验证基线，再逐项替换并回归；同时更新多个组件会让兼容性问题难以定位。","points":["记录目标架构、内核、libc、工具链、动态库及依赖源码版本。","文档上的最新版本不等于当前目标环境最适合的版本。"],"trap":"示例能运行只证明对应组合通过了一次测试，不代表随意混库仍然安全。","follow":["换模型后结果错该查哪些配套文件？","如何让别人复现你的板端程序？"],"lab":"生成环境记录并跑通官方独立示例，保留完整命令与日志。","sources":[{"label":"Linux man-pages · ld.so","url":"https://man7.org/linux/man-pages/man8/ld.so.8.html"},{"label":"CMake · Cross Compiling","url":"https://cmake.org/cmake/help/latest/manual/cmake-toolchains.7.html"}],"priority":"P0","code":"","origins":[{"collectionId":"core","no":"E07","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"E08","category":"embedded","day":23,"title":"应用服务如何可靠启动和退出？","answer":"把工作目录、参数、依赖与日志去向显式配置；退出时停止接收新任务，通知队列，等待工作线程，最后释放依赖资源。使用服务管理器时还要考虑权限、超时与失败重启策略。","points":["重启策略不能掩盖持续崩溃，应保留退出码和错误上下文。","需要 systemd 的部署先确认目标镜像实际使用它。"],"trap":"在工作线程仍访问上下文时先销毁 SDK，是典型退出时崩溃原因。","follow":["程序被 SIGTERM 打断时如何处理剩余任务？","为何不能无限等线程退出？"],"lab":"写启动脚本或适用的服务单元，重复启动停止并验证资源释放。","sources":[{"label":"systemd · service","url":"https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html"},{"label":"Linux man-pages · signal(7)","url":"https://man7.org/linux/man-pages/man7/signal.7.html"}],"priority":"P1","code":"","origins":[{"collectionId":"core","no":"E08","section":"原有核心题"}],"answerKind":"核心题整理"},{"id":"X01","category":"cpp","day":7,"priority":"P0","title":"封装、继承、多态如何改善接口设计？","answer":"封装把数据和维持其约束的操作放在一个接口后面；继承表达合适的类型关系并可复用实现；动态多态允许通过基类接口调用不同派生实现。它们是设计手段，不是越多越好；只为复用代码时也应考虑组合。","trap":"final 可修饰类或虚成员函数，不用于禁止普通数据成员被修改。派生类不能随意访问基类私有成员；静态成员也并非“不参与继承查找”。","lab":"给不同结果输出方式定义一个小接口，再比较继承与组合的代码复杂度。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · class.derived","url":"https://eel.is/c++draft/class.derived"},{"label":"C++ 标准草案 · class.virtual","url":"https://eel.is/c++draft/class.virtual"},{"label":"C++ 标准草案 · class.access","url":"https://eel.is/c++draft/class.access"}],"origins":[{"collectionId":"csdn-cpp","no":"1","section":"C/C++ 面经"},{"collectionId":"csdn-cpp","no":"27","section":"C/C++ 面经"},{"collectionId":"csdn-cpp","no":"74","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K10","section":"类和对象 / 封装的意义"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X02","category":"cpp","day":7,"priority":"P1","title":"静态多态和动态多态各在什么时候确定行为？","answer":"重载选择和模板实例化提供常见的编译期多态；虚函数调用提供动态多态，最终调用取决于对象的动态类型。编译器在能证明目标时可以去虚拟化，但优化不改变语言语义。","trap":"名称隐藏不是需要刻意追求的一种“多态实现机制”；限定名称调用可能抑制虚调用。","lab":"写同名重载与基类引用调用的对照程序，观察编译期与运行期的区别。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · class.virtual","url":"https://eel.is/c++draft/class.virtual"},{"label":"C++ 标准草案 · over.match","url":"https://eel.is/c++draft/over.match"},{"label":"C++ 标准草案 · temp","url":"https://eel.is/c++draft/temp"}],"origins":[{"collectionId":"csdn-cpp","no":"2","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K32","section":"多态 / 静态与动态分派"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X03","category":"cpp","day":7,"priority":"P0","title":"final 和 override 分别防止什么错误？","answer":"override 要求成员函数确实重写了基类虚函数，否则编译报错。final 放在类定义上阻止派生，放在虚函数声明上阻止进一步重写。它们是编译期约束。","trap":"阻止重写不是阻止所有同名重载；普通变量不能用 final 当作 const。","lab":"给一个重写函数故意改错参数类型，再加入 override 检查。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · class.virtual","url":"https://eel.is/c++draft/class.virtual"},{"label":"C++ 标准草案 · class.pre","url":"https://eel.is/c++draft/class.pre"}],"origins":[{"collectionId":"csdn-cpp","no":"3","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X04","category":"cpp","day":7,"priority":"P0","title":"虚表、虚表指针和虚函数代码分别是什么？","answer":"常见 ABI 通过对象中的虚表指针定位虚函数表，再找到函数地址完成动态分派。函数机器码通常位于可执行代码区域，表通常处于适合只读或重定位的区域。虚表由工具链生成，对象在构造和析构期间会经历相应的动态类型语义。","trap":"C++ 标准不规定必须存在一张虚表、固定内存段或固定数量的虚表指针；多继承可能有多个表或调整桩。","lab":"用编译器输出和调试器观察简单多态类；把观察结果标注为所用 ABI 的实现。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · class.virtual","url":"https://eel.is/c++draft/class.virtual"},{"label":"官方文档 / 规范参考","url":"https://itanium-cxx-abi.github.io/cxx-abi/abi.html"}],"origins":[{"collectionId":"csdn-cpp","no":"4","section":"C/C++ 面经"},{"collectionId":"csdn-cpp","no":"54","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K30","section":"继承 / 对象布局与虚表实现"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X05","category":"cpp","day":7,"priority":"P0","title":"智能指针的本质是什么？如何选所有权模型？","answer":"智能指针是借助对象生命周期管理资源的类模板。unique_ptr 表达独占所有权，销毁时通过删除器释放；shared_ptr 通过共享控制信息共同管理对象；weak_ptr 观察共享对象而不延长其对象生命周期。","trap":"不是任何原始指针都应该包装成 shared_ptr；借用一个对象通常不需要制造新的拥有者。","lab":"为 C 库资源提供自定义删除器，验证失败返回时资源也会释放。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · unique.ptr","url":"https://eel.is/c++draft/unique.ptr"},{"label":"C++ 标准草案 · util.smartptr.shared","url":"https://eel.is/c++draft/util.smartptr.shared"},{"label":"C++ 标准草案 · util.smartptr.weak","url":"https://eel.is/c++draft/util.smartptr.weak"}],"origins":[{"collectionId":"csdn-cpp","no":"5","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X06","category":"cpp","day":7,"priority":"P0","title":"Lambda 是什么对象？生命周期由什么决定？","answer":"Lambda 表达式产生闭包对象，闭包类型有相应调用运算符；捕获决定它保存哪些状态。闭包可能是局部变量、容器元素或动态对象的一部分，生命周期取决于如何保存和使用它。","trap":"它不一定“调用时创建、调用完销毁”，也不保证比普通函数更节省空间。引用捕获不会延长被引用对象的生命周期。","lab":"返回一个值捕获的闭包，再说明返回引用捕获局部变量为什么危险。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · expr.prim.lambda","url":"https://eel.is/c++draft/expr.prim.lambda"}],"origins":[{"collectionId":"csdn-cpp","no":"6","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X07","category":"cpp","day":7,"priority":"P0","title":"右值引用为什么能支持移动语义？","answer":"T&& 可以绑定到相应右值，使接口能够区分可转移资源的对象。移动构造等操作可以接管资源，避免不必要的深拷贝；实际是否转移由被调用函数实现决定。模板推导中的 T&& 还可能是转发引用。","trap":"有名字的右值引用变量作为表达式是左值；不是所有 T&& 都是转发引用，也不是所有移动都必然便宜。","lab":"写一个记录拷贝和移动的类，比较传入变量与 std::move(变量)。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · dcl.ref","url":"https://eel.is/c++draft/dcl.ref"},{"label":"C++ 标准草案 · class.copy.ctor","url":"https://eel.is/c++draft/class.copy.ctor"},{"label":"C++ 标准草案 · temp.deduct.call","url":"https://eel.is/c++draft/temp.deduct.call"}],"origins":[{"collectionId":"csdn-cpp","no":"7","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X08","category":"cpp","day":7,"priority":"P0","title":"引用和指针在初始化、重绑定和存储上有什么区别？","answer":"引用必须在规则要求的场合绑定到对象或函数，之后不能改绑；指针对象可以保存不同地址或空指针值。引用用于别名语义，指针常用于可空、可变目标或低层接口。二者都可能因目标生命周期结束而悬空。","trap":"引用是否占用额外存储是实现细节；sizeof(引用表达式)得到被引用类型大小，不能据此证明引用永远没有存储。","lab":"分别修改指针目标和经引用赋值，说明改变的是哪个对象。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · dcl.ref","url":"https://eel.is/c++draft/dcl.ref"},{"label":"C++ 标准草案 · basic.compound","url":"https://eel.is/c++draft/basic.compound"}],"origins":[{"collectionId":"csdn-cpp","no":"8","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-basics","no":"B20","section":"函数 / 参数传递"},{"collectionId":"csdn-cpp-core","no":"K04","section":"引用 / 基本规则与参数"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X09","category":"c","day":1,"priority":"P0","title":"指针表示什么？为什么不能把它当成任意整数？","answer":"指针是具有指针类型的值，可指向对象、函数、对象末尾或为空等。类型决定间接访问和指针运算的规则；对数组元素的指针运算有边界要求，不能任意跨对象相减或解引用。","trap":"保存一个地址值不代表该地址仍有效；不要解引用数组末尾指针或空指针。","lab":"用数组指针遍历元素，分别标出有效元素、one-past 和非法位置。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · basic.compound","url":"https://eel.is/c++draft/basic.compound"},{"label":"C++ 标准草案 · expr.add","url":"https://eel.is/c++draft/expr.add"}],"origins":[{"collectionId":"csdn-cpp","no":"9","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-basics","no":"B21","section":"指针 / 概念"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X10","category":"cpp","day":7,"priority":"P0","title":"weak_ptr 不增加什么计数？控制块何时释放？","answer":"weak_ptr 不增加共享对象的强所有者数量，所以不阻止强计数归零后销毁对象。常见实现还维护弱引用信息，使控制块可在对象销毁之后继续存在。lock() 尝试原子地取得 shared_ptr，失败时返回空指针。","trap":"对象、shared_ptr 句柄和控制块是不同东西；不要把控制块说成一定“存放在 shared_ptr 对象内部”。","lab":"保留 weak_ptr 并释放所有 shared_ptr，观察析构与 expired()/lock() 的变化。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · util.smartptr.weak","url":"https://eel.is/c++draft/util.smartptr.weak"},{"label":"C++ 标准草案 · util.smartptr.shared","url":"https://eel.is/c++draft/util.smartptr.shared"}],"origins":[{"collectionId":"csdn-cpp","no":"10","section":"C/C++ 面经"},{"collectionId":"csdn-cpp","no":"53","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X11","category":"c","day":2,"priority":"P1","title":"malloc 如何向系统要内存，为什么混合使用不同策略？","answer":"malloc 是分配器接口，会复用内部空闲块，必要时通过系统机制获得更多内存。glibc 常用堆区域和匿名映射等路径，选择受大小、历史、配置和实现影响。复用能摊薄系统调用成本，独立映射又有利于部分大块资源的归还。","trap":"128 KB 不是 C/C++ 的固定规则；free 也不保证进程 RSS 立刻下降。不能断言每次 malloc 都触发系统调用。","lab":"用 strace 观察不同规模申请释放中的 brk/mmap/munmap，并记录 libc 版本。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · malloc(3)","url":"https://man7.org/linux/man-pages/man3/malloc.3.html"},{"label":"Linux man-pages · mallopt(3)","url":"https://man7.org/linux/man-pages/man3/mallopt.3.html"}],"origins":[{"collectionId":"csdn-cpp","no":"11","section":"C/C++ 面经"},{"collectionId":"csdn-cpp","no":"11.1","section":"C/C++ 面经"},{"collectionId":"csdn-cpp","no":"11.2","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X12","category":"c","day":2,"priority":"P1","title":"free 只拿到一个指针，如何知道分配块信息？","answer":"分配器在块头、页级结构或其他管理区域记录大小、状态等元数据，free 根据有效分配指针找到这些信息。具体布局和粒度由分配器实现决定。调用者只需要按接口成对释放，不应自行猜测头部位置。","trap":"“向前偏移固定 16 字节”不是通用规则；free 中间地址、栈地址或已释放地址都不合法。","lab":"对比两个分配器的文档，列出哪些属于 API 保证、哪些只是内部实现。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · malloc(3)","url":"https://man7.org/linux/man-pages/man3/malloc.3.html"}],"origins":[{"collectionId":"csdn-cpp","no":"12","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X13","category":"c","day":1,"priority":"P0","title":"宏、const 与 constexpr 应该如何选择？","answer":"宏由预处理器做文本替换，不参与普通类型和作用域规则；const 表达不可通过该接口修改的类型约束；C++ constexpr 支持满足要求的常量求值。优先使用有类型的常量和函数，宏保留给条件编译等适合的场景。","trap":"const 不总是编译期常量，也不总在静态存储区；宏参数可能被重复求值。","lab":"对比宏 SQUARE(i++) 与内联函数调用，避免实际执行未定义行为的示例。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · cpp.replace","url":"https://eel.is/c++draft/cpp.replace"},{"label":"C++ 标准草案 · dcl.type.cv","url":"https://eel.is/c++draft/dcl.type.cv"},{"label":"C++ 标准草案 · dcl.constexpr","url":"https://eel.is/c++draft/dcl.constexpr"}],"origins":[{"collectionId":"csdn-cpp","no":"13","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-basics","no":"B03","section":"Hello C++ / 常量"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X15","category":"thread","day":9,"priority":"P0","title":"互斥锁为何既涉及原子指令，又可能让线程睡眠？","answer":"常见互斥锁用原子操作竞争锁状态；无竞争时可在用户态快速完成，有竞争时可能通过 futex 等机制等待和唤醒。自旋、阻塞、重试与公平性是实现及策略选择，不同锁不能都简化为一种 CAS 循环。","trap":"CAS 是原子读改写原语，不自动解决业务协议、死锁和等待者唤醒问题。","lab":"让两个线程竞争同一把锁，用 strace 观察有无 futex 等待。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · futex(7)","url":"https://man7.org/linux/man-pages/man7/futex.7.html"},{"label":"C++ 标准草案 · atomics.types.operations","url":"https://eel.is/c++draft/atomics.types.operations"}],"origins":[{"collectionId":"csdn-cpp","no":"15","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X17","category":"cpp","day":7,"priority":"P0","title":"C++ 中 class 和 struct 有哪些默认行为差异？","answer":"作为类定义关键字时，class 的成员和基类访问默认是 private，struct 默认是 public。二者都能具有构造、析构、成员函数和虚函数。class 还可以出现在类型模板形参语法中，这与定义类的默认权限是不同问题。","trap":"不要把 struct 说成只能装数据，也不要据此承诺 C++ struct 与任意 C 结构体 ABI 自动兼容。","lab":"只改 class/struct 关键字，观察省略访问说明符时的编译结果。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · class.access","url":"https://eel.is/c++draft/class.access"},{"label":"C++ 标准草案 · class.derived","url":"https://eel.is/c++draft/class.derived"}],"origins":[{"collectionId":"csdn-cpp","no":"17","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K11","section":"类和对象 / struct 与 class"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X20","category":"thread","day":10,"priority":"P0","title":"同进程线程如何交换数据和通知事件？","answer":"线程可通过同一地址空间中的共享对象传递数据，但必须用互斥锁、原子操作等建立合适的同步。条件变量通知“条件可能变化”，信号量维护许可计数；队列把数据所有权和同步协议组织到一起。","trap":"条件变量不是消息缓冲区，通知本身不会永久保存；共享同一地址不代表并发读写安全。","lab":"让两个线程通过有界队列交接对象，说明数据和通知分别存在哪里。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · thread.condition","url":"https://eel.is/c++draft/thread.condition"},{"label":"C++ 标准草案 · thread.mutex.requirements","url":"https://eel.is/c++draft/thread.mutex.requirements"}],"origins":[{"collectionId":"csdn-cpp","no":"20","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X24","category":"cpp","day":3,"priority":"P0","title":"C++ 对象生命周期和存储期有什么区别？","answer":"存储期描述对象所占存储何时存在；生命周期描述何时可以把那块存储当作有效对象使用。一般在适当存储取得且初始化完成后开始生命周期，在析构开始或存储被释放/复用等条件下结束。构造析构阶段还有专门规则。","trap":"C++ 没有通用的“类加载、连接、初始化、卸载”运行阶段；不要把其他语言的类生命周期套过来。","lab":"在构造、析构和作用域退出处打印日志，区分存储申请与对象初始化。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · basic.life","url":"https://eel.is/c++draft/basic.life"},{"label":"C++ 标准草案 · basic.stc","url":"https://eel.is/c++draft/basic.stc"},{"label":"C++ 标准草案 · class.cdtor","url":"https://eel.is/c++draft/class.cdtor"}],"origins":[{"collectionId":"csdn-cpp","no":"24","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X28","category":"cpp","day":4,"priority":"P1","title":"左值、右值与 ++i / i++ 的值类别怎么回答？","answer":"C++ 常把表达式分为 glvalue、prvalue、xvalue 等类别。对内建整数运算，前置 ++i 返回更新后对象的左值，后置 i++ 产生递增前值的纯右值；若旧值不用，前置写法通常更直接。用户定义运算符需看返回类型。","trap":"不能断言所有情况下 ++i 一定更快；编译器可能把两者优化成相同代码。","lab":"用 decltype((++i)) 和 decltype(i++) 观察内建运算的类型。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · basic.lval","url":"https://eel.is/c++draft/basic.lval"},{"label":"C++ 标准草案 · expr.pre.incr","url":"https://eel.is/c++draft/expr.pre.incr"},{"label":"C++ 标准草案 · expr.post.incr","url":"https://eel.is/c++draft/expr.post.incr"}],"origins":[{"collectionId":"csdn-cpp","no":"28","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-basics","no":"B12","section":"运算符 / 前置与后置递增"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X29","category":"cpp","day":4,"priority":"P0","title":"vector 和 list 的复杂度之外还要比较什么？","answer":"vector 元素连续，随机访问常数时间，尾部插入摊还常数，但扩容会搬迁元素。list 为双向链表，持有插入位置迭代器时插入删除可为常数，却不支持常数时间索引。实际选型还要看缓存局部性、分配次数和节点开销。","trap":"链表插入 O(1) 不包含先寻找位置的成本；“不移动节点”不等于实际一定更快。","lab":"对整数遍历和已知位置插入分别测试，不用同一种负载概括全部场景。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · vector","url":"https://eel.is/c++draft/vector"},{"label":"C++ 标准草案 · list","url":"https://eel.is/c++draft/list"}],"origins":[{"collectionId":"csdn-cpp","no":"29","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X30","category":"cpp","day":3,"priority":"P1","title":"静态对象和函数局部 static 什么时候初始化？","answer":"静态存储期对象先经历静态初始化，必要时再动态初始化；细节与是否常量初始化、翻译单元等有关。函数内需动态初始化的局部 static 在控制首次经过定义时初始化，C++11 起并发首次初始化有语言保证。","trap":"首次初始化线程安全不代表之后修改这个对象也自动线程安全；不同翻译单元的动态初始化不要依赖脆弱的顺序假设。","lab":"多线程首次调用同一函数，观察局部 static 构造次数，再单独保护后续修改。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · basic.start.static","url":"https://eel.is/c++draft/basic.start.static"},{"label":"C++ 标准草案 · basic.start.dynamic","url":"https://eel.is/c++draft/basic.start.dynamic"},{"label":"C++ 标准草案 · stmt.dcl","url":"https://eel.is/c++draft/stmt.dcl"}],"origins":[{"collectionId":"csdn-cpp","no":"30","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K18","section":"对象初始化 / 静态成员与静态对象"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X32","category":"cpp","day":7,"priority":"P0","title":"空指针调用非静态成员函数为什么不能依赖？","answer":"通过空指针调用普通非静态成员函数不满足有效对象的要求，属于未定义行为。没有读成员变量时，某个编译结果可能恰好不崩溃，但编译器没有义务保留这种表象。静态成员函数不依赖 this，应使用类名调用。","trap":"“能运行”与“语言允许”不同；不崩溃不能证明对象存在。","lab":"用编译警告和 UBSan 检查无效成员访问示例，但不要把检测不到当作合法。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · class.mfct.non.static","url":"https://eel.is/c++draft/class.mfct.non.static"},{"label":"C++ 标准草案 · expr.ref","url":"https://eel.is/c++draft/expr.ref"}],"origins":[{"collectionId":"csdn-cpp","no":"32","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K22","section":"对象模型 / 空指针调用成员函数"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X33","category":"cpp","day":9,"priority":"P0","title":"shared_ptr 的线程安全边界在哪里？","answer":"多个独立 shared_ptr 对象共享同一个控制块时，其所有权计数操作可以安全并发；但并发修改同一个 shared_ptr 句柄需要相应同步，所管理对象的成员读写也不会自动受保护。C++17 可查 shared_ptr 的原子访问自由函数，C++20 有 atomic\u003cshared_ptr\u003cT>>。","trap":"引用计数线程安全，不等于指针对象和被指对象都可随意并发访问。","lab":"分别构造“不同句柄共享对象”与“同一句柄同时 reset”的例子，指出锁该保护谁。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · util.smartptr.shared","url":"https://eel.is/c++draft/util.smartptr.shared"},{"label":"C++ 标准草案 · util.smartptr.shared.atomic","url":"https://eel.is/c++draft/util.smartptr.shared.atomic"}],"origins":[{"collectionId":"csdn-cpp","no":"33","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X34","category":"cpp","day":4,"priority":"P1","title":"vector::push_back 接收左值和右值时有什么差别？","answer":"常用重载分别接收 const T& 与 T&&。左值通常走拷贝插入，右值可走移动插入；真正移动仍由 T 的构造函数决定。扩容时还要迁移旧元素，具体拷贝或移动选择受异常安全约束影响。","trap":"对 const 对象调用 std::move 通常不能调用接受非 const T&& 的移动构造；扩容成本不能只看新增元素。","lab":"打印元素构造、拷贝和移动日志，对比 reserve 前后追加行为。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · vector.modifiers","url":"https://eel.is/c++draft/vector.modifiers"},{"label":"C++ 标准草案 · vector.capacity","url":"https://eel.is/c++draft/vector.capacity"}],"origins":[{"collectionId":"csdn-cpp","no":"34","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X36","category":"cpp","day":4,"priority":"P1","title":"完美转发为何使用 std::forward，而不总用 std::move？","answer":"转发引用 T&& 在模板参数推导时记录实参的值类别；引用折叠形成最终类型。std::forward\u003cT> 按推导出的类型条件转换，使下一层重载尽量看到原来的左值或右值。std::move 则无条件产生可用于移动的表达式。","trap":"有名字的形参本身是左值；const T&& 和非推导上下文的 T&& 通常不是转发引用。","lab":"写一个包装函数转发给 f(T&) 和 f(T&&)，分别用左值和临时对象调用。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · forward","url":"https://eel.is/c++draft/forward"},{"label":"C++ 标准草案 · temp.deduct.call","url":"https://eel.is/c++draft/temp.deduct.call"},{"label":"C++ 标准草案 · dcl.ref","url":"https://eel.is/c++draft/dcl.ref"}],"origins":[{"collectionId":"csdn-cpp","no":"36","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X37","category":"cpp","day":3,"priority":"P1","title":"空类会自动得到哪些特殊成员？","answer":"特殊成员包括默认构造、析构、拷贝构造、拷贝赋值、移动构造和移动赋值。是否隐式声明、是否定义为删除以及何时生成，都由类中已声明成员及基类/成员类型决定。默认构造也可能因已有构造函数而不再自动声明。","trap":"不能说任何类都无条件拥有六个可用函数；用户声明析构函数会影响隐式移动操作的生成。","lab":"给类逐步添加析构、unique_ptr 成员和 =delete，观察可拷贝/可移动特征。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · special","url":"https://eel.is/c++draft/special"},{"label":"C++ 标准草案 · class.copy.ctor","url":"https://eel.is/c++draft/class.copy.ctor"},{"label":"C++ 标准草案 · class.copy.assign","url":"https://eel.is/c++draft/class.copy.assign"}],"origins":[{"collectionId":"csdn-cpp","no":"37","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K13","section":"对象初始化 / 特殊成员的生成"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X38","category":"cpp","day":3,"priority":"P0","title":"explicit 解决什么隐式转换问题？","answer":"explicit 常用于构造函数和转换函数，限制不期望的隐式转换及相应复制初始化。显式构造仍可调用它；explicit operator bool 也可用于 if 等语境转换。应由接口意图决定哪些转换可以自动发生。","trap":"不是只给单参数构造函数加的装饰；带默认实参的构造同样可能形成隐式转换入口。","lab":"比较 Widget w(3)、Widget w{3} 与 Widget w=3 在 explicit 前后的编译结果。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · dcl.fct.spec","url":"https://eel.is/c++draft/dcl.fct.spec"},{"label":"C++ 标准草案 · class.conv.ctor","url":"https://eel.is/c++draft/class.conv.ctor"},{"label":"C++ 标准草案 · class.conv.fct","url":"https://eel.is/c++draft/class.conv.fct"}],"origins":[{"collectionId":"csdn-cpp","no":"38","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X39","category":"cpp","day":3,"priority":"P0","title":"成员初始化列表的书写顺序决定初始化顺序吗？","answer":"不决定。最派生对象先初始化虚基类，再按声明顺序初始化直接基类，然后按类内声明顺序初始化非静态数据成员，最后执行构造函数体。析构按对应的逆向顺序清理。","trap":"用后声明成员初始化先声明成员，可能读到尚未初始化的数据；列表换行排序不会改变语言规则。","lab":"故意把初始化列表顺序写反，开启 -Wreorder 并用日志验证。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · class.base.init","url":"https://eel.is/c++draft/class.base.init"},{"label":"C++ 标准草案 · class.dtor","url":"https://eel.is/c++draft/class.dtor"}],"origins":[{"collectionId":"csdn-cpp","no":"39","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K16","section":"对象初始化 / 初始化列表"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X40","category":"embedded","day":22,"priority":"P1","title":"指针一定是 4 字节或 8 字节吗？","answer":"指针大小取决于目标平台、ABI 和指针种类。常见 64 位 Linux 上普通对象指针通常为 8 字节，但这不是所有语言实现的统一值；成员指针还可能使用不同表示。用 sizeof 获取当前类型的实际大小。","trap":"指针大小不等于所指对象大小，也不能拿一次运行结果推导所有架构。","lab":"在主机与板端分别输出 sizeof(void*)、sizeof(int*) 与成员函数指针大小。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · expr.sizeof","url":"https://eel.is/c++draft/expr.sizeof"},{"label":"C++ 标准草案 · basic.compound","url":"https://eel.is/c++draft/basic.compound"}],"origins":[{"collectionId":"csdn-cpp","no":"40","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-basics","no":"B22","section":"指针 / 空间大小"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X44","category":"cpp","day":4,"priority":"P1","title":"STL 常见组件如何配合？","answer":"传统 STL 思路用容器存放数据、迭代器描述遍历、算法操作范围，并用函数对象、适配器和分配器扩展行为。算法对迭代器能力有要求，例如排序通常要求随机访问范围。现代 C++ 标准库还包含远超传统 STL 的功能。","trap":"STL 不等于整个 C++ 标准库；不能给不满足迭代器要求的容器随意套算法。","lab":"用 vector、find_if 和 Lambda 组合一次筛选，再解释 list.sort 的意义。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · algorithms","url":"https://eel.is/c++draft/algorithms"},{"label":"C++ 标准草案 · iterators","url":"https://eel.is/c++draft/iterators"},{"label":"C++ 标准草案 · containers","url":"https://eel.is/c++draft/containers"}],"origins":[{"collectionId":"csdn-cpp","no":"44","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X45","category":"cpp","day":4,"priority":"P1","title":"迭代器与裸指针有什么共同点和差别？","answer":"二者都能用来定位和遍历元素，裸指针可以满足一些迭代器要求。迭代器也可由类实现，为链表、流等提供统一接口；支持什么运算取决于类别，不是所有迭代器都支持加减或下标。","trap":"迭代器不保证是裸地址，不同容器的迭代器一般不能互相比较或组合成合法区间。","lab":"分别用 vector、list 和输入流迭代器遍历，列出各自允许的操作。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · iterator.requirements","url":"https://eel.is/c++draft/iterator.requirements"}],"origins":[{"collectionId":"csdn-cpp","no":"45","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X46","category":"thread","day":9,"priority":"P1","title":"线程状态和锁类型为什么不能混为一谈？","answer":"Linux 调度状态可反映可运行、可中断等待、不可中断等待等状态，可用 ps 或 /proc 观察。锁是协调访问的同步原语，包括互斥锁、自旋锁、读写锁等。等待哪种资源和调度状态是相关但不同的问题。","trap":"可运行不等于当时一定占着 CPU；用户态 std::thread 对象也不是一个完整的内核状态机。","lab":"用 ps -L 和 GDB 查看运行、睡眠、等锁线程的差别。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"Linux man-pages · proc_pid_stat(5)","url":"https://man7.org/linux/man-pages/man5/proc_pid_stat.5.html"},{"label":"Linux man-pages · pthreads(7)","url":"https://man7.org/linux/man-pages/man7/pthreads.7.html"}],"origins":[{"collectionId":"csdn-cpp","no":"46","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X48","category":"cpp","day":4,"priority":"P1","title":"emplace_back 一定比 push_back 更快吗？","answer":"push_back 接收已有对象，复制或移动到尾部；emplace_back 把构造参数转发给元素构造函数，在目标位置构造。若已有 T 对象，两者可能没有明显差别；扩容搬迁旧元素的成本仍然存在。","trap":"emplace_back 不是“永远无拷贝”；它还可能启用意料之外的构造重载。","lab":"对比 push_back(T(args))、emplace_back(args) 和插入已有 T 对象。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · vector.modifiers","url":"https://eel.is/c++draft/vector.modifiers"}],"origins":[{"collectionId":"csdn-cpp","no":"48","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X49","category":"thread","day":11,"priority":"P1","title":"不用一把大锁，还能怎样设计线程安全？","answer":"可以减少共享状态、用线程局部状态、不可变数据、消息传递或分区锁降低竞争；简单计数器等可使用原子操作。无锁结构还必须解决内存回收、ABA 和进度保证等问题，不是替换一个变量类型即可完成。","trap":"原子变量只能直接保证对应原子操作；多步业务约束仍需协议。无锁也不代表没有重试或必然更快。","lab":"将共享可变处理对象改为队列交接的独占对象，比较同步边界。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · intro.races","url":"https://eel.is/c++draft/intro.races"},{"label":"C++ 标准草案 · atomics","url":"https://eel.is/c++draft/atomics"},{"label":"官方文档 / 规范参考","url":"https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines"}],"origins":[{"collectionId":"csdn-cpp","no":"49","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X51","category":"cpp","day":4,"priority":"P1","title":"vector 为什么通常按增长策略扩容？","answer":"为保证连续尾部追加的摊还常数复杂度，常见实现按几何比例增长容量，而不是每次只增加一个元素。增长倍数不是标准固定值；已知规模时 reserve 可以减少重复分配。","trap":"每次 push_back 前都 reserve(size()+1) 可能破坏增长策略，导致大量搬迁；不要死背固定 1.5 倍或 2 倍。","lab":"记录一串 push_back 后 capacity 的变化，并标注编译器和标准库实现。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · vector.capacity","url":"https://eel.is/c++draft/vector.capacity"},{"label":"C++ 标准草案 · vector.modifiers","url":"https://eel.is/c++draft/vector.modifiers"}],"origins":[{"collectionId":"csdn-cpp","no":"51","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X52","category":"cpp","day":7,"priority":"P1","title":"为什么空类对象通常不是 0 字节？","answer":"完整对象必须有非零大小，空类完整对象通常占 1 字节，以便作为不同对象使用。空基类子对象可能通过空基类优化不增加占用；C++20 的 [[no_unique_address]] 又提供了相关优化机会。","trap":"空类大小 1 不是所有对象布局的通用公式；有虚函数、成员或特殊对齐时不再是同一种“空”。","lab":"比较空类完整对象、空基类派生对象和含虚函数类的 sizeof。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · expr.sizeof","url":"https://eel.is/c++draft/expr.sizeof"},{"label":"C++ 标准草案 · intro.object","url":"https://eel.is/c++draft/intro.object"},{"label":"C++ 标准草案 · class.derived","url":"https://eel.is/c++draft/class.derived"}],"origins":[{"collectionId":"csdn-cpp","no":"52","section":"C/C++ 面经"},{"collectionId":"csdn-cpp-core","no":"K20","section":"对象模型 / 空类大小"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X55","category":"embedded","day":22,"priority":"P1","title":"函数参数地址与调用约定由什么决定？","answer":"调用约定属于 ABI，约定参数、返回值、寄存器保存和栈组织等。AArch64 通常优先通过寄存器传递相应参数；参数取地址时编译器可能生成额外存储。不能仅凭参数顺序推导 &a 和 &b 的相对大小。","trap":"x86 特定环境的“从右到左压栈”不适用于所有平台；不同对象间的指针顺序也不能随便用于可移植判断。","lab":"对同一小函数生成主机与 AArch64 汇编，观察寄存器和栈的使用。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"官方文档 / 规范参考","url":"https://github.com/ARM-software/abi-aa/blob/main/aapcs64/aapcs64.rst"},{"label":"C++ 标准草案 · expr.rel","url":"https://eel.is/c++draft/expr.rel"}],"origins":[{"collectionId":"csdn-cpp","no":"55","section":"C/C++ 面经"},{"collectionId":"csdn-cpp","no":"78","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X56","category":"cpp","day":4,"priority":"P0","title":"移动构造与拷贝构造分别承担什么语义？","answer":"拷贝构造通常从已有对象建立一个具有独立有效状态的新对象；移动构造允许接管源对象的资源以降低成本。对标准库对象，移动后通常应保持有效但未指定状态，除非该类型给出更强保证。自定义类型也必须维护自己的约束。","trap":"移动不自动等于浅拷贝；源对象仍要能被正确析构，也不能默认资源地址一定转移。","lab":"用包含 unique_ptr 的对象演示移动，再解释复制为何被禁用或需深拷贝。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · class.copy.ctor","url":"https://eel.is/c++draft/class.copy.ctor"},{"label":"C++ 标准草案 · lib.types.movedfrom","url":"https://eel.is/c++draft/lib.types.movedfrom"}],"origins":[{"collectionId":"csdn-cpp","no":"56","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X58","category":"cpp","day":4,"priority":"P1","title":"哈希碰撞和 hash/equal 一致性怎么解释？","answer":"不同键可能得到相同哈希值，常见解决策略包括分离链接和开放定址；标准 unordered 容器以桶等抽象组织元素。等价键必须得到相同哈希结果，碰撞时仍需要相等比较判定是否为同一键。","trap":"哈希值相同不等于键相同；哈希容器平均常数复杂度不排除最坏线性行为。","lab":"自定义一个故意产生大量碰撞的哈希函数，观察查找正确性与性能变化。","points":[],"follow":["结合小实验，解释这条规则的适用前提。"],"code":"","sources":[{"label":"C++ 标准草案 · unord.req","url":"https://eel.is/c++draft/unord.req"}],"origins":[{"collectionId":"csdn-cpp","no":"58","section":"C/C++ 面经"}],"answerKind":"学习版整理","license":"CC BY-SA 4.0"},{"id":"X59","category":"cpp","day":4,"priority":"P1","title":"unordered_map 的 rehash 与 reserve 会影响什么？","answer":"元素数量、桶数量和最大负载因子共同影响是否需要重哈希。reserve 为预计元素规模准备容量，rehash 调整桶规模并重新组织元素。重哈希会使迭代器失效，但标准容器的元素引用和指针通常不因此失效。","trap":"不能把桶数量当成元素数量；删除对应元素仍会让其引用失效。","lab":"记录 size、bucket_count 和 load_factor，比较提前
